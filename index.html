  function styleEinmal() {
    if (document.getElementById('wbl-css')) return;
    var s = document.createElement('style');
    s.id = 'wbl-css'; s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* Dialog zum Freischalten. opt: {titel, werkzeug, merkmale:[…]} */
  function dialog(opt, beiErfolg) {
    styleEinmal();
    var d = document.getElementById('wbl-dlg');
    if (d) d.remove();
    d = document.createElement('dialog');
    d.id = 'wbl-dlg'; d.className = 'wbl-dlg';
    d.innerHTML =
      '<div class="wbl-in"><div class="wbl-scroll">' +
        '<h2>' + esc(opt.titel || 'Werkzeug freischalten') + '</h2>' +
        '<p>Schlüssel einfügen oder die Lizenzdatei wählen. Der Schlüssel gilt für ' +
        'alle Werkzeuge, die er nennt – in diesem Browser.</p>' +
        '<textarea id="wbl-ein" spellcheck="false" autocomplete="off" ' +
        'autocapitalize="off" autocorrect="off" ' +
        'placeholder="WB1.…"></textarea>' +
        '<p class="wbl-msg" id="wbl-msg"></p>' +
        /* Die Merkmale stehen unter dem Feld: wer den Dialog öffnet, will
           meist einfügen, nicht lesen. */
        (opt.merkmale && opt.merkmale.length
          ? '<p class="wbl-was">Was dieses Werkzeug kann</p><ul>'
            + opt.merkmale.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('')
            + '</ul>'
          : '') +
      '</div>' +
        '<div class="wbl-row">' +
          '<label class="wbl-btn">Datei wählen' +
            '<input type="file" id="wbl-datei" accept=".wblic,.txt,.json" hidden></label>' +
          '<button type="button" class="wbl-txt" id="wbl-weg">Lizenz entfernen</button>' +
          '<span class="wbl-sp"></span>' +
          '<button type="button" class="wbl-btn" id="wbl-zu">Schließen</button>' +
          '<button type="button" class="wbl-btn wbl-pri" id="wbl-ok">Freischalten</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(d);

    var feld = d.querySelector('#wbl-ein'), msg = d.querySelector('#wbl-msg');
    function sag(t, gut) { msg.textContent = t; msg.className = 'wbl-msg ' + (gut ? 'wbl-good' : 'wbl-bad'); }

    d.querySelector('#wbl-datei').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      f.text().then(function (t) {
        var m = t.match(/WB1\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+/);

    });
    d.querySelector('#wbl-ok').addEventListener('click', function () {
      speichern(feld.value).then(function (p) {
        sag('Freigeschaltet für ' + (p.n || 'dich') + '.', true);
        if (beiErfolg) beiErfolg(p);
        setTimeout(function () { location.reload(); }, 700);
      }).catch(function (e) { sag(grundText(e.message)); });
    });

    var vorhanden = roh();
    if (vorhanden) feld.value = vorhanden;
    d.showModal();
    feld.focus();

  }

  /* Band oben bzw. Zeile unten, je nach Lage.
     opt: {werkzeug, titel, build, merkmale:[…], ziel:Element} */

    return stand(opt.werkzeug, opt.build).then(function (s) {
      styleEinmal();
      var alt = document.getElementById('wbl-band');
      if (alt) alt.remove();
      var el = document.createElement('div');
      el.id = 'wbl-band'; el.className = 'wbl-band';

      var frei = s.status === 'frei' && s.grund !== 'wartung';
      var ziel = (frei ? (opt.zielOk || document.body) : opt.ziel) || document.body;
      if (opt.haftend === false && !frei) el.className += ' wbl-still';

      if (frei) {
        el.className += ' wbl-ok';
        el.innerHTML = 'Lizenziert für ' + esc(s.name) +
          (s.nummer ? ' · ' + esc(s.nummer) : '') +
          (s.modus === 'miete' && s.bis ? ' · Laufzeit bis ' + tagDe(s.bis) : '');
        ziel.appendChild(el);
      } else {
        var txt = (opt.text && opt.text(s)) ||
          (s.status === 'schaufenster'
            ? '<b>Schaufenster</b> · Speichern, Datei-Verknüpfung und Ausgabe sind gesperrt.'
          : s.status === 'nurlesen'
            ? '<b>Laufzeit abgelaufen</b> · Lesen und Ausgabe bleiben, Speichern ist gesperrt.'
            : '<b>Wartungsfenster abgelaufen</b> · Diese Fassung ist neuer als deine Lizenz.');
        el.innerHTML = txt + '<span class="wbl-sp"></span>' +
          '<button type="button" class="wbl-btn wbl-pri" id="wbl-auf">' +
          (s.status === 'frei' ? 'Verlängern' : 'Freischalten') + '</button>';
        ziel.insertBefore(el, ziel.firstChild);
        el.querySelector('#wbl-auf').addEventListener('click', function () {
          dialog({ titel: opt.titel, werkzeug: opt.werkzeug, merkmale: opt.merkmale });

    });

  global.addEventListener('storage', function (e) {
    if (e.key === LS_KEY) location.reload();
  });

  global.WBLizenz = {
    setzePruefschluessel: function (b64) { PUB_B64 = b64; pubCache = null; },
    pruefbereit: pruefbereit,
    saeubern: saeubern,
    ausUrl: ausUrl,
    ausUrlUebernehmen: ausUrlUebernehmen,
    stand: stand,
    pruefeText: pruefeText,
    speichern: speichern,
    loeschen: loeschen,
    roh: roh,
    dialog: dialog,
    leiste: leiste,
    grundText: grundText,
    /* true, wenn Schreiben gesperrt ist – ein Aufruf für alle Speicherwege */
    gesperrt: function (s) { return !s || s.status !== 'frei'; },
    /* true, wenn gar nichts Echtes gezeigt werden darf */
    schaufenster: function (s) { return !s || s.status === 'schaufenster'; }
  };
})(window);

<script>
/* ============================================================
   WBTor — Lizenztor für ein einzelnes Werkzeug
   ------------------------------------------------------------
   Setzt die Lizenz durch, ohne dass im Werkzeug selbst etwas
   umgebaut werden muss. Das Tor wird VOR dem Werkzeugskript
   eingebunden und schließt sofort; geöffnet wird erst, wenn die
   Lizenz geprüft ist.

   Im Werkzeug ist genau eine Zeile zu ändern:
       boot();          →     WBTor.start(boot);

   Drei Lagen (aus lizenz.js):
     frei         – Tor offen, nichts wird angefasst
     nurlesen     – eigener Bestand sichtbar, Ausgabe erlaubt,
                    kein Schreiben
     schaufenster – hat das Gerät schon einen eigenen Bestand,
                    verhält es sich wie nurlesen (Daten sind nie
                    Geisel). Sonst Beispieldaten, ohne Ausgabe.

   Gesperrt wird auf vier Ebenen, damit nichts durchrutscht:
     1. Bedienung  – Knöpfe und Formulare, die schreiben
     2. Ablage     – localStorage-Schlüssel des Werkzeugs
     3. Datei      – Dateiauswahl und Schreibzugriff
     4. Ausgabe    – Druck und Export, nur im Beispielbetrieb
   ============================================================ */
(function (global) {
  'use strict';

  var cfg = null;          // Konfiguration des Werkzeugs
  var lage = null;         // Lage aus WBLizenz.stand()
  var zu = true;           // Tor geschlossen, bis geprüft
  var beispiel = false;    // Beispieldaten statt eigenem Bestand
  var offenOhnePruefung = false;  // Fassung ohne Prüfschlüssel
  var eigen = new Set();   // localStorage-Schlüssel des Werkzeugs
  var demo = {};           // Schlüssel → JSON-Text

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ── 2. Ablage ─────────────────────────────────────────── */
  var P = global.Storage && Storage.prototype;
  if (P) {
    var oGet = P.getItem, oSet = P.setItem, oDel = P.removeItem;
    P.getItem = function (k) {
      if (this === localStorage && beispiel && Object.prototype.hasOwnProperty.call(demo, k)) return demo[k];
      return oGet.call(this, k);
    };
    P.setItem = function (k, v) {
      if (this === localStorage && zu && eigen.has(k)) return;
      return oSet.call(this, k, v);
    };
    P.removeItem = function (k) {
      if (this === localStorage && zu && eigen.has(k)) return;
      return oDel.call(this, k);
    };

  /* ── 3. Datei ──────────────────────────────────────────── */
  var oOpen = global.showOpenFilePicker, oSave = global.showSaveFilePicker;
  if (oOpen) global.showOpenFilePicker = function () {
    if (zu) return sperrfehler();
    return oOpen.apply(global, arguments);
  };
  if (oSave) global.showSaveFilePicker = function () {
    if (zu) return sperrfehler();
    return oSave.apply(global, arguments);
  };
  if (global.FileSystemFileHandle && FileSystemFileHandle.prototype.createWritable) {
    var oW = FileSystemFileHandle.prototype.createWritable;
    FileSystemFileHandle.prototype.createWritable = function () {
      if (zu) return sperrfehler();
      return oW.apply(this, arguments);
    };

  function sperrfehler() {
    var e = new Error('Ohne Lizenz wird nicht in Dateien geschrieben.');
    e.name = 'AbortError';           // die Werkzeuge behandeln das still
    dialogAuf();

  }

  /* ── 4. Ausgabe ────────────────────────────────────────── */
  var oPrint = global.print;
  global.print = function () {
    if (beispiel) { dialogAuf(); return; }
    return oPrint.apply(global, arguments);
  };

  /* ── 1. Bedienung ──────────────────────────────────────── */
  function trifft(el, sel) {
    if (!sel || !el || !el.closest) return false;
    try { return !!el.closest(sel); } catch (e) { return false; }
  }
  function abfangen(ev) {
    if (!cfg) return;
    var t = ev.target;
    var schreibt = zu && trifft(t, cfg.schreiben);
    var gibtAus  = beispiel && trifft(t, cfg.ausgabe);
    if (!schreibt && !gibtAus) return;
    ev.preventDefault();
    ev.stopImmediatePropagation();
    dialogAuf();
  }
  document.addEventListener('click', abfangen, true);
  document.addEventListener('submit', abfangen, true);

  function dialogAuf() {
    if (!cfg || !global.WBLizenz) return;
    WBLizenz.dialog({ titel: cfg.titel, werkzeug: cfg.werkzeug, merkmale: cfg.merkmale });
  }

  /* ── Band und Fußknopf ─────────────────────────────────── */
  function anker() {
    var a = document.createElement('div');
    var nach = cfg.nach && document.querySelector(cfg.nach);
    if (nach && nach.insertAdjacentElement) nach.insertAdjacentElement('afterend', a);
    else {
      var m = document.querySelector(cfg.ziel || 'main') || document.body;
      m.insertBefore(a, m.firstChild);
    }
    return a;
  }
  function fussknopf() {
    if (!cfg.fuss) return;
    var f = document.querySelector(cfg.fuss);
    if (!f) {
      /* Manche Werkzeuge rufen start() beim Parsen auf – dann steht die
         Fußzeile noch nicht. Einmal nachfassen, sobald sie da ist. */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fussknopf, { once: true });
      }
      return;
    }
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cfg.fussKlasse || 'pill sm';
    b.textContent = lage && lage.status === 'frei' ? 'Lizenz' : 'Freischalten';
    b.addEventListener('click', dialogAuf);
    /* Vor den letzten Eintrag – der ist in allen Werkzeugen der Verweis
       nach draußen, und davor gehört der Lizenzknopf hin. */
    var letzter = f.lastElementChild;
    if (letzter) f.insertBefore(b, letzter); else f.appendChild(b);
  }

  /* ── Tor ───────────────────────────────────────────────── */
  function WBTor(k) {
    cfg = Object.assign({
      werkzeug: '', build: '', titel: 'Werkzeug freischalten', merkmale: [],
      eigen: [], demo: {}, schreiben: '', ausgabe: '', nach: '', ziel: 'main', fuss: ''
    }, k || {});
    eigen = new Set(cfg.eigen);
    /* Beispieldaten einmal in Text verwandeln – getItem gibt Text zurück */
    demo = {};
    Object.keys(cfg.demo).forEach(function (s) {
      demo[s] = typeof cfg.demo[s] === 'string' ? cfg.demo[s] : JSON.stringify(cfg.demo[s]);
    });
  }

  /* Liegt auf diesem Gerät schon ein eigener Bestand? Dann wird er auch
     ohne Lizenz gezeigt – lesen und sichern bleibt immer möglich. */
  function bestandDa() {
    for (var i = 0; i < cfg.eigen.length; i++) {
      try {
        var v = localStorage.getItem(cfg.eigen[i]);
        if (v && v.length > 40) return true;
      } catch (e) {}
    }
    return false;
  }

  WBTor.start = function (starten) {
    if (!cfg) { starten(); return; }
    var hat = bestandDa();
    var weiter = function (s) {
      lage = s || { status: 'schaufenster', grund: 'keine' };
      /* Fassung ohne hinterlegten Prüfschlüssel: das Tor kann nichts prüfen und
         bleibt offen, weist aber unübersehbar darauf hin. So sperrt sich niemand
         aus – und eine ungeschützte Fassung geht nicht unbemerkt ins Netz. */
      offenOhnePruefung = lage.grund === 'kein-pubkey' ||
        (global.WBLizenz && WBLizenz.pruefbereit && !WBLizenz.pruefbereit());
      zu = lage.status !== 'frei' && !offenOhnePruefung;
      beispiel = lage.status === 'schaufenster' && !hat && !offenOhnePruefung;
      try {
        WBLizenz.leiste({
          werkzeug: cfg.werkzeug, build: cfg.build, titel: cfg.titel,
          merkmale: cfg.merkmale, ziel: anker(), haftend: false,
          /* Das Band sagt genau das, was in dieser Lage gilt. */
          text: function (s) {
            if (offenOhnePruefung) {
              return '<b>Kein Prüfschlüssel hinterlegt</b> · Diese Fassung ist nicht ' +
                     'lizenzgeschützt. In lizenz.js den Prüfschlüssel der Lizenzstelle eintragen.';
            }
            if (s.status === 'schaufenster') {
              return beispiel
                ? '<b>Schaufenster</b> · Beispieldaten. Speichern, Datei und Ausgabe sind gesperrt.'
                : '<b>Ohne Lizenz</b> · Dein Bestand bleibt lesbar und sicherbar, Speichern ist gesperrt.';
            }
            return null;
          }
        });
      } catch (e) {}
      try { fussknopf(); } catch (e) {}
      starten();
    };
    if (!global.WBLizenz) { weiter(null); return; }
    var pruefen = function () {
      WBLizenz.stand(cfg.werkzeug, cfg.build).then(weiter, function () { weiter(null); });
    };
    /* Steht ein Schlüssel in der Adresse, wird er zuerst übernommen. */
    if (WBLizenz.ausUrlUebernehmen && WBLizenz.ausUrl && WBLizenz.ausUrl()) {
      hat = true;                       // Freischaltung per Link: nie Beispieldaten
      WBLizenz.ausUrlUebernehmen().then(pruefen, pruefen);
    } else pruefen();
  };

  WBTor.lage = function () { return lage; };
  WBTor.zu = function () { return zu; };
  WBTor.beispiel = function () { return beispiel; };
  WBTor.dialog = dialogAuf;

  global.WBTor = WBTor;
})(window);
</script>

<script>
(() => {
'use strict';
/* Aus dem Kontor gestartet? Dann (und nur dann) oben links der Weg zurück.
   Erkannt am Herkunftslink oder an ?von=kontor; gilt für den ganzen Tab. */
(() => {
  let ja = false;
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('von') === 'kontor' || /^https:\/\/maikunverricht\.github\.io\/Kontor(\/|\?|#|$)/i.test(document.referrer))
      sessionStorage.setItem('noteos.kontor', '1');
    ja = sessionStorage.getItem('noteos.kontor') === '1';
  } catch(e){}
  if (!ja) return;
  document.body.classList.add('aus-kontor');
  document.getElementById('kontorZurueck').hidden = false;
  document.querySelectorAll('.nur-kontor').forEach(el => { el.hidden = false; });
})();

/* ════════════════════════════════════════════════════════════════
   WERKBANK-BUS · gleichlautend in jedem Werkzeug
   Alle Werkzeuge liegen unter derselben Herkunft, teilen sich also
   Speicher. Wer etwas ändert, sagt Bescheid; die anderen ziehen nach.
   ════════════════════════════════════════════════════════════════ */
const WB = (function(){
  const KANAL = 'werkbank', WECK = 'wb-signal';
  const eigen = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const hoerer = [];
  let bc = null;
  try { bc = new BroadcastChannel(KANAL); } catch (e) {}
  function zustellen(n){
    if (!n || typeof n !== 'object' || n.von === eigen) return;
    for (let i = 0; i < hoerer.length; i++){
      const h = hoerer[i];
      if (h.thema && h.thema !== n.thema) continue;
      try { h.fn(n); } catch (e) {}
    }
  }
  if (bc) bc.onmessage = e => zustellen(e.data);
  addEventListener('storage', e => {
    if (e.key !== WECK || !e.newValue) return;
    try { zustellen(JSON.parse(e.newValue)); } catch (err) {}
  });
  return {
    id: eigen,
    melden(thema, zusatz){
      const n = Object.assign({ thema, von: eigen, zeit: Date.now() }, zusatz || {});
      if (bc) { try { bc.postMessage(n); } catch (e) {} }
      try { localStorage.setItem(WECK, JSON.stringify(n)); } catch (e) {}
    },
    horchen(thema, fn){ hoerer.push({ thema, fn }); },
    lesen(k){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } },
    schreiben(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  };
})();
const WB_NOTES_LS = 'wb-noteos-stand';

/* Aussehen gilt für die ganze Werkbank. Geschrieben werden beide
   Schlüssel — jedes Werkzeug liest beim Start seinen eigenen, und so
   finden alle denselben Stand vor. Gemeldet wird zusätzlich über den
   Bus, damit offene Fenster sofort mitziehen. */
const WB_THEME_KEYS = ['wb-theme', 'wb-cockpit-theme'];
function wbThemeSichern(t){
  WB_THEME_KEYS.forEach(k => { try { localStorage.setItem(k, t); } catch (e) {} });
}
const WB_AB_LS = 'wb-auftragsbuch-data';

/* ═══════ Auftraggeber-Register ═══════
   Eine Notiz, die zu einem Auftraggeber gehört, merkt sich dessen `agbId`.
   Der Name steht nur als Etikett daneben – in `category` und in `tags[0]`,
   damit Suche, Farben und Haufen weiter über den Namen laufen. Wird im
   Auftragsbuch umbenannt, zieht das Etikett beim nächsten Lesen nach; die
   Bindung hängt an der ID und reißt nicht.

   Fehlt das Auftragsbuch, bleibt alles wie zuvor: Kategorien sind dann
   einfach Namen, und keine Notiz verliert etwas. */
const WB_MIGR_LS = 'noteos.agb-verknuepft';
/* Seit 30.10.2026 steht das Notizbuch für sich (Ansicht „Produktiv“ im
   Kontor): es liest das Auftragsbuch nicht mehr und meldet nichts zurück.
   Der Bezug zu Aufträgen wird im Auftragsstatus geführt. Eine `agbId`, die
   schon in einer Datei steht, bleibt beim Speichern erhalten, wird aber
   nicht mehr ausgewertet. Die Funktionen bleiben leer stehen, damit der
   Rest unverändert läuft. */
function agbBestand(){ return []; }
/* Alle, auch inaktive: ein Etikett soll auch für einen stillgelegten
   Auftraggeber noch stimmen. */
function agbNachId(){
  const m = new Map();
  agbBestand().forEach(x => m.set(String(x.id), String(x.name)));
  return m;
}
/* Nur aktive: was zur Auswahl steht und was der Vorschlag anbietet. */
function agbNachName(){
  const m = new Map();
  agbBestand().filter(x => x.aktiv !== false).forEach(x => m.set(String(x.name), String(x.id)));
  return m;
}
function auftraggeberNamen(){
  return [...agbNachName().keys()].sort((a,b) => a.localeCompare(b,'de'));
}
/* Etiketten nachziehen: für jede Notiz mit agbId den heutigen Namen setzen.
   Die Datei behält ihren alten Namen in tags[0] – geschrieben wird erst,
   wenn die Notiz ohnehin gespeichert wird. Die ID führt, nicht der Name. */
function etikettenNachziehen(list){
  const reg = agbNachId();
  if (!reg.size) return 0;
  let n = 0;
  list.forEach(x => {
    if (!x || !x.agbId) return;
    const name = reg.get(String(x.agbId));
    if (!name || name === x.category) return;
    if (Array.isArray(x.tags)) {
      const i = x.tags.indexOf(x.category);
      if (i >= 0) x.tags[i] = name; else x.tags.unshift(name);
      x.tags = [...new Set(x.tags)];
    }
    x.category = name;
    n++;
  });
  return n;
}

const $ = (s, r=document) => r.querySelector(s);

const TODAY = new Date('2026-08-02');

const fmt = d => d.toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const c = v => Math.max(0,Math.min(255, v + Math.round(255*amt)));
  return '#'+((1<<24)+(c(n>>16)<<16)+(c((n>>8)&255)<<8)+c(n&255)).toString(16).slice(1);

/* Akzente aus der Cockpit-Familie: Amber/Teal als Achse, dazu drei
   gedämpfte Töne, die auf Fast-Schwarz wie auf Hell noch tragen. */
const CATS = { Rezept:'#F2B33D', Projekt:'#63D9C4', Arbeit:'#8FA6FF', Alltag:'#AEBAC7',
               Reise:'#F58F7C', Lernen:'#B79BFF', Familie:'#F7CF83', 'E-Mail':'#5FB3F0' };
const FALLBACK_COLORS = ['#F2B33D','#63D9C4','#8FA6FF','#B79BFF'];
function colorForCategory(cat){
  if (CATS[cat]) return CATS[cat];
  let h = 0; for (let i=0;i<cat.length;i++) h = (h + cat.charCodeAt(i)) % FALLBACK_COLORS.length;
  return FALLBACK_COLORS[h];
}
function slugify(title, taken){
  let base = title.toLowerCase()
    .replace(/[äöüß]/g, c => ({'ä':'ae','ö':'oe','ü':'ue','ß':'ss'}[c]))
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'notiz';
  let name = base, i = 2;
  while (taken.has(name+'.md')) name = base+'-'+(i++);
  return name + '.md';

const MD_TAG = { b:'strong', i:'em', s:'s', u:'u', m:'mark' };

const safeUrl = u => { u = String(u || '').trim(); return !u || /^(javascript|data|vbscript):/i.test(u.replace(/\s+/g,'')) ? '#' : u; };
function inlineMdToHtml(text){
  const s = String(text ?? '');
  const st = [];

  const open = k => { st.push(k); out += '<'+MD_TAG[k]+'>'; };
  const close = k => {
    const at = st.lastIndexOf(k); if (at < 0) return;
    const weg = st.splice(at);

    weg.slice(1).forEach(open);                    /* was darüber lag, geht wieder auf */

  while (i < s.length){
    const c = s[i];
    if (c === '\\' && i + 1 < s.length && /[\\*~`\[\]<>_#\-+.!|()]/.test(s[i+1])){ out += escH(s[i+1]); i += 2; continue; }

function listHtml(items){
  let html = '';
  const stack = [];
  items.forEach(it => {
    const lvl = Math.min(it.lvl, stack.length);
    const typ = it.ord ? 'ol' : 'ul';
    while (stack.length > lvl + 1) html += '</li></'+stack.pop()+'>';
    if (stack.length === lvl + 1){
      if (stack[lvl] !== typ) html += '</li></'+stack.pop()+'>';
      else html += '</li>';
    }
    if (stack.length === lvl){ html += '<'+typ+'>'; stack.push(typ); }
    html += '<li>'+inlineMdToHtml(it.text);
  });
  while (stack.length) html += '</li></'+stack.pop()+'>';
  return html;
}
function contentToHtml(lines){
  const L = Array.isArray(lines) ? lines : [];
  let html = '', i = 0;
  while (i < L.length){
    const line = String(L[i] ?? '').replace(/\s+$/,'');
    if (MD_FENCE.test(line)){
      const code = []; i++;
      while (i < L.length && !MD_FENCE.test(L[i])){ code.push(L[i]); i++; }
      i++;
      html += '<pre><code>'+escHs(code.join('\n'))+'</code></pre>';
      continue;
    }
    if (MD_LIST.test(line) && !/^\s*(\*\s*){3,}$|^\s*(-\s*){3,}$/.test(line)){
      const items = [];
      while (i < L.length && MD_LIST.test(L[i])){
        const m = MD_LIST.exec(L[i]);
        items.push({ lvl: Math.floor(m[1].replace(/\t/g,'  ').length / 2), ord: /\d/.test(m[2]), text: m[3] });
        i++;
      }
      html += listHtml(items);
      continue;
    }
    i++;
    const t = line.trim();
    if (!t) continue;
    if (t === '&nbsp;'){ html += '<p><br></p>'; continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(t);
    if (h){ const n = Math.min(h[1].length, 4); html += '<h'+n+'>'+inlineMdToHtml(h[2])+'</h'+n+'>'; continue; }
    if (/^>\s?/.test(t)){ html += '<blockquote>'+inlineMdToHtml(t.replace(/^>\s?/,''))+'</blockquote>'; continue; }
    if (/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(t)){ html += '<hr>'; continue; }
    html += '<p>'+inlineMdToHtml(t)+'</p>';
  }
  return html;
}
/* Rohtext einer .md-Datei → Zeilen. Leerzeilen trennen nur, außer im Code;

function bodyToLines(body){
  const out = [];
  let fence = false;
  String(body || '').split(/\r?\n/).forEach(l => {
    const r = l.replace(/\s+$/,'');
    if (MD_FENCE.test(r)){ fence = !fence; out.push(r.trim()); return; }
    if (fence){ out.push(r); return; }
    if (r.trim()) out.push(r);
  });
  return out;
}
/* Zeilen → Dateitext. Listen und Code stehen dicht, alles andere mit

function linesToMd(lines){
  let out = '', fence = false;
  (lines || []).forEach((l, i) => {
    if (i){
      const dicht = fence || (MD_LIST.test(lines[i-1]) && MD_LIST.test(l));
      out += dicht ? '\n' : '\n\n';
    }
    out += l;
    if (MD_FENCE.test(l)) fence = !fence;
  });
  return out;
}

function arenaGroups(list){

  }
  if (sortMode === 'neu' || sortMode === 'erstellt'){
    const key = n => (sortMode === 'neu' ? n.modifiedSort : (n.createdSort || n.modifiedSort));
    const now = Date.now(), tag = 864e5;
    const buckets = [
      { key:'w', label:'Diese Woche', max:7*tag },
      { key:'m', label:'Dieser Monat', max:31*tag },
      { key:'q', label:'Letzte 3 Monate', max:92*tag },
      { key:'j', label:'Dieses Jahr', max:366*tag },
      { key:'a', label:'Älter', max:Infinity }

    list.forEach(n => {
      const age = now - key(n);
      const b = buckets.find(x => age <= x.max) || buckets[buckets.length-1];

    return buckets.filter(b => by[b.key]).map(b => ({
      key:b.key, label:b.label, notes:by[b.key].slice().sort((x,y)=>key(y)-key(x)), cat:null }));

  if (g && ACHSEN[g.s] && ACHSEN[g.z] && g.s !== g.z){ wf.s = g.s; wf.z = g.z; }
} catch(e){}
const wfE = () => ACHS_REIHE.find(a => a !== wf.s && a !== wf.z);
/* Blickwinkel des Würfels – Ziehen dreht ihn, ⌖ stellt ihn zurück. */
const WF_BLICK = { rx:58, rz:-38 };
const wfBlick = { ...WF_BLICK };
const WF_BLICKE = {
  schraeg: { name:'Schräg', rx:58, rz:-38 },
  oben:    { name:'Oben',   rx:0,  rz:0 },
  seite:   { name:'Seite',  rx:78, rz:-14 }
};
const wfBlickIst = k => Math.abs(wfBlick.rx - WF_BLICKE[k].rx) < .5 && Math.abs(wfBlick.rz - WF_BLICKE[k].rz) < .5;
function wfBlickFahren(ziel){
  const cin = $('.cube-in');
  /* auf dem kürzesten Weg drehen */
  let rz = ziel.rz; while (rz - wfBlick.rz > 180) rz -= 360; while (rz - wfBlick.rz < -180) rz += 360;
  wfBlick.rx = ziel.rx; wfBlick.rz = rz;
  if (cin){
    cin.classList.add('faehrt');
    wfBlickSetzen(cin);
    clearTimeout(wfBlickFahren.t);
    wfBlickFahren.t = setTimeout(() => cin.classList.remove('faehrt'), 750);
  }
  $$('.cube-blick').forEach(b => b.classList.toggle('on', wfBlickIst(b.dataset.blick)));
  wfMerken();
}
try {
  const g = JSON.parse(localStorage.getItem('noteos.wuerfel') || 'null');
  if (g && isFinite(g.rx) && isFinite(g.rz)){ wfBlick.rx = Math.min(90, Math.max(0, +g.rx)); wfBlick.rz = +g.rz; }
} catch(e){}
function wfMerken(){ try { localStorage.setItem('noteos.wuerfel', JSON.stringify({ s:wf.s, z:wf.z, rx:Math.round(wfBlick.rx), rz:Math.round(wfBlick.rz) })); } catch(e){} }
function statusLabel(v){ return (STATUS_W.find(w => w[0] === v) || STATUS_W[0])[1]; }
function prioLabel(v){ return (PRIO_W.find(w => w[0] === v) || PRIO_W[1])[1]; }
function wertLabel(achse, v){ return achse === 'status' ? statusLabel(v) : achse === 'prio' ? prioLabel(v) : (v || 'Niemand'); }

function kanbanKarte(n, zeigeEbene){
  const e = wfE();
  const meta = zeigeEbene
    ? '<span class="kc-chip">'+esc(ACHSEN[e].name)+': '+esc(wertLabel(e, ACHSEN[e].von(n)))+'</span>' : '';
  const fertig = nStatus(n) === 'erledigt';
  return '<div class="kc'+(fertig ? ' done' : '')+'" data-note="'+n.id+'" tabindex="0" role="button"'
    + ' data-ws="'+esc(ACHSEN[wf.s].von(n))+'" data-wz="'+esc(ACHSEN[wf.z].von(n))+'" data-we="'+esc(ACHSEN[e].von(n))+'"'
    + ' style="--acc:'+n.accent+'" aria-label="'+esc(n.title)+' öffnen">'
    + '<div class="kc-top"><span class="kc-dot"></span><span class="kc-cat">'+esc(n.category)+'</span>'
    +   '<span class="kc-acts">'
    +     '<button class="kc-ok" type="button" title="'+(fertig ? 'Wieder öffnen' : 'Erledigt')+'" aria-label="'+(fertig ? 'Wieder öffnen' : 'Als erledigt markieren')+'">'+(fertig ? '↺' : '✓')+'</button>'
    +     '<button class="kc-del" type="button" title="In den Papierkorb" aria-label="In den Papierkorb">✕</button>'
    +   '</span></div>'
    + '<div class="kc-t">'+esc(n.title)+'</div>'
    + (meta ? '<div class="kc-m">'+meta+'</div>' : '')
    + '</div>';
}
let wfPlatz = {};                 /* Ebene → angezeigter Platz im Stapel (0 = unten) */
function wfTauschen(){
  const cin = $('.cube-in');
  if (!cin) return;
  const teile = $$('.cube-in [data-k]').filter(el => el.style.getPropertyValue('--k') !== el.dataset.k);
  const topWeg = cin.style.getPropertyValue('--top') !== cin.dataset.top;
  if (!teile.length && !topWeg) return;
  cin.classList.add('tauscht');
  void cin.offsetWidth;                                   /* alten Platz erst zeichnen */
  requestAnimationFrame(() => {
    teile.forEach(el => el.style.setProperty('--k', el.dataset.k));
    cin.style.setProperty('--top', cin.dataset.top);
    clearTimeout(wfTauschen.t);
    wfTauschen.t = setTimeout(() => cin.classList.remove('tauscht'), 900);
  });
}
/* Erledigte Notizen liegen je Zelle gestaffelt als Stapel; ein Klick fächert ihn auf. */
const wfAufgefaechert = new Set();
function kcStapel(fertig, key){
  if (!fertig.length) return '';
  const auf = wfAufgefaechert.has(key);
  const n = fertig.length;
  return '<div class="kc-stapel'+(auf ? ' auf' : '')+'" data-key="'+esc(key)+'" style="--n:'+Math.min(n, 4)+'">'
    + '<button class="kc-stapel-kopf" type="button" aria-expanded="'+auf+'"'
    +   ' title="'+(auf ? 'Stapel schließen' : 'Stapel auffächern')+'">'
    +   '<span>✓ '+n+' erledigt</span><i>'+(auf ? '▴' : '▾')+'</i></button>'
    + '<div class="kc-stapel-k">'
    +   fertig.map((x, i) => kanbanKarte(x, wf.ebene === null).replace('style="--acc:', 'style="--i:'+Math.min(i, 4)+';--acc:')).join('')
    + '</div></div>';
}
function wuerfelBild(list, sp, ze, eb, e){
  /* Zählen je Ebene und Zelle – über die gefilterte Liste, nicht nur die Schicht. */
  const z = {};
  let max = 1;
  list.forEach(n => {
    const k = ACHSEN[e].von(n)+'|'+ACHSEN[wf.z].von(n)+'|'+ACHSEN[wf.s].von(n);
    z[k] = (z[k] || 0) + 1; max = Math.max(max, z[k]);
  });
  /* Die markierte Ebene tauscht den Platz mit der obersten. Gezeichnet
     wird erst am alten Platz, wfTauschen() schiebt sie dann animiert hin. */
  const oben = eb.length - 1, gew = eb.findIndex(w => w[0] === wf.ebene);
  /* Fahrstuhl: die gewählte Ebene fährt frei über alle, die übrigen rücken
     in ihrer Reihenfolge eng zusammen. */
  const DICHT = .32, ABSTAND = 1.35;
  const platz = k => gew < 0 ? k : k === gew ? (oben - 1) * DICHT + ABSTAND : (k < gew ? k : k - 1) * DICHT;
  const topNeu = gew < 0 ? oben : (oben - 1) * DICHT + ABSTAND;
  const topAlt = ('__top|'+e) in wfPlatz ? wfPlatz['__top|'+e] : topNeu;
  const neuePlaetze = {};
  const ebenen = eb.map(([v, lab], k) => {
    const schl = e+'|'+v, ziel = platz(k);
    const alt = schl in wfPlatz ? wfPlatz[schl] : ziel;
    neuePlaetze[schl] = ziel;
    const summe = list.filter(n => ACHSEN[e].von(n) === v).length;
    const zellen = ze.map(([zv]) => sp.map(([sv]) => {
      const c = z[v+'|'+zv+'|'+sv] || 0;
      const st = c ? c / max : 0;
      return '<i class="'+(c ? (st < .45 ? 'lo' : '') : 'leer')+'" data-s="'+esc(sv)+'" data-z="'+esc(zv)+'" style="--c:'+st.toFixed(2)+'">'+(c || '')+'</i>';
    }).join('')).join('');
    const an = wf.ebene === v;
    return '<button class="cube-l'+(an ? ' on' : '')+(wf.ebene !== null && !an ? ' aus' : '')+'" type="button" data-ebene="'+esc(v)+'"'
      + ' style="--k:'+alt+'" data-k="'+ziel+'" aria-pressed="'+(an ? 'true' : 'false')+'"'
      + ' aria-label="Ebene '+esc(lab)+': '+summe+' Notizen">'
      + '<span class="cube-g">'+zellen+'</span></button>'
      + '<button class="cube-ll'+(an ? ' on' : '')+(wf.ebene !== null && !an ? ' aus' : '')+'" type="button" tabindex="-1"'
      +   ' data-ebene="'+esc(v)+'" style="--k:'+alt+'" data-k="'+ziel+'" aria-hidden="true">'+esc(lab)+'<b>'+summe+'</b></button>';
  }).join('');
  neuePlaetze['__top|'+e] = topNeu;
  wfPlatz = neuePlaetze;
  const achsen = '<div class="cube-ach" aria-hidden="true">'
    + '<span class="cube-lin x"></span><span class="cube-lin y"></span><span class="cube-lin z"></span>'
    + '<span class="cube-tit x">'+esc(ACHSEN[wf.s].name)+'</span>'
    + '<span class="cube-tit y">'+esc(ACHSEN[wf.z].name)+'</span>'
    + '<span class="cube-tit z">'+esc(ACHSEN[e].name)+' ↕</span>'
    + sp.map(([, lab], i) => '<span class="cube-cl" style="--i:'+i+'" title="'+esc(lab)+'">'+esc(lab)+'</span>').join('')
    + ze.map(([, lab], i) => '<span class="cube-rl" style="--i:'+i+'" title="'+esc(lab)+'">'+esc(lab)+'</span>').join('')
    + '</div>';
  const gf = Math.min(.32, .9 / Math.max(eb.length - 1, 1));
  const cubeVars = '--n:'+eb.length+';--gf:'+gf.toFixed(3)+';--cols:'+sp.length+';--rows:'+ze.length
    + ';--m:'+Math.max(sp.length, ze.length);
  const marken = eb.map(([v, lab], k) => {
    const summe = list.filter(n => ACHSEN[e].von(n) === v).length;
    return '<button class="cube-tag'+(wf.ebene === v ? ' on' : '')+'" type="button" data-ebene="'+esc(v)+'" style="--k:'+k+'">'
      + esc(lab)+' <b>'+summe+'</b></button>';
  }).join('');
  return '<div class="cube-wrap">'
    + '<div class="cube" style="'+cubeVars+'" title="Ziehen dreht den Würfel · Doppelklick stellt ihn zurück">'
    +   '<div class="cube-in'+(gew >= 0 ? ' gewaehlt' : '')+(wfBlick.rx < 20 ? ' flach' : '')+'" data-top="'+topNeu+'" style="--top:'+topAlt+';--rx:'+wfBlick.rx+'deg;--rz:'+wfBlick.rz+'deg">'+achsen+ebenen+'</div></div>'
    + '<div class="cube-leg">'
    +   '<div class="cube-ax"><span class="ax x">→</span> Spalten <select class="wf-sel" data-ach="s" aria-label="Spalten">'
    +     ACHS_REIHE.map(a => '<option value="'+a+'"'+(a === wf.s ? ' selected' : '')+'>'+ACHSEN[a].name+'</option>').join('')+'</select></div>'
    +   '<div class="cube-ax"><span class="ax y">↓</span> Zeilen <select class="wf-sel" data-ach="z" aria-label="Zeilen">'
    +     ACHS_REIHE.map(a => '<option value="'+a+'"'+(a === wf.z ? ' selected' : '')+'>'+ACHSEN[a].name+'</option>').join('')+'</select></div>'
    +   '<div class="cube-ax"><span class="ax z">↗</span> Ebenen <b>'+esc(ACHSEN[e].name)+'</b>'
    +     '<button class="wf-dreh" type="button" title="Achsen weiterdrehen" aria-label="Achsen weiterdrehen">⟳</button>'
    +   '</div>'
    +   '<div class="cube-ax"><span class="ax">◎</span> Blick <span class="cube-blicke" role="group" aria-label="Blickwinkel">'
    +     Object.entries(WF_BLICKE).map(([k, b]) => '<button class="cube-blick'+(wfBlickIst(k) ? ' on' : '')+'" type="button" data-blick="'+k+'">'+b.name+'</button>').join('')
    +   '</span></div>'
    +   '<div class="cube-tags"><button class="cube-tag'+(wf.ebene === null ? ' on' : '')+'" type="button" data-ebene="*">Alle <b>'+list.length+'</b></button>'+marken+'</div>'
    + '</div></div>';
}
function renderWuerfel(list){
  const e = wfE();
  const sp = ACHSEN[wf.s].werte(), ze = ACHSEN[wf.z].werte(), eb = ACHSEN[e].werte();
  if (wf.ebene !== null && !eb.some(w => w[0] === wf.ebene)) wf.ebene = null;
  const schicht = wf.ebene === null ? list : list.filter(n => ACHSEN[e].von(n) === wf.ebene);
  const zellen = {};
  sortList(schicht.slice()).forEach(n => {
    const k = ACHSEN[wf.z].von(n)+'|'+ACHSEN[wf.s].von(n);
    (zellen[k] = zellen[k] || []).push(n);
  });
  const order = [];
  const kopf = '<div class="wf-c wf-corner">'+esc(ACHSEN[wf.z].name)+' ↓ · '+esc(ACHSEN[wf.s].name)+' →</div>'
    + sp.map(([sv, lab]) => {
        const n = schicht.filter(x => ACHSEN[wf.s].von(x) === sv).length;
        return '<div class="wf-c wf-h" data-a="'+wf.s+'" data-v="'+esc(sv)+'">'+esc(lab)+'<span>'+n+'</span></div>';
      }).join('');
  const reihen = ze.map(([zv, zlab]) => {
    const n = schicht.filter(x => ACHSEN[wf.z].von(x) === zv).length;
    return '<div class="wf-c wf-rh" data-a="'+wf.z+'" data-v="'+esc(zv)+'">'+esc(zlab)+'<span>'+n+'</span></div>'
      + sp.map(([sv]) => {
          const karten = zellen[zv+'|'+sv] || [];
          const offen = karten.filter(x => nStatus(x) !== 'erledigt');
          const fertig = karten.filter(x => nStatus(x) === 'erledigt');
          offen.concat(fertig).forEach(x => order.push(x));
          return '<div class="wf-c wf-cell" data-s="'+esc(sv)+'" data-z="'+esc(zv)+'">'
            + offen.map(x => kanbanKarte(x, wf.ebene === null)).join('')
            + kcStapel(fertig, zv+'|'+sv)
            + '<button class="kc-neu" type="button" title="Neue Notiz in dieser Zelle" aria-label="Neue Notiz hier">+</button></div>';
        }).join('');
  }).join('');
  view = order;
  return '<div class="wf">' + wuerfelBild(list, sp, ze, eb, e)
    + '<div class="wf-scroll" id="wfScroll"><div class="wf-grid" style="--cols:'+sp.length+'">'+kopf+reihen+'</div></div>'
    + '</div>';
}
/* Werte einer Notiz ändern und sichern – ohne Editor. */
function darfSchreiben(){
  if (window.WBTor && WBTor.zu && WBTor.zu()){ if (WBTor.dialog) WBTor.dialog(); return false; }
  return true;
}
async function notizSichern(n, meldung){
  const now = new Date();
  n.modified = fmt(now); n.modifiedSort = now.getTime();
  searchCache.delete(n);
  try {
    if (fsMode === 'fs') await writeNoteFile(n);
    else if (fsMode === 'idb') await idbPutNote(n);
  } catch(err){ toast('Speichern fehlgeschlagen – Ordnerzugriff prüfen.'); }
  WB.melden('noteos', { was:'geaendert' });
  renderDeck();
  if (reading) renderSheet();
  if (meldung) toast(meldung);
}
deck.addEventListener('change', e => {
  const sel = e.target.closest('.wf-sel'); if (!sel) return;
  const alt = wf[sel.dataset.ach], neu = sel.value;
  const anderes = sel.dataset.ach === 's' ? 'z' : 's';
  if (wf[anderes] === neu) wf[anderes] = alt;          /* tauschen statt doppelt belegen */
  wf[sel.dataset.ach] = neu; wf.ebene = null; wfMerken(); renderDeck();
});

/* Ziehen mit Zeiger: Maus sofort, Finger nach kurzem Halten. */
let zug = null, klickSperre = false;
function zugEnde(){
  if (!zug) return;
  clearTimeout(zug.timer);
  if (zug.ghost) zug.ghost.remove();
  if (zug.card) zug.card.classList.remove('dragging');
  $$('.wf-cell.ziel').forEach(c => c.classList.remove('ziel'));
  document.body.classList.remove('ziehen');
  zug = null;
}
function zugStart(){
  if (!zug || zug.on) return;
  zug.on = true;
  hoverZu();
  const r = zug.card.getBoundingClientRect();
  const g = zug.card.cloneNode(true);
  g.classList.add('kc-ghost'); g.removeAttribute('tabindex');
  g.style.width = r.width + 'px';
  g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  zug.dx = zug.x - r.left; zug.dy = zug.y - r.top;
  document.body.appendChild(g);
  zug.ghost = g;
  zug.card.classList.add('dragging');
  document.body.classList.add('ziehen');
  if (navigator.vibrate && zug.touch) { try { navigator.vibrate(12); } catch(e){} }
}
deck.addEventListener('pointerdown', e => {
  const card = e.target.closest('.kc');
  if (!card || e.target.closest('button') || (e.button !== undefined && e.button > 0)) return;
  zug = { card, id:+card.dataset.note, x:e.clientX, y:e.clientY, on:false, touch:e.pointerType !== 'mouse', timer:null };
  if (zug.touch) zug.timer = setTimeout(zugStart, 320);
});
addEventListener('pointermove', e => {
  if (!zug) return;
  const weit = Math.hypot(e.clientX - zug.x, e.clientY - zug.y);
  if (!zug.on){
    if (zug.touch){ if (weit > 10) zugEnde(); return; }   /* Finger bewegt sich: das ist Scrollen */
    if (weit < 6) return;
    zugStart();
  }
  zug.ghost.style.left = (e.clientX - zug.dx) + 'px';
  zug.ghost.style.top = (e.clientY - zug.dy) + 'px';
  const unter = document.elementFromPoint(e.clientX, e.clientY);
  const zelle = unter && unter.closest ? unter.closest('.wf-cell') : null;
  $$('.wf-cell.ziel').forEach(c => { if (c !== zelle) c.classList.remove('ziel'); });
  if (zelle) zelle.classList.add('ziel');
  zug.zelle = zelle;
  /* Am Rand der Tafel weiterschieben */
  const sc = $('#wfScroll');
  if (sc){
    const r = sc.getBoundingClientRect();
    if (e.clientX > r.right - 40) sc.scrollLeft += 14; else if (e.clientX < r.left + 40) sc.scrollLeft -= 14;
  }
});
document.addEventListener('touchmove', e => { if (zug && zug.on && e.cancelable) e.preventDefault(); }, { passive:false });
addEventListener('pointerup', async () => {
  if (!zug) return;
  const z = zug;
  if (!z.on){ zugEnde(); return; }
  klickSperre = true; setTimeout(() => { klickSperre = false; }, 60);
  const zelle = z.zelle, n = notes[z.id];
  zugEnde();
  if (!zelle || !n) return;
  const sv = zelle.dataset.s, zv = zelle.dataset.z;
  if (ACHSEN[wf.s].von(n) === sv && ACHSEN[wf.z].von(n) === zv) return;
  if (!darfSchreiben()) return;
  n[ACHSEN[wf.s].feld] = sv;
  n[ACHSEN[wf.z].feld] = zv;
  await notizSichern(n, '„'+n.title+'“: '+wertLabel(wf.s, sv)+' · '+wertLabel(wf.z, zv));
});
addEventListener('pointercancel', zugEnde);
/* Würfel drehen: waagrecht ziehen dreht um die Hochachse, senkrecht kippt ihn. */
let wfZiehen = null;
function wfBlickSetzen(el){
  if (!el) return;
  el.style.setProperty('--rx', wfBlick.rx.toFixed(1)+'deg');
  el.style.setProperty('--rz', wfBlick.rz.toFixed(1)+'deg');
  el.classList.toggle('flach', wfBlick.rx < 20);       /* Draufsicht: Schilder lägen übereinander */
}
deck.addEventListener('pointerdown', e => {
  const st = e.target.closest('.cube');
  if (!st || (e.button !== undefined && e.button > 0)) return;
  wfZiehen = { st, el:st.querySelector('.cube-in'), x:e.clientX, y:e.clientY, rx:wfBlick.rx, rz:wfBlick.rz, on:false };
});
addEventListener('pointermove', e => {
  if (!wfZiehen) return;
  const dx = e.clientX - wfZiehen.x, dy = e.clientY - wfZiehen.y;
  if (!wfZiehen.on){
    if (Math.hypot(dx, dy) < 5) return;
    wfZiehen.on = true; wfZiehen.st.classList.add('dreht');
  }
  wfBlick.rz = wfZiehen.rz - dx * .45;
  wfBlick.rx = Math.min(90, Math.max(0, wfZiehen.rx - dy * .45));
  wfBlickSetzen(wfZiehen.el);
});
function wfZiehenEnde(){
  if (!wfZiehen) return;
  if (wfZiehen.on){
    klickSperre = true; setTimeout(() => { klickSperre = false; }, 60);
    wfZiehen.st.classList.remove('dreht');
    wfBlick.rz = ((wfBlick.rz % 360) + 540) % 360 - 180;
    wfBlickSetzen(wfZiehen.el);
    $$('.cube-blick').forEach(b => b.classList.toggle('on', wfBlickIst(b.dataset.blick)));
    wfMerken();
  }
  wfZiehen = null;
}
addEventListener('pointerup', wfZiehenEnde);
/* Würfel ↔ Liste: über einer Würfelzelle leuchten ihre Karten, über einer
   Karte ihre Zelle im Würfel. */
let wfVerbundenSchl = null;
function wfVerbinden(schl){
  if (schl === wfVerbundenSchl) return;
  wfVerbundenSchl = schl;
  $$('.glimmt').forEach(el => el.classList.remove('glimmt'));
  const wfEl = $('.wf');
  if (!wfEl) return;
  wfEl.classList.toggle('verbunden', !!schl && schl.karten);
  if (!schl) return;
  const q = v => CSS.escape(v);
  const zelle = $('.cube-l[data-ebene="'+q(schl.e)+'"] .cube-g i[data-s="'+q(schl.s)+'"][data-z="'+q(schl.z)+'"]');
  if (zelle) zelle.classList.add('glimmt');
  if (schl.karten) $$('.wf-grid .kc[data-ws="'+q(schl.s)+'"][data-wz="'+q(schl.z)+'"][data-we="'+q(schl.e)+'"]')
    .forEach(k => k.classList.add('glimmt'));
}
deck.addEventListener('pointerover', e => {
  if (deckMode !== 'wuerfel' || wfZiehen && wfZiehen.on || zug && zug.on) return;
  const i = e.target.closest('.cube-g i[data-s]');
  if (i){
    const l = i.closest('.cube-l');
    wfVerbinden({ s:i.dataset.s, z:i.dataset.z, e:l.dataset.ebene, karten:true, id:'z' });
    return;
  }
  const k = e.target.closest('.wf-grid .kc');
  if (k){ wfVerbinden({ s:k.dataset.ws, z:k.dataset.wz, e:k.dataset.we, karten:false }); return; }
  wfVerbinden(null);
});
deck.addEventListener('pointerleave', () => wfVerbinden(null));
addEventListener('pointercancel', wfZiehenEnde);
deck.addEventListener('dblclick', e => {
  const st = e.target.closest('.cube');
  if (!st) return;

  const front = () => main.querySelector('.wb.is-front');
  const begin = (x, y, target) => {

    if (target.closest && target.closest('.wb-strip')) return false;   /* die Leiste scrollt selbst */

      (1 - Math.min(Math.abs(dx) / 2600, .04)).toFixed(3) + ')';

    if (!down) return;
    down = false;
    const el = front();

  const arena = e.target.closest('.arena');
  if (arena && arena.dataset.dragged === '1') return;      /* Wischen ist kein Klick */
  if (sticky){ openNote(+sticky.dataset.note, sticky); return; }
});

/* ───────── Bühne: eine Ansicht sichtbar, weicher Wechsel ─────────
   Kamm, Liste und Whiteboard liegen übereinander. Beim Wechsel blendet
   die alte Ansicht ab, die Bühne fährt auf die neue Höhe, die neue
   Ansicht kommt herein – kein Sprung. */
const stage = $('#stage');
const VIEW_EL = { kamm:'#viewKamm', board:'#viewDeck', arena:'#viewDeck', wuerfel:'#viewDeck' };
const LEADS = {
  kamm:'Jede Scheibe ist eine Notiz. Der Kamm zeigt den ganzen Bestand: scrollen bringt eine Scheibe ins Ziel, sie steht offen und zoomt darunter heraus.',
  board:'Die Werkbank: je Kategorie ein Haufen Glaskörper. Haufen antippen breitet ihn aus, ein Körper öffnet die Notiz.',
  arena:'Oben die Themen – je nach Sortierung Kategorie, Anfangsbuchstabe oder Zeitraum. Unten die große Tafel mit den ausgebreiteten Zetteln; wischen wechselt das Thema.',
  wuerfel:'Kanban in drei Richtungen: Status, Priorität und Person. Zwei davon bilden die Tafel, die dritte schichtet sie zum Würfel – eine Schicht antippen zeigt nur sie. Karten ziehen ändert die Werte.'
};
let switching = false, pendingView = null;
function viewEl(mode){ return $(VIEW_EL[mode]); }
function applyView(){
  $$('.view').forEach(v => v.classList.remove('is-on'));
  viewEl(viewMode).classList.add('is-on');
  $$('.seg button[data-view]').forEach(x => x.classList.toggle('active', x.dataset.view === viewMode));
  const lead = $('#lead');
  if (lead) lead.innerHTML = LEADS[viewMode];
  if (viewMode === 'kamm'){ measurePanes(); centerPane(paneIdx, 'auto'); scheduleScopeSequence(); }
  updateScopeCount();
}
function switchView(next){
  if (!VIEW_EL[next]) return;
  if (switching){ pendingView = next; return; }   /* schneller Zweitklick geht nicht verloren */
  if (next === viewMode) return;
  const prevEl = viewEl(viewMode);
  const soft = !reduced() && !!stage.animate;
  const from = stage.getBoundingClientRect().height;
  switching = true;
  /* Abbild der alten Ansicht: es blendet ab, während die neue schon da ist
     – so bleibt beim Wechsel nie eine Lücke stehen. */
  let ghost = null;
  if (soft){
    ghost = prevEl.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
    ghost.classList.add('view-ghost','is-on');
    const gp = ghost.querySelector('.panes');
    stage.appendChild(ghost);
    if (gp) gp.scrollLeft = panesEl.scrollLeft;
  }
  viewMode = next;
  if (next !== 'kamm') deckMode = next;
  try { localStorage.setItem('noteos.view', viewMode); } catch(e){}
  renderDeck();
  applyView();
  const done = () => {
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    stage.style.height = ''; stage.style.overflow = ''; switching = false;
    if (pendingView){ const n = pendingView; pendingView = null; switchView(n); }
  };
  if (!soft){ done(); return; }
  const to = stage.getBoundingClientRect().height;
  stage.style.overflow = 'hidden';
  ghost.animate([{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-14px) scale(.985)' }],
    { duration:260, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards' });
  viewEl(viewMode).animate([{ opacity:0, transform:'translateY(18px) scale(.99)' }, { opacity:1, transform:'none' }],
    { duration:400, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards' });
  const h = stage.animate([{ height:from+'px' }, { height:to+'px' }],
    { duration:430, easing:'cubic-bezier(.2,.8,.2,1)' });
  h.onfinish = done; h.oncancel = done;
}
$$('.seg button[data-view]').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

             + '<button class="tag-close" id="tagClose" aria-label="Schließen">✕</button></div>';
  menu.innerHTML = head + (tags.length
    ? tags.map(t => '<button class="tag-chip'+(activeTags.has(t)?' selected':'')+'" data-tag="'+esc(t)+'"><span>'+esc(t)+'</span><span class="check">✓</span></button>').join('')
      + (activeTags.size ? '<button class="tag-clear" id="tagClear">Filter zurücksetzen</button>' : '')
    : '<div class="tag-empty">Noch keine Tags vorhanden.</div>');
}
/* Menü am Knopf ausrichten – und notfalls nach oben klappen,
   damit es nie unter den Bildschirmrand rutscht. */
function placeMenu(menu, anchor, width){
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - (width||240) - 8)) + 'px';
  const below = innerHeight - r.bottom - 16;
  const above = r.top - 16;
  if (below < 180 && above > below){
    menu.style.top = '';
    menu.style.bottom = (innerHeight - r.top + 8) + 'px';
    menu.style.maxHeight = Math.max(140, above) + 'px';
  } else {
    menu.style.bottom = '';
    menu.style.top = (r.bottom + 8) + 'px';
    menu.style.maxHeight = Math.max(140, below) + 'px';
  }
}
$('#tagBtn').addEventListener('click', e => {
  e.stopPropagation();
  const menu = $('#tagMenu');
  placeMenu(menu, e.currentTarget, 280);

$('#tagMenu').addEventListener('click', e => {

const reader = $('#reader'), sheet = $('#sheet');

}
function openNote(id, fromEl){
  if (!notes[id]) return;
  curIdx = id;
  const card = fromEl || deck.querySelector('[data-note="'+id+'"]');
  renderSheet();
  reading = true;
  document.body.classList.add('reading');
  root.classList.add('locked');
  reader.scrollTop = 0;
  $('#printBtn').disabled = false;
  if (card && !reduced() && sheet.animate){
    const a = card.getBoundingClientRect();
    const b = sheet.getBoundingClientRect();
    if (b.width && b.height){
      const s = Math.max(.35, Math.min(1, a.width / b.width));
      const dx = (a.left + a.width/2) - (b.left + b.width/2);
      const dy = (a.top + a.height/2) - (b.top + b.height/2);
      sheet.animate(
        [{ transform:'translate('+dx+'px,'+dy+'px) scale('+s+')', opacity:0 }, { transform:'none', opacity:1 }],
        { duration:460, easing:'cubic-bezier(.2,.8,.2,1)' });
    }
  }
  if (history.state && history.state.noteos) history.replaceState({ noteos:id }, '', '#n'+id);
  else history.pushState({ noteos:id }, '', '#n'+id);
  setTimeout(() => $('#backBtn').focus({ preventScroll:true }), 60);
}
function closeNote({ back = true } = {}){
  if (!reading) return;
  reading = false;
  document.body.classList.remove('reading');
  root.classList.remove('locked');
  $('#printBtn').disabled = true;
  document.title = 'Notizbuch – Wissen der Werkbank';
  const card = deck.querySelector('[data-note="'+curIdx+'"]');
  if (card && card.scrollIntoView) card.scrollIntoView({ block:'center' });
  if (card && card.focus) card.focus({ preventScroll:true });
  if (back && history.state && history.state.noteos) history.back();
  else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
function stepNote(dir){
  if (!reading) return;
  const i = view.indexOf(notes[curIdx]);
  const next = view[i + dir];
  if (!next) return;
  curIdx = next.id;
  renderSheet();
  history.replaceState({ noteos:curIdx }, '', '#n'+curIdx);
  if (!reduced() && sheet.animate){
    sheet.animate([{ opacity:0, transform:'translateX('+(dir*24)+'px)' }, { opacity:1, transform:'none' }],
      { duration:260, easing:'cubic-bezier(.2,.8,.2,1)' });
  }
  reader.scrollTop = 0;
}
$('#backBtn').addEventListener('click', () => closeNote());
$('#scrim').addEventListener('click', () => closeNote());
$('#prevBtn').addEventListener('click', () => stepNote(-1));
$('#nextBtn').addEventListener('click', () => stepNote(1));
addEventListener('popstate', () => {
  const m = /^#n(\d+)$/.exec(location.hash);
  if (m && notes[+m[1]]){ if (!reading || curIdx !== +m[1]) openNote(+m[1]); }
  else if (reading) closeNote({ back:false });
});
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#editorView').classList.contains('active')) return;
  if (!$('#confirmOverlay').hidden || !$('#verknOverlay').hidden || !$('#hilfeOverlay').hidden || !$('#teilOverlay').hidden) return;
  if (POPOVERS.some(([id]) => { const m = document.getElementById(id); return m && !m.hidden; })) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.key === 'Escape' && reading){ closeNote(); return; }
  if (!reading){
    /* 1 2 3 schalten die Ansicht, die Pfeile blättern im Kamm. */
    if (e.key === '1'){ e.preventDefault(); switchView('kamm'); return; }
    if (e.key === '2'){ e.preventDefault(); switchView('board'); return; }
    if (e.key === '3'){ e.preventDefault(); switchView('arena'); return; }
    if (e.key === '4'){ e.preventDefault(); switchView('wuerfel'); return; }
    if (viewMode === 'arena'){
      if (e.key === 'ArrowLeft'){ e.preventDefault(); stepArena(-1); }
      else if (e.key === 'ArrowRight'){ e.preventDefault(); stepArena(1); }
      return;
    }
    if (viewMode !== 'kamm') return;
    if (t && t.closest && t.closest('#panes')) return;   /* dort greift der eigene Handler */
    if (e.key === 'ArrowLeft'){ e.preventDefault(); stepPane(-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); stepPane(1); }
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); stepNote(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); stepNote(1); }
});
/* Wischen blättert */
(function(){
  let sx = 0, sy = 0, on = false;
  reader.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, { passive:true });
  reader.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6) stepNote(dx < 0 ? 1 : -1);
  }, { passive:true });
})();

/* ═══════ Kategorien ═══════
   Feste und eigene Kategorien. Die Gruppe „Auftraggeber“ aus dem
   Auftragsbuch entfällt seit 30.10.2026 (agbBestand() ist leer) – der Code
   bleibt stehen, falls die Leitung je zurückkommt. */
function kategorienAufbauen(){
  const gewaehlt = editorCategory.value;
  editorCategory.innerHTML = '<option value="">Kategorie wählen …</option>';
  const kunden = agbNachName();                       /* Name → agbId, nur aktive */
  const eigene = new Set(notes.map(n => n.category));
  const fest = new Set(Object.keys(CATS));
  /* Auftraggeber stehen unten in ihrer eigenen Gruppe – oben bleiben die
     freien Kategorien, damit ein Name nicht zweimal in der Liste steht. */
  [...new Set([...fest, ...eigene])].filter(c => !kunden.has(c))
    .sort((a,b)=>a.localeCompare(b,'de')).forEach(c => {
      const o = document.createElement('option'); o.value = c; o.textContent = c;
      editorCategory.appendChild(o);
    });
  if (kunden.size){
    const g = document.createElement('optgroup'); g.label = 'Auftraggeber';
    [...kunden.keys()].sort((a,b)=>a.localeCompare(b,'de')).forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n; o.dataset.agb = kunden.get(n);
      g.appendChild(o);
    });
    editorCategory.appendChild(g);
  }
  if (gewaehlt) editorCategory.value = gewaehlt;
}
/* Welche agbId hängt an der gerade gewählten Kategorie? Leer, wenn es
   eine freie Kategorie ist. */
function gewaehlteAgbId(){
  const o = editorCategory.selectedOptions && editorCategory.selectedOptions[0];
  return (o && o.dataset.agb) ? String(o.dataset.agb) : null;
}
kategorienAufbauen();
