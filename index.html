<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NoteOS – Buch aufklappen</title>
<style>
  :root{
    --bg-app:#3b2a1d; --bg-page:#f2e6c9;
    --ink:#2b1c10; --ink-muted:#6b5642; --accent:#a9803f;
    --border:#c9b489; --shadow:rgba(20,12,4,.5);
    --wall:#241a11; --wood:#5c3a22; --wood-dark:#3a2414;
    --tab-bg:#c9a876; --tab-ink:#3a2a16;
    --font-display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --font-body:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --page-w: clamp(230px, 27vw, 360px);
    --reg-w: clamp(120px, 13vw, 165px);
  }
  body[data-mode="dark"]{
    --bg-app:#14100b; --bg-page:#241b10;
    --ink:#e6d6b0; --ink-muted:#a8916c; --accent:#c79a52;
    --border:#4a3b24; --shadow:rgba(0,0,0,.75);
    --wall:#0c0906; --wood:#3a2415; --wood-dark:#221208;
    --tab-bg:#5c4526; --tab-ink:#e8d9b8;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{ font-family:var(--font-body); background:var(--bg-app); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button{ font:inherit; cursor:pointer; }
  /* must outrank any element's own display value, e.g. the tag menu's display:flex */
  [hidden]{ display:none !important; }
  input{ font:inherit; }

  /* ---------- lab bar ---------- */
  .lab-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:.8rem; padding:.65rem 1rem;
    background:rgba(8,6,4,.9); color:#f4f0e6; font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:.76rem; position:sticky; top:0; z-index:100; backdrop-filter:blur(6px);
  }
  .lab-group{ display:flex; gap:.3rem; }
  .lab-group button{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#f4f0e6;
    padding:.3rem .65rem; border-radius:999px; font-size:.74rem;
  }
  .lab-group button.active{ background:#f4f0e6; color:#161207; border-color:#f4f0e6; }
  .lab-hint{ opacity:.7; font-size:.7rem; }
  @media (max-width:860px){ .lab-hint{ display:none; } }

  .add-btn{
    background:var(--accent); color:#2b1c10; border:none; width:26px; height:26px; border-radius:50%;
    font-size:1.05rem; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center;
    margin-left:.1rem;
  }
  .add-menu{
    position:fixed; top:48px; left:1rem; z-index:130; background:#efe3c4; border:1px solid var(--border);
    border-radius:8px; box-shadow:0 14px 30px rgba(0,0,0,.4); overflow:hidden; min-width:175px;
  }
  .add-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:.65rem .9rem;
    font-family:var(--font-body); font-size:.85rem; color:#2b1c10; border-bottom:1px solid rgba(0,0,0,.08);
  }
  .add-menu button:last-child{ border-bottom:none; }
  .add-menu button:hover{ background:rgba(169,128,63,.22); }

  .print-btn{
    background:rgba(255,255,255,.1); color:#f4f0e6; border:1px solid rgba(255,255,255,.3); width:26px; height:26px;
    border-radius:50%; font-size:.85rem; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .print-btn:disabled{ opacity:.35; cursor:default; }
  .print-menu{
    position:fixed; top:48px; z-index:130; background:#efe3c4; border:1px solid var(--border);
    border-radius:8px; box-shadow:0 14px 30px rgba(0,0,0,.4); overflow:hidden; min-width:210px;
  }
  .print-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:.65rem .9rem;
    font-family:var(--font-body); font-size:.85rem; color:#2b1c10; border-bottom:1px solid rgba(0,0,0,.08);
  }
  .print-menu button:last-child{ border-bottom:none; }
  .print-menu button:hover{ background:rgba(169,128,63,.22); }
  .pm-side{ display:flex !important; align-items:center; gap:.5rem; font-size:.8rem !important; }
  .pm-side::before{ content:'○'; opacity:.5; }
  .pm-side.selected{ background:rgba(169,128,63,.28); font-weight:600; }
  .pm-side.selected::before{ content:'●'; opacity:1; color:var(--accent); }
  .pm-sep{ border-top:1px solid rgba(0,0,0,.12); }
  .folder-btn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#f4f0e6;
    padding:.3rem .7rem; border-radius:999px; font-size:.74rem; display:flex; align-items:center; gap:.4rem;
  }
  .folder-dot{ width:7px; height:7px; border-radius:50%; background:#8a8a86; display:inline-block; }
  .folder-dot.on{ background:#6fbf73; } .folder-dot.warn{ background:#d9a441; }
  .folder-menu{
    position:fixed; top:48px; left:5.6rem; z-index:130; background:#efe3c4; border:1px solid var(--border);
    border-radius:8px; box-shadow:0 14px 30px rgba(0,0,0,.4); overflow:hidden; min-width:230px;
  }
  .folder-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:.65rem .9rem;
    font-family:var(--font-body); font-size:.85rem; color:#2b1c10; border-bottom:1px solid rgba(0,0,0,.08);
  }
  .folder-menu button:last-child{ border-bottom:none; }
  .folder-menu button:hover{ background:rgba(169,128,63,.22); }
  .pm-note{ padding:.6rem .9rem; font-size:.72rem; line-height:1.4; color:var(--ink-muted); border-bottom:1px solid rgba(0,0,0,.08); }

  .print-sheet{ display:none; }
  @media print{
    body > *:not(.print-sheet){ display:none !important; }
    .print-sheet{
      display:block !important; font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
      color:#161207; background:#fff;
    }
    .print-sheet h1{ font-size:22pt; border-bottom:2px double #333; padding-bottom:6pt; margin-bottom:8pt; }
    .print-sheet .p-meta{ font-size:9pt; color:#555; margin-bottom:3pt; }
    .print-sheet .p-source{ font-size:9pt; color:#555; font-style:italic; margin-bottom:3pt; }
    .print-sheet .p-tags{ margin-bottom:16pt; }
    .print-sheet .p-tag{ display:inline-block; font-size:8pt; border:1px solid #999; padding:1pt 7pt; margin-right:5pt; border-radius:8pt; font-style:italic; }
    .print-sheet .p-body{ font-size:11pt; line-height:1.55; }
    .print-sheet .p-body h1,.print-sheet .p-body h2,.print-sheet .p-body h3{ margin:14pt 0 6pt; }
    .print-sheet .p-body blockquote{ border-left:2pt solid #999; padding-left:10pt; margin:8pt 0; color:#444; font-style:italic; }
  }

  /* ---------- editor ---------- */
  .editor-view{
    position:fixed; inset:45px 0 0; background:var(--bg-app); overflow:auto; z-index:120;
    opacity:0; visibility:hidden; transition:opacity .3s ease;
  }
  .editor-view.active{ opacity:1; visibility:visible; }
  .editor-topbar{ display:flex; justify-content:space-between; align-items:center; padding:1rem 1.4rem .2rem; max-width:720px; margin:0 auto; }
  .editor-topbar button{ background:none; border:none; font-size:.85rem; }
  .editor-cancel{ color:var(--ink-muted); padding:0; }
  .editor-save{ background:var(--accent); color:#2b1c10; font-weight:600; padding:.45rem 1.1rem; border-radius:6px; }
  .editor-sheet{ max-width:720px; margin:1.2rem auto 3rem; background:var(--bg-page); color:var(--ink); border-radius:2px; box-shadow:0 24px 48px -12px var(--shadow); padding:1.8rem 2rem 2.2rem; }
  .editor-title{
    width:100%; border:none; background:none; font-family:var(--font-display); font-size:1.6rem; font-weight:600;
    color:var(--ink); padding:0 0 .5rem; border-bottom:2px double var(--accent); outline:none;
  }
  .editor-title::placeholder{ color:var(--ink-muted); opacity:.6; }
  .editor-meta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:.8rem; margin:.8rem 0 .3rem; }
  .editor-meta-row select{
    background:#fff8e8; border:1px solid var(--border); color:var(--ink); padding:.35rem .6rem; border-radius:5px; font-size:.82rem;
  }
  .editor-tags-input{
    background:#fff8e8; border:1px solid var(--border); color:var(--ink); padding:.35rem .6rem; border-radius:5px;
    font-size:.82rem; flex:1; min-width:160px;
  }
  .editor-tags-input::placeholder{ color:var(--ink-muted); opacity:.7; }
  .editor-source{ font-size:.72rem; color:var(--ink-muted); font-style:italic; }
  .editor-hint{ font-size:.72rem; color:#8a3b3b; min-height:1.1em; margin:.2rem 0 .8rem; }
  .editor-toolbar{ display:flex; flex-wrap:wrap; gap:.3rem; padding:.5rem; background:rgba(0,0,0,.05); border-radius:6px; margin-bottom:1rem; }
  .editor-toolbar button{
    background:#fff8e8; border:1px solid var(--border); color:var(--ink); padding:.32rem .6rem; border-radius:4px; font-size:.78rem;
  }
  .editor-toolbar button:hover{ background:var(--accent); color:#2b1c10; }
  .tb-sep{ width:1px; background:var(--border); margin:.2rem .15rem; }
  .editor-body{ min-height:38vh; outline:none; font-size:.97rem; line-height:1.65; }
  .editor-body h1{ font-family:var(--font-display); font-size:1.5rem; margin:.6rem 0 .4rem; }
  .editor-body h2{ font-family:var(--font-display); font-size:1.2rem; margin:.6rem 0 .4rem; }
  .editor-body blockquote{ border-left:3px solid var(--accent); margin:.6rem 0; padding:.2rem 0 .2rem .9rem; color:var(--ink-muted); font-style:italic; }
  .editor-body ul,.editor-body ol{ padding-left:1.3rem; margin:.5rem 0; }
  .editor-body p{ margin:0 0 .8rem; }
  .editor-body:empty::before{ content:'Schreib deine Notiz …'; color:var(--ink-muted); opacity:.55; }

  /* ---------- shelf ---------- */
  .shelf-wall{ min-height:calc(100vh - 45px); display:flex; flex-direction:column; background:var(--wall); padding:2.2rem 0 3rem; }
  .shelf-sign{ text-align:center; font-family:var(--font-display); font-style:italic; color:var(--accent); font-size:1.1rem; margin-bottom:1.3rem; opacity:.85; }
  .shelf-controls{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; justify-content:center; padding:0 24px 1.6rem; max-width:760px; margin:0 auto; width:100%; }
  .shelf-search{ flex:1; min-width:170px; max-width:280px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.25); color:#f4ead0; padding:.45rem .8rem; border-radius:6px; }
  .shelf-search::placeholder{ color:rgba(244,234,208,.5); }
  .sort-toggle{ display:flex; gap:.3rem; }
  .sort-toggle button{ background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.25); color:#f4ead0; padding:.42rem .75rem; border-radius:999px; font-size:.76rem; }
  .sort-toggle button.active{ background:var(--accent); color:#2b1c10; border-color:var(--accent); font-weight:600; }
  .tag-filter-btn{
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.25); color:#f4ead0;
    padding:.42rem .75rem; border-radius:999px; font-size:.76rem;
  }
  .tag-filter-btn.active{ background:var(--accent); color:#2b1c10; border-color:var(--accent); font-weight:600; }
  .tag-filter-menu{
    position:fixed; z-index:130; background:#efe3c4; border:1px solid var(--border); border-radius:8px;
    box-shadow:0 14px 30px rgba(0,0,0,.4); padding:.4rem; min-width:180px; max-width:280px;
    display:flex; flex-direction:column; gap:2px; max-height:60vh; overflow-y:auto;
  }
  .tag-filter-head{
    display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    padding:.35rem .35rem .45rem .6rem; font-size:.72rem; color:var(--ink-muted);
    border-bottom:1px solid rgba(0,0,0,.1); margin-bottom:2px;
  }
  .tag-filter-close{
    background:none; border:none; color:var(--ink-muted); font-size:.9rem; line-height:1;
    padding:.25rem .4rem; border-radius:4px;
  }
  .tag-filter-close:hover{ background:rgba(169,128,63,.2); color:var(--ink); }
  .tag-chip{
    background:none; border:none; color:#2b1c10; padding:.5rem .6rem; font-size:.82rem; text-align:left;
    border-radius:5px; display:flex; align-items:center; justify-content:space-between; width:100%;
  }
  .tag-chip:hover{ background:rgba(169,128,63,.15); }
  .tag-chip.selected{ background:rgba(169,128,63,.28); font-weight:600; }
  .tag-chip .check{ opacity:0; }
  .tag-chip.selected .check{ opacity:1; }
  .tag-filter-empty{ font-size:.78rem; color:var(--ink-muted); font-style:italic; padding:.5rem .6rem; }
  .tag-filter-clear{ text-align:left; margin-top:2px; padding:.5rem .6rem; background:none; border:none; border-top:1px solid rgba(0,0,0,.1); font-size:.78rem; color:var(--ink-muted); }
  .tag-filter-clear:hover{ background:rgba(169,128,63,.15); }
  .shelf-label{ color:var(--accent); font-family:var(--font-display); font-style:italic; font-size:1rem; padding:0 24px 6px; opacity:.9; }
  .shelf-row{ display:flex; align-items:flex-end; gap:9px; padding:0 24px; margin-top:26px; }
  .shelf-row:first-child{ margin-top:0; }
  .shelf-ledge{ height:18px; background:linear-gradient(var(--wood), var(--wood-dark)); box-shadow:0 8px 14px rgba(0,0,0,.45); }
  .shelf-empty{ text-align:center; color:#f4ead0; opacity:.6; font-style:italic; padding:2rem; }
  .spine{
    background:var(--spine-color); border:none; border-radius:2px 2px 0 0; flex-shrink:0; position:relative;
    box-shadow:inset 2px 0 0 rgba(255,255,255,.14), inset -2px 0 0 rgba(0,0,0,.28), 0 6px 10px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; padding:12px 3px;
  }
  .spine::before,.spine::after{ content:''; position:absolute; left:3px; right:3px; height:2px; background:rgba(255,255,255,.35); }
  .spine::before{ top:12px; } .spine::after{ bottom:12px; }
  .spine-title{ writing-mode:vertical-rl; transform:rotate(180deg); color:#f4ead0; font-family:var(--font-display); font-size:.76rem; white-space:nowrap; max-height:100%; overflow:hidden; }
  .spine-hidden{ visibility:hidden; }
  .spine:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .shelf-row.picking .spine:not(.spine-hidden){ opacity:.4; pointer-events:none; transition:opacity .3s ease; }

  /* ---------- book as a solid 3D body (shelf → centre) ---------- */
  .fly-stage{ position:fixed; inset:0; z-index:95; pointer-events:none; perspective:1800px; perspective-origin:50% 45%; }
  .book3d{ position:absolute; transform-style:preserve-3d; }
  .bf{ position:absolute; backface-visibility:hidden; overflow:hidden; }
  .bf-cover,.bf-back{ width:100%; height:100%; left:0; top:0; background:var(--spine-color); }
  .bf-cover{
    transform:translateZ(calc(var(--d) / 2));
    box-shadow:inset 0 0 50px rgba(0,0,0,.3), 0 34px 60px rgba(0,0,0,.5);
    border-radius:1px 3px 3px 1px;
  }
  .bf-back{
    transform:translateZ(calc(var(--d) / -2)) rotateY(180deg);
    box-shadow:inset 0 0 55px rgba(0,0,0,.45);
    border-radius:1px 3px 3px 1px;
  }
  .bf-spine{
    width:var(--d); height:100%; top:0; left:calc(50% - var(--d) / 2); background:var(--spine-color);
    transform:translateX(calc(var(--w) / -2)) rotateY(-90deg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 3px 0 6px rgba(0,0,0,.3), inset -3px 0 6px rgba(0,0,0,.3);
  }
  .bf-spine::before,.bf-spine::after{ content:''; position:absolute; left:8%; right:8%; height:2px; background:rgba(255,255,255,.4); }
  .bf-spine::before{ top:7%; } .bf-spine::after{ bottom:7%; }
  .bf-edge{
    width:var(--d); height:100%; top:0; left:calc(50% - var(--d) / 2);
    transform:translateX(calc(var(--w) / 2)) rotateY(90deg);
    background:repeating-linear-gradient(90deg,#f4ead2 0 1.5px,#d6c49c 1.5px 3px);
    box-shadow:inset 0 0 20px rgba(90,66,30,.35);
  }
  .bf-top,.bf-bottom{
    width:100%; height:var(--d); left:0; top:calc(50% - var(--d) / 2);
    background:repeating-linear-gradient(180deg,#f4ead2 0 1.5px,#d6c49c 1.5px 3px);
  }
  .bf-top{ transform:translateY(calc(var(--h) / -2)) rotateX(90deg); box-shadow:inset 0 0 18px rgba(90,66,30,.3); }
  .bf-bottom{ transform:translateY(calc(var(--h) / 2)) rotateX(-90deg); box-shadow:inset 0 0 22px rgba(40,26,10,.5); }
  .bf-spine .spine-title{ font-size:.8rem; }

  /* cover artwork, shared by flying book and the closed leaf */
  .cover-art{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:1.8rem; color:#f4ead0; height:100%; }
  .cover-art h2{ font-family:var(--font-display); font-weight:600; font-size:1.2rem; margin:.9rem 0; line-height:1.3; }
  .cover-rule{ width:55%; height:2px; background:rgba(244,234,208,.55); }

  /* ---------- book view ---------- */
  .book-view{
    position:fixed; inset:45px 0 0; background:var(--bg-app); overflow:auto; z-index:60;
    opacity:0; visibility:hidden; transition:opacity .3s ease;
  }
  .book-view.active{ opacity:1; visibility:visible; }
  .book-topbar{ padding:1rem 1.4rem .2rem; }
  .back-to-shelf{ background:none; border:none; color:var(--ink-muted); font-size:.85rem; padding:0; }
  .book-stage{ perspective:2400px; display:flex; justify-content:center; padding:1rem 1rem 3rem; }
  .spread{ display:flex; align-items:stretch; gap:0; transform-style:preserve-3d; transition:transform 1.3s cubic-bezier(.3,0,.25,1); }

  .reg-col{ width:var(--reg-w); flex-shrink:0; max-height:78vh; overflow-y:auto; transition:opacity .9s ease .4s; }
  .reg-col ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .ordner-tab{
    background:var(--tab-color, var(--tab-bg)); color:#f4ead0; border:none; text-align:left; width:100%;
    padding:.45rem .65rem; font-family:var(--font-body); font-size:.73rem; line-height:1.25;
    box-shadow:1px 2px 4px rgba(0,0,0,.25); transition:margin .2s ease, box-shadow .2s ease;
    border-left:3px solid rgba(0,0,0,.22);
  }
  .reg-left .ordner-tab{ border-radius:6px 0 0 6px; margin-left:18px; }
  .reg-left .ordner-tab.active{ margin-left:0; }
  .reg-right .ordner-tab{ border-radius:0 6px 6px 0; margin-right:18px; text-align:right; border-left:none; border-right:3px solid rgba(0,0,0,.22); }
  .reg-right .ordner-tab.active{ margin-right:0; }
  .ordner-tab.active{ box-shadow:inset 0 0 0 2px var(--accent), 2px 3px 8px rgba(0,0,0,.35); font-weight:600; }
  .ordner-tab.active{ background:var(--accent); color:#2b1c10; font-weight:600; }
  .ordner-tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .leaf-slot{
    width:var(--page-w); flex-shrink:0; position:relative; transform-style:preserve-3d;
    min-height:calc(var(--page-w) * 1.35);
  }
  /* the page block that stays behind while the cover swings away */
  .leaf-block{
    position:absolute; inset:0; transform:translateZ(-7px); background:var(--bg-page);
    border-radius:2px 0 0 2px; opacity:1; transition:opacity .5s ease .45s;
    box-shadow:inset -12px 0 20px -16px rgba(0,0,0,.5), 0 24px 48px -12px var(--shadow);
  }
  .spread.closed .leaf-block{ opacity:0; transition:none; }
  .leaf{
    position:absolute; inset:0; transform-style:preserve-3d;
    transform-origin:right center; transition:transform 1.3s cubic-bezier(.3,0,.25,1);
    --lt:3px;
  }
  .leaf-face{ position:absolute; inset:0; backface-visibility:hidden; overflow:hidden; }
  .leaf-page{ transform:translateZ(calc(var(--lt) / 2)); }
  .leaf-cover{
    transform:translateZ(calc(var(--lt) / -2)) rotateY(180deg);
    background:var(--spine-color,#5c2331); border-radius:3px 1px 1px 3px;
    box-shadow:inset 0 0 46px rgba(0,0,0,.3);
  }
  /* free edge of the board — what you see when the cover stands upright */
  .leaf-edge{
    position:absolute; top:0; bottom:0; left:0; width:var(--lt); backface-visibility:hidden;
    transform-origin:left center; transform:translateZ(calc(var(--lt) / -2)) rotateY(-90deg);
    background:var(--spine-color,#5c2331);
    box-shadow:inset 0 0 10px rgba(0,0,0,.55);
  }
  .face-shade{ position:absolute; inset:0; background:#0a0704; opacity:0; pointer-events:none; }
  .leaf.opening .leaf-cover .face-shade{ animation:coverShade 1.3s linear both; }
  .leaf.opening .leaf-page  .face-shade{ animation:pageShade  1.3s linear both; }
  .leaf.opening{ animation:leafOpen 1.3s linear both; }
  @keyframes leafOpen{
    0%{ transform:rotateY(180deg) }   15%{ transform:rotateY(168deg) }
    30%{ transform:rotateY(140deg) }  50%{ transform:rotateY(88deg) }
    68%{ transform:rotateY(38deg) }   82%{ transform:rotateY(4deg) }
    90%{ transform:rotateY(-8deg) }   96%{ transform:rotateY(-3deg) }
    100%{ transform:rotateY(0deg) }
  }
  @keyframes coverShade{ 0%{ opacity:0 } 55%{ opacity:.45 } 100%{ opacity:.6 } }
  @keyframes pageShade{ 0%{ opacity:.88 } 50%{ opacity:.55 } 100%{ opacity:0 } }
  .right-holder{
    width:var(--page-w); flex-shrink:0; position:relative; transform-style:preserve-3d;
    min-height:calc(var(--page-w) * 1.35);
  }
  /* a real turning sheet: sweeps over the spine and uncovers the page beneath */
  .flipper{
    position:absolute; inset:0; transform-style:preserve-3d; pointer-events:none;
    will-change:transform, opacity; backface-visibility:hidden;
    transition:transform 1s cubic-bezier(.42,.02,.34,1), opacity .2s linear .8s;
  }
  .flipper.turning{ opacity:0; }
  .flip-right{ transform-origin:left center; transform:translateZ(3px) rotateY(0deg); }
  .flip-right.turning{ transform:translateZ(3px) rotateY(-178deg); }
  .flip-left{ transform-origin:right center; transform:translateZ(3px) rotateY(0deg); }
  .flip-left.turning{ transform:translateZ(3px) rotateY(178deg); }
  .flipper-face{
    position:absolute; inset:0; backface-visibility:hidden; overflow:hidden;
    background:var(--bg-page); transform:translateZ(0);
  }
  .flipper-back{ transform:rotateY(180deg); }
  .flipper-face .page{ box-shadow:none; }
  .flip-right .flipper-front{ border-radius:0 2px 2px 0; box-shadow:inset 14px 0 22px -18px rgba(0,0,0,.55); }
  .flip-right .flipper-back{ border-radius:2px 0 0 2px; box-shadow:inset -14px 0 22px -18px rgba(0,0,0,.55); }
  .flip-left .flipper-front{ border-radius:2px 0 0 2px; box-shadow:inset -14px 0 22px -18px rgba(0,0,0,.55); }
  .flip-left .flipper-back{ border-radius:0 2px 2px 0; box-shadow:inset 14px 0 22px -18px rgba(0,0,0,.55); }
  .flipper-shade{ position:absolute; inset:0; background:#0a0704; opacity:0; pointer-events:none;
    transition:opacity 1s ease; }
  .flipper.turning .flipper-front .flipper-shade{ opacity:.5; }
  .flipper .flipper-back .flipper-shade{ opacity:.5; }
  .flipper.turning .flipper-back .flipper-shade{ opacity:0; }
  /* page edges revealed while a sheet is lifted */
  .page-stack{
    position:absolute; top:6px; bottom:6px; width:7px; opacity:0; transition:opacity .3s ease;
    background:repeating-linear-gradient(90deg,#e9dcbc 0 1px,#c9b78d 1px 2px);
  }
  .right-holder .page-stack{ right:-7px; border-radius:0 3px 3px 0; }
  .leaf-slot .page-stack{ left:-7px; border-radius:3px 0 0 3px; }
  .turning-active .page-stack{ opacity:1; }

  .page{
    height:100%; background:var(--bg-page); color:var(--ink); padding:1.9rem 1.7rem 1.4rem;
    box-shadow:0 24px 48px -12px var(--shadow); overflow-y:auto;
  }
  .leaf .page{ border-radius:2px 0 0 2px; box-shadow:inset -14px 0 22px -18px rgba(0,0,0,.55), 0 24px 48px -12px var(--shadow); }
  .right-holder .page{ border-radius:0 2px 2px 0; box-shadow:inset 14px 0 22px -18px rgba(0,0,0,.55), 0 24px 48px -12px var(--shadow); }
  .page-head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem; border-bottom:2px double var(--accent); padding-bottom:.4rem; margin-bottom:.4rem; }
  .page-head h1{ margin:0; flex:1; font-family:var(--font-display); font-size:1.35rem; font-weight:600; line-height:1.25; }
  .edit-btn{
    background:none; border:1px solid var(--border); color:var(--ink-muted); width:24px; height:24px; flex-shrink:0;
    border-radius:50%; font-size:.75rem; display:flex; align-items:center; justify-content:center;
  }
  .edit-btn:hover{ background:rgba(169,128,63,.18); color:var(--ink); }
  .page-actions{ display:flex; gap:.35rem; flex-shrink:0; }
  .del-btn{
    background:none; border:1px solid var(--border); color:var(--ink-muted); width:24px; height:24px; flex-shrink:0;
    border-radius:50%; font-size:.72rem; display:flex; align-items:center; justify-content:center;
  }
  .del-btn:hover{ background:rgba(138,59,59,.22); color:#a34a4a; border-color:#a34a4a; }

  .confirm-overlay{
    position:fixed; inset:0; z-index:200; background:rgba(10,7,3,.62);
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
  }
  .confirm-box{
    background:var(--bg-page); color:var(--ink); border-radius:6px; max-width:340px; width:100%;
    padding:1.4rem 1.3rem 1.1rem; box-shadow:0 24px 60px rgba(0,0,0,.55); font-family:var(--font-body);
  }
  .confirm-box p{ margin:0 0 1.2rem; font-size:.92rem; line-height:1.5; }
  .confirm-actions{ display:flex; gap:.6rem; justify-content:flex-end; }
  .confirm-actions button{ padding:.45rem 1rem; border-radius:5px; font-size:.85rem; font-family:var(--font-body); }
  #confirmCancel{ background:none; border:1px solid var(--border); color:var(--ink-muted); }
  #confirmOk{ background:#8a3b3b; border:1px solid #8a3b3b; color:#f4ead0; font-weight:600; }

  .toast{
    position:fixed; left:50%; bottom:2rem; transform:translateX(-50%); z-index:210;
    background:rgba(20,14,6,.94); color:#f4ead0; padding:.7rem 1.2rem; border-radius:999px;
    font-size:.82rem; font-family:var(--font-body); box-shadow:0 10px 26px rgba(0,0,0,.45);
    opacity:0; transition:opacity .25s ease; pointer-events:none; max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; }
  .meta-line{ display:flex; flex-wrap:wrap; gap:.55rem; font-size:.68rem; color:var(--ink-muted); margin:.45rem 0; font-variant:small-caps; letter-spacing:.03em; }
  .meta-source{ font-size:.68rem; color:var(--ink-muted); font-style:italic; margin-bottom:.4rem; }
  .tags{ display:flex; gap:.35rem; flex-wrap:wrap; margin-bottom:1rem; }
  .tag{ font-size:.63rem; padding:.1rem .5rem; border:1px solid var(--border); color:var(--ink-muted); font-style:italic; }
  .page-body p{ line-height:1.6; margin:0 0 .9rem; font-size:.87rem; }
  .page-empty{ color:var(--ink-muted); font-style:italic; padding:2rem 0; text-align:center; }
  .page-body p:first-of-type::first-letter{ font-size:2.5em; float:left; line-height:.78; padding:.03em .1em 0 0; color:var(--accent); }
  .page-foot{ margin-top:1.2rem; font-size:.68rem; color:var(--ink-muted); text-align:center; font-variant:small-caps; letter-spacing:.05em; display:flex; align-items:center; justify-content:center; gap:.9rem; }
  .slide-btn{
    background:none; border:1px solid var(--border); color:var(--ink-muted); width:22px; height:22px;
    border-radius:50%; font-size:.85rem; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .slide-btn:hover:not(:disabled){ background:rgba(169,128,63,.15); color:var(--ink); }
  .slide-btn:disabled{ opacity:.28; cursor:default; }

  /* closed state (set by JS just before opening) */
  .spread.closed .reg-col{ opacity:0; }
  .spread.closed .leaf{ transform:rotateY(180deg); }

  @media (prefers-reduced-motion:reduce){
    .spread,.leaf,.right-holder,.page,.reg-col,.leaf-block{ transition:none !important; }
    .leaf.opening,.leaf.opening .face-shade{ animation:none !important; }
  }

  /* ---------- narrow screens: one page + one register ---------- */
  @media (max-width:900px){
    .book-stage{ perspective:1400px; padding:1rem .8rem 3rem; }
    .spread{ flex-direction:column; gap:.9rem; width:100%; max-width:540px; transform:none !important; }
    .reg-col{ width:100%; max-height:none; opacity:1 !important; }
    .reg-right{ display:none; }
    .leaf-slot{ display:none; }
    .reg-col ul{ flex-direction:row; overflow-x:auto; gap:7px; padding-bottom:4px; }
    .ordner-tab{ flex-shrink:0; width:auto; white-space:nowrap; margin:0 !important; border-radius:6px !important; text-align:left !important; }
    .right-holder{ width:100%; min-height:62vh; }
    .right-holder .page{ border-radius:2px; box-shadow:0 18px 34px -14px var(--shadow); }
  }
</style>
</head>
<body data-mode="light">

<script>
  /* ---------------- demo data ---------------- */
  const TODAY = new Date('2026-08-02');
  const daysAgo = d => { const x = new Date(TODAY); x.setDate(x.getDate()-d); return x; };
  const fmt = d => d.toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});
  function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    const c = v => Math.max(0,Math.min(255, v + Math.round(255*amt)));
    return '#'+((1<<24)+(c(n>>16)<<16)+(c((n>>8)&255)<<8)+c(n&255)).toString(16).slice(1);
  }
  const CATS = { Rezept:'#8a6a34', Projekt:'#3f5c46', Arbeit:'#4a3a5c', Alltag:'#35473f', Reise:'#5c2331', Lernen:'#4a5c6b', Familie:'#6b4a2e' };
  const FALLBACK_COLORS = ['#5c4a3a','#3a4a5c','#4a5c3a','#5c3a4a'];
  function colorForCategory(cat){
    if (CATS[cat]) return CATS[cat];
    let h = 0; for (let i=0;i<cat.length;i++) h = (h + cat.charCodeAt(i)) % FALLBACK_COLORS.length;
    return FALLBACK_COLORS[h];
  }
  function slugify(title, taken){
    let base = title.toLowerCase()
      .replace(/[äöüß]/g, c => ({ä:'ae',ö:'oe',ü:'ue',ß:'ss'}[c]))
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'notiz';
    let name = base, i = 2;
    while (taken.has(name+'.md')) name = `${base}-${i++}`;
    return name + '.md';
  }
  const CONTENT = {
    Rezept:['Zutaten und Zubereitungsschritte für dieses Gericht.','Nach mehrmaligem Testen die Version, die am besten funktioniert.'],
    Projekt:['Ideen, nächste Schritte und offene Fragen zu diesem Vorhaben.','Wird laufend ergänzt, sobald sich der Stand ändert.'],
    Arbeit:['Besprochene Punkte, Entscheidungen und nächste Schritte.','Verantwortlichkeiten und Termine im Überblick.'],
    Alltag:['Dinge, die erledigt werden müssen.','Wird bei Bedarf ergänzt und abgehakt.'],
    Reise:['Orte, Ideen und praktische Hinweise für die Reise.','Sammlung von Empfehlungen und Notizen unterwegs.'],
    Lernen:['Zusammenfassung der wichtigsten Punkte.','Notizen zum Nacharbeiten und Wiederholen.'],
    Familie:['Planung, Termine und Absprachen.','Wichtige Details für alle Beteiligten.']
  };
  const RAW = [
    ['Rezept','Rezept: Apfelkuchen',3],['Rezept','Rezept: Linsensuppe',18],['Rezept','Rezept: Pesto alla Genovese',40],
    ['Rezept','Rezept: Sonntagsbraten',65],['Rezept','Rezept: Zitronenkuchen',12],['Rezept','Rezept: Kürbissuppe',200],
    ['Rezept','Rezept: Bananenbrot',30],
    ['Projekt','Projektideen Sommer',13],['Projekt','Website Relaunch – Notizen',22],['Projekt','Gartenprojekt Kräuterbeet',8],
    ['Projekt','Buchprojekt: Kapitelplan',90],['Projekt','Renovierung Bad – Checkliste',55],['Projekt','App-Idee: Skizze',4],
    ['Projekt','Podcast-Konzept',130],
    ['Arbeit','Meeting-Notizen 28.07',5],['Arbeit','Jahresgespräch Vorbereitung',45],['Arbeit','Team-Retro Notizen',10],
    ['Arbeit','Kundentermin Müller GmbH',2],['Arbeit','Sprint Planning Q3',7],['Arbeit','Onboarding neue Kollegin',25],
    ['Arbeit','Präsentation Vorstand',60],
    ['Alltag','Einkaufsliste',1],['Alltag','Packliste Urlaub',15],['Alltag','Geschenkideen Weihnachten',20],
    ['Alltag','Wohnungsübergabe Checkliste',300],['Alltag','Umzugsplanung',280],['Alltag','To-do Wochenende',2],
    ['Alltag','Handwerker-Kontakte',110],['Alltag','Versicherungen Übersicht',400],
    ['Reise','Reisetagebuch Portugal',70],['Reise','Roadtrip Schottland – Route',35],['Reise','Städtetrip Wien Notizen',95],
    ['Reise','Packliste Skiurlaub',6],['Reise','Restaurants Lissabon',72],['Reise','Camping-Ausrüstung Liste',150],
    ['Reise','Visum-Unterlagen Japan',40],
    ['Lernen','Lernplan Spanisch',9],['Lernen','Zusammenfassung Statistik-Kurs',50],['Lernen','Notizen: Sapiens (Buch)',100],
    ['Lernen','Recherche Masterarbeit',14],['Lernen','Vokabeln Französisch',6],['Lernen','Online-Kurs UX-Design',28],
    ['Lernen','Prüfungsvorbereitung Mathe',160],
    ['Familie','Kindergeburtstag Planung',11],['Familie','Familienfeier Weihnachten',240],['Familie','Schulanmeldung Checkliste',190],
    ['Familie','Fotobuch Ideen',33],['Familie','Elternabend Notizen',17],['Familie','Ferienbetreuung Anmeldung',60],
    ['Familie','Familientreffen Sommer',4]
  ];
  const EXTRA_TAGS = {
    'Rezept: Linsensuppe':['Vegetarisch','Schnell'], 'Rezept: Kürbissuppe':['Vegetarisch'],
    'Rezept: Bananenbrot':['Schnell'], 'Rezept: Pesto alla Genovese':['Vegetarisch','Schnell'],
    'Sprint Planning Q3':['Wichtig'], 'Präsentation Vorstand':['Wichtig'],
    'Jahresgespräch Vorbereitung':['Wichtig'], 'Packliste Urlaub':['Reise'], 'Packliste Skiurlaub':['Reise'],
    'Kindergeburtstag Planung':['Wichtig'], 'Prüfungsvorbereitung Mathe':['Wichtig'],
    'Wohnungsübergabe Checkliste':['Wichtig'], 'Versicherungen Übersicht':['Wichtig']
  };
  const notes = RAW.map(([cat,title,d], i) => {
    const mod = daysAgo(d), cre = daysAgo(d + 5 + (i%20));
    return {
      id:i, title, category:cat, tags:[cat, ...(EXTRA_TAGS[title]||[])], spineColor: shade(CATS[cat], ((i%5)-2)*0.035),
      spineWidth: 36 + (i*7)%22, spineHeight: 212 + (i*11)%42,
      created: fmt(cre), createdSort: cre.getTime(), modified: fmt(mod), modifiedSort: mod.getTime(),
      author:'Du', content: CONTENT[cat], filename: null, source: null
    };
  });
  /* even id → left page, odd id → right page (recomputed, since notes can grow) */
  const leftNotes  = () => notes.filter(n => n.id % 2 === 0);
  const rightNotes = () => notes.filter(n => n.id % 2 === 1);

  /* ---------------- state ---------------- */
  let leftIdx = 0, rightIdx = 1;
  let isPicking = false, sortMode = 'kategorie', searchQuery = '';
  const activeTags = new Set();
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const spreadMode = () => window.innerWidth > 900;

  /* ---------------- shelf ---------------- */
  const shelfContainer = document.getElementById('shelfContainer');
  function booksPerRow(){ const w = innerWidth; return w>1100?10 : w>800?7 : w>520?5 : 3; }
  const spineHtml = n => `<button class="spine" data-note="${n.id}" style="--spine-color:${n.spineColor}; width:${n.spineWidth}px; height:${n.spineHeight}px;" aria-label="${n.title} aus dem Regal nehmen"><span class="spine-title">${n.title}</span></button>`;
  function rowsHtml(list){
    const per = booksPerRow(); let html='';
    for (let i=0;i<list.length;i+=per) html += `<div class="shelf-row">${list.slice(i,i+per).map(spineHtml).join('')}</div><div class="shelf-ledge"></div>`;
    return html;
  }
  /* cached lowercase haystack per note; WeakMap keeps it out of the saved objects */
  const searchCache = new WeakMap();
  function searchIndex(n){
    let s = searchCache.get(n);
    if (s === undefined){
      s = [n.title, n.author, ...(n.tags||[]), ...(n.content||[])].join('\n').toLowerCase();
      searchCache.set(n, s);
    }
    return s;
  }
  function matchesSearch(n, terms){
    const hay = searchIndex(n);
    return terms.every(t => hay.includes(t));
  }

  function renderShelf(){
    const terms = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let filtered = terms.length ? notes.filter(n => matchesSearch(n, terms)) : notes.slice();
    if (activeTags.size) filtered = filtered.filter(n => n.tags.some(t => activeTags.has(t)));
    if (!filtered.length){ shelfContainer.innerHTML = '<div class="shelf-empty">Keine Notiz gefunden.</div>'; return; }
    if (sortMode === 'kategorie'){
      const by = {};
      filtered.forEach(n => (by[n.category] = by[n.category]||[]).push(n));
      shelfContainer.innerHTML = Object.keys(by).sort((a,b)=>a.localeCompare(b,'de'))
        .map(c => `<div class="shelf-label">${c}</div>${rowsHtml(by[c])}`).join('');
    } else {
      const l = filtered.slice();
      if (sortMode==='az') l.sort((a,b)=>a.title.localeCompare(b.title,'de'));
      if (sortMode==='neu') l.sort((a,b)=>b.modifiedSort-a.modifiedSort);
      if (sortMode==='erstellt') l.sort((a,b)=>(b.createdSort||b.modifiedSort)-(a.createdSort||a.modifiedSort));
      shelfContainer.innerHTML = rowsHtml(l);
    }
  }
  shelfContainer.addEventListener('click', e => {
    const btn = e.target.closest('.spine');
    if (btn && !isPicking) takeBook(btn, +btn.dataset.note);
  });
  document.getElementById('shelfSearch').addEventListener('input', e => { searchQuery = e.target.value; renderShelf(); });
  document.querySelectorAll('.sort-toggle button').forEach(b => b.addEventListener('click', () => {
    sortMode = b.dataset.sort;
    document.querySelectorAll('.sort-toggle button').forEach(x=>x.classList.toggle('active', x===b));
    renderShelf();
  }));

  function allTags(){
    const s = new Set();
    notes.forEach(n => n.tags.forEach(t => s.add(t)));
    return Array.from(s).sort((a,b)=>a.localeCompare(b,'de'));
  }
  function updateTagFilterBtn(){
    const btn = document.getElementById('tagFilterBtn');
    btn.textContent = activeTags.size ? `Tags (${activeTags.size})` : 'Tags';
    btn.classList.toggle('active', activeTags.size > 0);
  }
  function renderTagFilterMenu(){
    const menu = document.getElementById('tagFilterMenu');
    const tags = allTags();
    const head = '<div class="tag-filter-head"><span>Nach Tags filtern</span>' +
                 '<button class="tag-filter-close" id="tagFilterClose" aria-label="Schließen">✕</button></div>';
    menu.innerHTML = head + (tags.length
      ? tags.map(t => `<button class="tag-chip${activeTags.has(t)?' selected':''}" data-tag="${t}"><span>${t}</span><span class="check">✓</span></button>`).join('')
        + (activeTags.size ? '<button class="tag-filter-clear" id="tagFilterClear">Filter zurücksetzen</button>' : '')
      : '<div class="tag-filter-empty">Noch keine Tags vorhanden.</div>');
  }
  document.getElementById('tagFilterBtn').addEventListener('click', e => {
    e.stopPropagation();
    const menu = document.getElementById('tagFilterMenu'), btn = e.currentTarget;
    const r = btn.getBoundingClientRect();
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - 296)) + 'px';
    menu.style.top = (r.bottom + 6) + 'px';
    renderTagFilterMenu();
    menu.hidden = !menu.hidden;
  });
  /* one robust closer for every popover. Several event types in the capture phase, because
     no single one reaches document reliably across mobile browsers and embedded webviews. */
  const POPOVERS = [
    ['tagFilterMenu','tagFilterBtn'], ['addMenu','addBtn'],
    ['printMenu','printBtn'], ['folderMenu','folderBtn']
  ];
  function closePopoversExcept(target){
    POPOVERS.forEach(([menuId, btnId]) => {
      const m = document.getElementById(menuId);
      if (!m || m.hidden) return;
      const keep = target && target.closest && target.closest(`#${menuId}, #${btnId}`);
      if (!keep) m.hidden = true;
    });
  }
  ['pointerdown','click','touchstart'].forEach(evt =>
    document.addEventListener(evt, e => closePopoversExcept(e.target), true));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopoversExcept(null); });

  document.getElementById('tagFilterMenu').addEventListener('click', e => {
    e.stopPropagation();
    if (e.target.closest('#tagFilterClose')){
      document.getElementById('tagFilterMenu').hidden = true;
      return;
    }
    const chip = e.target.closest('.tag-chip');
    if (chip){
      activeTags.has(chip.dataset.tag) ? activeTags.delete(chip.dataset.tag) : activeTags.add(chip.dataset.tag);
      renderTagFilterMenu(); updateTagFilterBtn(); renderShelf();
      return;
    }
    if (e.target.id === 'tagFilterClear'){
      activeTags.clear();
      renderTagFilterMenu(); updateTagFilterBtn(); renderShelf();
    }
  });

  let wasWide = spreadMode();
  addEventListener('resize', () => {
    renderShelf();
    if (spreadMode() !== wasWide){
      wasWide = spreadMode();
      if (wasWide && rightIdx % 2 === 0){ leftIdx = rightIdx; rightIdx = Math.min(rightIdx+1, notes.length-1); }
      else if (wasWide){ leftIdx = rightIdx - 1; }
      renderRegisters(); renderPages();
    }
  });

  /* ---------------- book rendering ---------------- */
  const spread = document.getElementById('spread'), leaf = document.getElementById('leaf');
  const rightHolder = document.getElementById('rightHolder'), bookView = document.getElementById('bookView');

  function inlineMdToHtml(text){
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function contentToHtml(lines){
    let html = '', i = 0;
    while (i < lines.length){
      const line = lines[i];
      if (line.startsWith('- ')){
        let items=''; while (i<lines.length && lines[i].startsWith('- ')){ items+=`<li>${inlineMdToHtml(lines[i].slice(2))}</li>`; i++; }
        html += `<ul>${items}</ul>`;
      } else if (/^\d+\.\s/.test(line)){
        let items=''; while (i<lines.length && /^\d+\.\s/.test(lines[i])){ items+=`<li>${inlineMdToHtml(lines[i].replace(/^\d+\.\s/,''))}</li>`; i++; }
        html += `<ol>${items}</ol>`;
      } else if (line.startsWith('### ')){ html += `<h3>${inlineMdToHtml(line.slice(4))}</h3>`; i++; }
      else if (line.startsWith('## ')){ html += `<h2>${inlineMdToHtml(line.slice(3))}</h2>`; i++; }
      else if (line.startsWith('# ')){ html += `<h1>${inlineMdToHtml(line.slice(2))}</h1>`; i++; }
      else if (line.startsWith('> ')){ html += `<blockquote>${inlineMdToHtml(line.slice(2))}</blockquote>`; i++; }
      else { html += `<p>${inlineMdToHtml(line)}</p>`; i++; }
    }
    return html;
  }
  function pageHtml(n, side){
    const sourceHtml = n.source ? `<div class="meta-source">Importiert aus: ${n.source}</div>` : '';
    return `<div class="page-head">
      <div class="page-head-row"><h1>${n.title}</h1><div class="page-actions">
        <button class="edit-btn" data-side="${side}" title="Bearbeiten" aria-label="Notiz bearbeiten">✎</button>
        <button class="del-btn" data-side="${side}" title="In den Papierkorb" aria-label="Notiz in den Papierkorb">🗑</button>
      </div></div>
      <div class="meta-line"><span>Erstellt: ${n.created}</span><span>Geändert: ${n.modified}</span><span>Autor: ${n.author}</span></div>
      ${sourceHtml}
      <div class="tags">${n.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
      <div class="page-body">${contentToHtml(n.content)}</div>
      <div class="page-foot">
        <button class="slide-btn" data-side="${side}" data-dir="-1" ${n.id - (spreadMode()?2:1) < 0 ?'disabled':''} aria-label="Vorherige Notiz">‹</button>
        <span>Notiz ${n.id+1} von ${notes.length}</span>
        <button class="slide-btn" data-side="${side}" data-dir="1" ${n.id + (spreadMode()?2:1) >= notes.length ?'disabled':''} aria-label="Nächste Notiz">›</button>
      </div>`;
  }
  function renderRegisters(){
    const tab = (n, side, cur) =>
      `<li><button class="ordner-tab${n.id===cur?' active':''}" style="--tab-color:${n.spineColor}" data-side="${side}" data-note="${n.id}">${n.title}</button></li>`;
    if (!spreadMode()){
      document.getElementById('regLeft').innerHTML = notes.map(n => tab(n,'single',rightIdx)).join('');
      document.getElementById('regRight').innerHTML = '';
      return;
    }
    document.getElementById('regLeft').innerHTML = leftNotes().map(n => tab(n,'left',leftIdx)).join('');
    document.getElementById('regRight').innerHTML = rightNotes().map(n => tab(n,'right',rightIdx)).join('');
  }
  function emptyPageHtml(){
    return notes.length
      ? '<div class="page-empty">—</div>'
      : '<div class="page-empty">Noch keine Notiz. Tippe oben auf "+".</div>';
  }
  function renderPage(side){
    if (side === 'left'){
      document.getElementById('pageLeft').innerHTML =
        notes[leftIdx] ? pageHtml(notes[leftIdx], 'left') : emptyPageHtml();
    } else {
      document.getElementById('pageRight').innerHTML =
        notes[rightIdx] ? pageHtml(notes[rightIdx], 'right') : emptyPageHtml();
    }
  }
  function renderPages(){ renderPage('left'); renderPage('right'); }

  /* page turn: hinge stays at the spine, 0.5 s out + 0.5 s in */
  /* a turn in progress is finished immediately when the next one starts,
     so quick successive taps stay responsive instead of being swallowed */
  const turning = { left:null, right:null };
  function finishTurn(key){
    const t = turning[key];
    if (!t) return;
    clearTimeout(t.timer);
    t.flip.remove();
    t.holder.classList.remove('turning-active');
    turning[key] = null;
  }
  function turnPage(side, noteId){
    const isLeft = side === 'left';
    const lockKey = isLeft ? 'left' : 'right';
    finishTurn(lockKey);
    if ((isLeft ? leftIdx : rightIdx) === noteId) return;
    if (!notes[noteId]) return;
    /* narrow mode labels its register entries "single", so match on the actual layout */
    const tabSide = spreadMode() ? side : 'single';
    document.querySelectorAll(`.ordner-tab[data-side="${tabSide}"]`)
      .forEach(el => el.classList.toggle('active', +el.dataset.note === noteId));

    const pageEl = document.getElementById(isLeft ? 'pageLeft' : 'pageRight');
    const holder = isLeft ? document.querySelector('.leaf-slot') : rightHolder;
    const set = v => { if (isLeft) leftIdx = v; else rightIdx = v; };

    if (reduced()){ set(noteId); renderPages(); return; }

    const oldHtml = pageEl.innerHTML;
    set(noteId);
    renderPage(side === 'single' ? 'right' : side);   /* only the turning page, not both */

    const flip = document.createElement('div');
    flip.className = 'flipper ' + (isLeft ? 'flip-left' : 'flip-right');
    flip.innerHTML =
      `<div class="flipper-face flipper-front"><article class="page">${oldHtml}</article><div class="flipper-shade"></div></div>
       <div class="flipper-face flipper-back"><article class="page"></article><div class="flipper-shade"></div></div>`;
    holder.appendChild(flip);
    holder.classList.add('turning-active');
    requestAnimationFrame(()=>requestAnimationFrame(()=>flip.classList.add('turning')));

    /* sheet is fully faded by 1000 ms, so removing at 1080 ms is never visible */
    turning[lockKey] = { flip, holder, timer: setTimeout(() => finishTurn(lockKey), 1080) };
  }
  function slidePage(side, dir){
    const isLeft = side === 'left';
    const cur = isLeft ? leftIdx : rightIdx;
    const step = spreadMode() ? 2 : 1;   /* spread: stay on this side's parity */
    const next = cur + dir*step;
    if (next < 0 || next >= notes.length) return;
    turnPage(side, next);
  }
  function attachSwipe(el, side){
    let sx = 0, sy = 0, tracking = false;
    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
    }, {passive:true});
    el.addEventListener('touchend', e => {
      if (!tracking) return; tracking = false;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5) slidePage(side, dx < 0 ? 1 : -1);
    }, {passive:true});
  }
  attachSwipe(leaf, 'left');
  attachSwipe(rightHolder, 'right');

  spread.addEventListener('click', e => {
    const tab = e.target.closest('.ordner-tab');
    if (tab){ turnPage(tab.dataset.side, +tab.dataset.note); return; }
    const editBtn = e.target.closest('.edit-btn');
    if (editBtn){ openEditForNote(editBtn.dataset.side); return; }
    const delBtn = e.target.closest('.del-btn');
    if (delBtn){ deleteNote(delBtn.dataset.side); return; }
    const slideBtn = e.target.closest('.slide-btn');
    if (slideBtn && !slideBtn.disabled) slidePage(slideBtn.dataset.side, +slideBtn.dataset.dir);
  });

  /* keyboard: turn the whole spread, like flipping a real page */
  function turnSpread(dir){
    if (!bookView.classList.contains('active')) return;
    if (!spreadMode()){ slidePage('right', dir); return; }
    const last = notes.length - 1;
    const nl = leftIdx + dir*2;
    if (nl < 0 || nl > last) return;               /* left page anchors the spread */
    turnPage('left', nl);
    const nr = rightIdx >= 0 ? rightIdx + dir*2 : nl + 1;   /* recover from an empty right page */
    if (nr >= 0 && nr <= last) turnPage('right', nr);
    else { rightIdx = -1; renderPage('right'); }   /* odd count: last spread has no facing page */
  }
  addEventListener('keydown', e => {
    const keys = { ArrowLeft:-1, PageUp:-1, ArrowRight:1, PageDown:1 };
    const dir = keys[e.key];
    if (dir === undefined) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!bookView.classList.contains('active')) return;
    if (editorView.classList.contains('active')) return;
    if (!document.getElementById('confirmOverlay').hidden) return;
    if (POPOVERS.some(([menuId]) => { const m = document.getElementById(menuId); return m && !m.hidden; })) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    e.preventDefault();
    turnSpread(dir);
  });

  /* ---------------- take book off shelf, then fold open ---------------- */
  function takeBook(spineEl, noteId){
    try{
      takeBookAnimated(spineEl, noteId);
    }catch(err){
      /* never let a failed animation leave the shelf permanently unclickable */
      isPicking = false;
      spineEl.classList.remove('spine-hidden');
      const row = spineEl.closest('.shelf-row'); if (row) row.classList.remove('picking');
      document.querySelectorAll('.fly-stage').forEach(s => s.remove());
      spread.classList.remove('closed'); spread.style.transform = '';
      leaf.classList.remove('opening'); leaf.style.setProperty('--lt','3px');
      bookView.classList.add('active');
      document.getElementById('printBtn').disabled = false;
    }
  }
  function takeBookAnimated(spineEl, noteId){
    isPicking = true;
    const n = notes[noteId];
    const rect = spineEl.getBoundingClientRect();

    /* wide: pick the spread this note sits on · narrow: it is simply the one page */
    if (!spreadMode()){ rightIdx = noteId; leftIdx = noteId; }
    else if (noteId % 2 === 0){ leftIdx = noteId; rightIdx = Math.min(noteId+1, notes.length-1); }
    else { rightIdx = noteId; leftIdx = noteId-1; }
    renderRegisters(); renderPages();
    document.getElementById('leafCover').innerHTML =
      `<div class="cover-art"><div class="cover-rule"></div><h2>${n.title}</h2><div class="cover-rule"></div></div>
       <div class="face-shade"></div>`;
    document.getElementById('leafCover').style.setProperty('--spine-color', n.spineColor);
    document.getElementById('leafEdge').style.setProperty('--spine-color', n.spineColor);

    /* measure where the closed book will sit (book view keeps layout while hidden) */
    spread.classList.remove('closed'); spread.style.transform = '';
    const rightRect = rightHolder.getBoundingClientRect();
    const spreadRect = spread.getBoundingClientRect();
    const dx = (spreadRect.left + spreadRect.width/2) - (rightRect.left + rightRect.width/2);
    const wide = spreadMode();
    const closedLeft = wide ? rightRect.left + dx : rightRect.left;
    const targetW = rightRect.width, targetH = Math.max(rightRect.height, 300);
    const targetTop = wide ? rightRect.top : Math.max(60, innerHeight/2 - targetH/2);

    /* --- solid book body: final cover box is fixed, motion is pure transform --- */
    const W = targetW, H = targetH;
    const s0 = rect.height / H;          // uniform scale, no stretching
    const D  = rect.width / s0;          // thickness so the spine face matches the shelf exactly
    const dx0 = (rect.left+rect.width/2) - (closedLeft+W/2);
    const dy0 = (rect.top+rect.height/2) - (targetTop+H/2);
    const zSpine = s => -(W/2)*s;        // keep the face we look at near the camera plane
    const zCover = s => -(D/2)*s;
    const tf = ({x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1}) =>
      `translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;

    const stage = document.createElement('div');
    stage.className = 'fly-stage';
    const fly = document.createElement('div');
    fly.className = 'book3d';
    fly.style.setProperty('--spine-color', n.spineColor);
    fly.style.setProperty('--w', W+'px');
    fly.style.setProperty('--h', H+'px');
    fly.style.setProperty('--d', D+'px');
    fly.style.cssText += `left:${closedLeft}px; top:${targetTop}px; width:${W}px; height:${H}px;`;
    fly.style.transform = tf({x:dx0, y:dy0, z:zSpine(s0), ry:90, s:s0});
    fly.innerHTML = `
      <div class="bf bf-back"></div>
      <div class="bf bf-edge"></div>
      <div class="bf bf-top"></div>
      <div class="bf bf-bottom"></div>
      <div class="bf bf-spine"><span class="spine-title">${n.title}</span></div>
      <div class="bf bf-cover"><div class="cover-art"><div class="cover-rule"></div><h2>${n.title}</h2><div class="cover-rule"></div></div></div>`;
    stage.appendChild(fly);
    document.body.appendChild(stage);
    spineEl.classList.add('spine-hidden');
    spineEl.closest('.shelf-row').classList.add('picking');

    /* book view waits in closed state underneath */
    if (wide){ spread.style.transform = `translateX(${dx}px)`; spread.classList.add('closed'); }
    leaf.style.transform = '';

    const cleanup = () => {
      stage.remove();
      spineEl.classList.remove('spine-hidden');
      const row = spineEl.closest('.shelf-row'); if (row) row.classList.remove('picking');
      isPicking = false;
    };
    const openUp = () => {
      bookView.classList.add('active');
      document.getElementById('printBtn').disabled = false;
      stage.style.transition = 'opacity .35s ease'; stage.style.opacity = '0';
      leaf.style.setProperty('--lt','12px');           /* hardcover board while opening */
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        spread.classList.remove('closed');
        spread.style.transform = '';
        leaf.classList.add('opening');                 /* cover swings on the spine */
      }));
      setTimeout(()=>{
        leaf.classList.remove('opening');
        leaf.style.setProperty('--lt','3px');          /* back to single-sheet thickness */
      }, 1400);
    };

    if (reduced()){
      fly.style.transition = 'transform .18s linear';
      requestAnimationFrame(()=>{ fly.style.transform = tf({z:zCover(1)}); });
      setTimeout(()=>{ openUp(); cleanup(); }, 220);
      return;
    }

    const s1 = s0 + (1-s0)*0.55, s2 = s0 + (1-s0)*0.85;

    /* 0–800 ms · oben ankippen und aus der Reihe lösen */
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      fly.style.transition = 'transform 800ms cubic-bezier(.34,.2,.4,1)';
      fly.style.transform = tf({x:dx0, y:dy0-12, z:zSpine(s0)+16, rx:-11, ry:90, rz:-4, s:s0*1.05});
    }));
    /* 800–1900 ms · zum Betrachter herausziehen, Rücken noch vorn */
    setTimeout(()=>{
      fly.style.transition = 'transform 1100ms cubic-bezier(.3,0,.3,1)';
      fly.style.transform = tf({x:dx0*0.34, y:dy0*0.34-18, z:zSpine(s1)+80, rx:-7, ry:90, rz:-2, s:s1});
    }, 800);
    /* 1900–3100 ms · in der Hand drehen, Cover kommt nach vorn (mit leichtem Überschwingen) */
    setTimeout(()=>{
      fly.style.transition = 'transform 1200ms cubic-bezier(.45,0,.2,1)';
      fly.style.transform = tf({x:dx0*0.10, y:dy0*0.10-6, z:zCover(s2)+60, rx:-3, ry:-7, rz:1, s:s2});
    }, 1900);
    /* 3100–3700 ms · aufrichten und in die Mitte legen */
    setTimeout(()=>{
      fly.style.transition = 'transform 600ms cubic-bezier(.22,.61,.36,1)';
      fly.style.transform = tf({z:zCover(1)});
    }, 3100);
    /* 3700–5000 ms · aufklappen */
    setTimeout(openUp, 3700);
    setTimeout(cleanup, 4100);
  }

  document.querySelector('.back-to-shelf').addEventListener('click', () => {
    bookView.classList.remove('active');
    document.getElementById('printBtn').disabled = true;
  });
  document.querySelectorAll('[data-mode-choice]').forEach(b => b.addEventListener('click', () => {
    document.body.setAttribute('data-mode', b.dataset.modeChoice);
    document.querySelectorAll('[data-mode-choice]').forEach(x=>x.classList.toggle('active', x===b));
  }));

  /* ---------------- create / import new notes ---------------- */
  const addBtn = document.getElementById('addBtn'), addMenu = document.getElementById('addMenu');
  const editorView = document.getElementById('editorView'), editorBody = document.getElementById('editorBody');
  const editorTitle = document.getElementById('editorTitle'), editorCategory = document.getElementById('editorCategory');
  const editorTags = document.getElementById('editorTags');
  const editorSource = document.getElementById('editorSource'), editorHint = document.getElementById('editorHint');
  const importInput = document.getElementById('importInput');
  let pendingSource = null;
  let editingNoteId = null;

  Object.keys(CATS).sort((a,b)=>a.localeCompare(b,'de')).forEach(c=>{
    const o = document.createElement('option'); o.value = c; o.textContent = c; editorCategory.appendChild(o);
  });

  addBtn.addEventListener('click', e => { e.stopPropagation(); addMenu.hidden = !addMenu.hidden; });

  let importToken = 0;
  let editorSnapshot = null;
  function snapshotEditor(){
    return JSON.stringify({ t:editorTitle.value, c:editorCategory.value,
                            g:editorTags.value, b:editorBody.innerHTML });
  }
  function editorIsDirty(){ return editorSnapshot !== null && snapshotEditor() !== editorSnapshot; }
  function openEditor({title='', category='', bodyHtml='', source=null, editId=null, tags=[]} = {}){
    importToken++;
    addMenu.hidden = true;
    editingNoteId = editId;
    editorTitle.value = title;
    editorCategory.value = category;
    editorTags.value = tags.filter(t => t !== category).join(', ');
    editorBody.innerHTML = bodyHtml;
    pendingSource = source;
    editorSource.textContent = source ? `Importiert aus: ${source}` : '';
    editorHint.textContent = '';
    document.getElementById('editorSave').textContent = editId===null ? 'Speichern' : 'Änderungen speichern';
    editorView.classList.add('active');
    editorSnapshot = snapshotEditor();
    setTimeout(()=>editorTitle.focus(), 50);
  }
  function closeEditor(){ editorView.classList.remove('active'); editorSnapshot = null; }
  function openEditForNote(side){
    const n = notes[side === 'left' ? leftIdx : rightIdx];
    openEditor({ title:n.title, category:n.category, bodyHtml:contentToHtml(n.content), source:n.source||null, editId:n.id, tags:n.tags });
  }

  document.getElementById('addBlank').addEventListener('click', () => openEditor());
  document.getElementById('addImport').addEventListener('click', () => { addMenu.hidden = true; importInput.click(); });
  document.getElementById('editorCancel').addEventListener('click', async () => {
    if (editorIsDirty()){
      const ok = await confirmDialog('Ungespeicherte Änderungen verwerfen?', 'Verwerfen');
      if (!ok) return;
    }
    closeEditor();
  });
  addEventListener('beforeunload', e => {
    if (editorView.classList.contains('active') && editorIsDirty()){ e.preventDefault(); e.returnValue = ''; }
  });

  function loadScript(src){
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('load failed: '+src));
      document.head.appendChild(s);
    });
  }
  async function loadPdfJs(){
    if (window.pdfjsLib) return window.pdfjsLib;
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/';
    const mod = await import(base + 'pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
    window.pdfjsLib = mod;
    return mod;
  }
  async function loadMammoth(){
    if (window.mammoth) return window.mammoth;
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js');
    return window.mammoth;
  }
  async function extractPdfText(file){
    const pdfjsLib = await loadPdfJs();
    const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const paragraphs = [];
    for (let i=1; i<=doc.numPages; i++){

      if (text) paragraphs.push(text);
    }
    return contentToHtml(paragraphs.length ? paragraphs : ['(Kein Text im PDF gefunden – evtl. ein gescanntes Dokument ohne Textebene.)']);
  }

  function inlineToMd(node){
    let out = '';
    node.childNodes.forEach(child => {
      if (child.nodeType === 3){ out += child.textContent; return; }
      const tag = child.tagName;
      if (tag==='B'||tag==='STRONG') out += `**${inlineToMd(child)}**`;
      else if (tag==='I'||tag==='EM') out += `*${inlineToMd(child)}*`;
      else if (tag==='A') out += `[${inlineToMd(child)}](${child.getAttribute('href')||''})`;
      else if (tag==='BR') out += ' ';
      else out += inlineToMd(child);
    });
    return out;
  }
  function htmlToMarkdown(root){
    const lines = [];
    root.childNodes.forEach(node => {
      if (node.nodeType !== 1){ const t=(node.textContent||'').trim(); if (t) lines.push(t); return; }
      const tag = node.tagName;
      if (tag==='H1') lines.push('# '+inlineToMd(node).trim());
      else if (tag==='H2') lines.push('## '+inlineToMd(node).trim());
      else if (tag==='H3') lines.push('### '+inlineToMd(node).trim());
      else if (tag==='BLOCKQUOTE') lines.push('> '+inlineToMd(node).trim());
      else if (tag==='UL') node.querySelectorAll(':scope > li').forEach(li=>lines.push('- '+inlineToMd(li).trim()));
      else if (tag==='OL') { let i=1; node.querySelectorAll(':scope > li').forEach(li=>lines.push((i++)+'. '+inlineToMd(li).trim())); }
      else { const t=inlineToMd(node).trim(); if (t) lines.push(t); }
    });
    return lines.filter(Boolean);
  }

  function noteToMarkdown(n){
    const fm = ['---', `title: ${n.title}`,
      `created: ${n.created}`, `created_iso: ${new Date(n.createdSort||Date.now()).toISOString()}`,
      `modified: ${n.modified}`, `modified_iso: ${new Date(n.modifiedSort||Date.now()).toISOString()}`,
      `author: ${n.author}`, `tags: [${n.tags.join(', ')}]`];
    if (n.source) fm.push(`source: ${n.source}`);
    fm.push('---', '');
    return fm.join('\n') + n.content.join('\n\n');
  }
  function parseMarkdownFile(text, filename, fileLastMod){
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    let meta = {}, body = text;
    if (m){
      body = m[2];
      m[1].split(/\r?\n/).forEach(line => {
        const mm = line.match(/^(\w+):\s*(.*)$/); if (!mm) return;
        const key = mm[1], val = mm[2].trim();
        meta[key] = key === 'tags' ? val.replace(/^\[|\]$/g,'').split(',').map(s=>s.trim()).filter(Boolean) : val;
      });
    }
    const contentLines = body.split(/\r?\n+/).map(l=>l.trim()).filter(Boolean);
    const category = (meta.tags && meta.tags[0]) || 'Ohne Kategorie';
    const modSort = meta.modified_iso ? Date.parse(meta.modified_iso) : fileLastMod;
    const creSort = meta.created_iso ? Date.parse(meta.created_iso) : fileLastMod;
    return {
      title: meta.title || filename.replace(/\.md$/,''),
      category, tags: meta.tags && meta.tags.length ? meta.tags : [category],
      created: meta.created || fmt(new Date(creSort)), createdSort: creSort,
      modified: meta.modified || fmt(new Date(modSort)), modifiedSort: modSort,
      author: meta.author || 'Du', source: meta.source || null,
      content: contentLines.length ? contentLines : ['(Kein Inhalt)'],
      filename, fileMtime: fileLastMod
    };
  }
  function exportMarkdown(n){

  /* ---------------- persistence: real folder (Chromium) + IndexedDB fallback ---------------- */
  const hasFSAccess = 'showDirectoryPicker' in window;

  let idbPromise = null;
  function idbOpen(){
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('noteos-store', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', {keyPath:'filename'});
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
        if (!db.objectStoreNames.contains('trash')) db.createObjectStore('trash', {keyPath:'filename'});
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return idbPromise;
  }
  function idbGetAllNotes(){
    return idbOpen().then(db => new Promise((resolve, reject) => {
      const req = db.transaction('notes','readonly').objectStore('notes').getAll();
      req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
    }));
  }
  function idbPutNote(note){
    return idbOpen().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('notes','readwrite'); tx.objectStore('notes').put(note);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    }));
  }
  function idbSetMeta(key, val){
    return idbOpen().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('meta','readwrite'); tx.objectStore('meta').put(val, key);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    }));
  }
  function idbGetMeta(key){
    return idbOpen().then(db => new Promise((resolve, reject) => {
      const req = db.transaction('meta','readonly').objectStore('meta').get(key);
      req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
    }));
  }

  function replaceNotes(list){
    notes.length = 0;
    list.forEach((n,i) => { n.id = i; notes.push(n); });
    leftIdx = 0; rightIdx = notes.length > 1 ? 1 : 0;
  }
  function rebuildSpines(list){
    list.forEach((n,i) => {
      n.spineColor = shade(colorForCategory(n.category), ((i%5)-2)*0.035);
      n.spineWidth = 36 + (i*7)%22; n.spineHeight = 212 + (i*11)%42;
    });
  }

  async function loadNotesFromFolder(){
    const loaded = [];
    for await (const [name, handle] of dirHandle.entries()){
      if (handle.kind !== 'file' || !name.toLowerCase().endsWith('.md')) continue;
      try{
        const file = await handle.getFile();
        loaded.push(parseMarkdownFile(await file.text(), name, file.lastModified));
      }catch(e){ /* skip unreadable file */ }
    }
    loaded.sort((a,b)=>a.title.localeCompare(b.title,'de'));
    rebuildSpines(loaded);
    replaceNotes(loaded);
  }

  async function saveConflictCopy(filename, text){
    const dir = await dirHandle.getDirectoryHandle('Konflikte', {create:true});
    const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    const fh = await dir.getFileHandle(filename.replace(/\.md$/, `.${stamp}.md`), {create:true});
    const wr = await fh.createWritable();
    await wr.write(text);
    await wr.close();
  }

  /* write the new file first, remove the old one only afterwards — never lose the note */
  async function renameNoteFile(note, newFilename){
    let conflict = false;
    const oldName = note.filename;
    try{
      const oldHandle = await dirHandle.getFileHandle(oldName);
      const existing = await oldHandle.getFile();
      if (note.fileMtime && existing.lastModified > note.fileMtime + 1500){
        await saveConflictCopy(oldName, await existing.text());
        conflict = true;
      }
    }catch(e){ /* old file already gone */ }
    note.filename = newFilename;
    note.fileMtime = null;                 /* new path has no baseline yet */
    await writeNoteFile(note);
    try{ await dirHandle.removeEntry(oldName); }catch(e){ /* leave the old file rather than fail */ }
    return conflict;
  }
  function idbRenameNote(note, oldFilename){
    return idbOpen().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('notes','readwrite');
      tx.objectStore('notes').put(note);
      tx.objectStore('notes').delete(oldFilename);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    }));
  }

  /* returns true if the file had been changed outside NoteOS and was rescued first */
  async function writeNoteFile(note){
    if (fsMode !== 'fs' || !dirHandle) return false;
    const handle = await dirHandle.getFileHandle(note.filename, {create:true});
    let conflict = false;
    if (note.fileMtime){
      try{
        const existing = await handle.getFile();
        if (existing.lastModified > note.fileMtime + 1500){
          await saveConflictCopy(note.filename, await existing.text());
          conflict = true;
        }
      }catch(e){ /* file missing or unreadable — nothing to rescue */ }
    }
    const writable = await handle.createWritable();
    await writable.write(noteToMarkdown(note));
    await writable.close();
    try{ note.fileMtime = (await handle.getFile()).lastModified; }catch(e){}
    return conflict;
  }

  const folderErrorMsg = () => 'Ordnerzugriff nicht möglich. Das kann an dieser eingebetteten Vorschau liegen – öffne die Datei dazu einmal direkt in einem eigenen Browser-Tab statt in der Vorschau hier.';

  async function tryRestoreFolder(){

  async function reloadFolder(){
    if (editorView.classList.contains('active') && editorIsDirty()){
      const ok = await confirmDialog('Der Editor hat ungespeicherte Änderungen. Trotzdem neu einlesen?', 'Neu einlesen');
      if (!ok) return;
      closeEditor();
    }
    /* remember by filename, since positions shift when files were added or removed */
    const keepLeft  = notes[leftIdx]  && notes[leftIdx].filename;
    const keepRight = notes[rightIdx] && notes[rightIdx].filename;
    try{
      await loadNotesFromFolder();
    }catch(err){ toast('Neu einlesen fehlgeschlagen.'); return; }
    const li = notes.findIndex(n => n.filename === keepLeft);
    const ri = notes.findIndex(n => n.filename === keepRight);
    if (li >= 0) leftIdx = li;
    if (ri >= 0) rightIdx = ri;
    clampIndices();
    finishTurn('left'); finishTurn('right');
    renderShelf(); renderRegisters(); renderPages();
    toast(`${notes.length} Notiz${notes.length===1?'':'en'} neu eingelesen.`);
  }
  document.getElementById('folderReload').addEventListener('click', () => {
    document.getElementById('folderMenu').hidden = true; reloadFolder();
  });
  document.getElementById('folderDisconnect').addEventListener('click', disconnectFolder);

  async function initStorage(){
    if (hasFSAccess){
      const restored = await tryRestoreFolder();
      if (restored === true){ renderShelf(); renderRegisters(); renderPages(); }
      updateFolderStatus();
      return;
    }
    try{
      const cached = await idbGetAllNotes();
      if (cached && cached.length){
        cached.sort((a,b)=>a.title.localeCompare(b.title,'de'));
        rebuildSpines(cached);
        replaceNotes(cached);
        fsMode = 'idb';
        renderShelf(); renderRegisters(); renderPages();
      }
    }catch(e){ /* IndexedDB unavailable — demo notes stay visible */ }
    updateFolderStatus();
  }

  renderShelf(); renderRegisters(); renderPages();
  /* ---------------- confirmation dialog + toast ---------------- */
  let confirmResolve = null;
  function confirmDialog(text, okLabel='In den Papierkorb'){
    return new Promise(resolve => {
      confirmResolve = resolve;
      document.getElementById('confirmText').textContent = text;
      document.getElementById('confirmOk').textContent = okLabel;
      document.getElementById('confirmOverlay').hidden = false;
    });
  }
  function closeConfirm(result){
    document.getElementById('confirmOverlay').hidden = true;
    if (confirmResolve){ const r = confirmResolve; confirmResolve = null; r(result); }
  }
  document.getElementById('confirmOk').addEventListener('click', ()=>closeConfirm(true));
  document.getElementById('confirmCancel').addEventListener('click', ()=>closeConfirm(false));
  document.getElementById('confirmOverlay').addEventListener('click', e => {
    if (e.target.id === 'confirmOverlay') closeConfirm(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('confirmOverlay').hidden) closeConfirm(false);
  });

  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
  }

  /* ---------------- delete: move the file into a "Papierkorb" subfolder ---------------- */
  async function moveFileToTrash(n){
    const trashDir = await dirHandle.getDirectoryHandle('Papierkorb', {create:true});
    const fh = await trashDir.getFileHandle(n.filename, {create:true});
    const wr = await fh.createWritable();
    await wr.write(noteToMarkdown(n));
    await wr.close();
    await dirHandle.removeEntry(n.filename);
  }
  function idbMoveToTrash(n){
    return idbOpen().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(['notes','trash'],'readwrite');
      tx.objectStore('trash').put(n);
      tx.objectStore('notes').delete(n.filename);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    }));
  }

  /* note ids are array positions, so removing one shifts every id after it */
  function reindexNotes(){ notes.forEach((n,i) => n.id = i); }
  function clampIndices(){
    if (!notes.length){ leftIdx = 0; rightIdx = -1; return; }
    const last = notes.length - 1;
    if (!spreadMode()){
      rightIdx = Math.max(0, Math.min(rightIdx, last));
      leftIdx = rightIdx;
      return;
    }
    leftIdx = Math.max(0, Math.min(leftIdx, last));
    if (leftIdx % 2 !== 0) leftIdx = Math.max(0, leftIdx - 1);
    rightIdx = Math.min(rightIdx, last);
    if (rightIdx % 2 !== 1){
      if (rightIdx + 1 <= last) rightIdx += 1;
      else if (rightIdx - 1 >= 1) rightIdx -= 1;
      else rightIdx = -1;                 /* no odd page left to show */
    }
  }

  async function deleteNote(side){
    const idx = side === 'left' ? leftIdx : rightIdx;
    const n = notes[idx];
    if (!n) return;
    const ok = await confirmDialog(`„${n.title}" in den Papierkorb verschieben?`);
    if (!ok) return;
    try{
      if (fsMode === 'fs' && dirHandle && n.filename) await moveFileToTrash(n);
      else if (fsMode === 'idb' && n.filename) await idbMoveToTrash(n);
    }catch(err){
      toast('Verschieben fehlgeschlagen – Notiz bleibt erhalten.');
      return;
    }
    notes.splice(idx, 1);
    reindexNotes();
    clampIndices();
    finishTurn('left'); finishTurn('right');
    renderShelf(); renderRegisters(); renderPages();
    toast(fsMode === 'fs'
      ? `„${n.title}" liegt jetzt im Ordner „Papierkorb".`
      : `„${n.title}" in den Papierkorb verschoben.`);
  }

  initStorage();
</script>
