<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notizbuch – Wissen der Werkbank</title>
<meta name="description" content="Notizen als Kartei: Kategorien, Tags und Volltext – lokal im Ordner gespeichert.">
<meta name="theme-color" content="#06090E">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%2306090E'/%3E%3Cg%20transform='translate%2816%2016%29%20scale%280.19%29%20translate%28-60%20-56%29'%3E%3Cpath%20d='M26%2C16%20V62%20A34%2C34%200%200%200%2094%2C62%20V16'%20fill='none'%20stroke='%23EDF0F3'%20stroke-width='22'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='60'%20cy='64'%20r='18.5'%20fill='%23F2B33D'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
/* Theme vor dem ersten Bild setzen – gleicher Schlüssel wie im Cockpit,
   gleiche Herkunft, also teilen sich alle Werkzeuge die Einstellung. */
(function(){var t=null;try{t=localStorage.getItem('wb-cockpit-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  color-scheme:dark;
  --void:#06090E;
  --bg-grad:linear-gradient(175deg,#070B11 0%,#0A121B 38%,#0C1620 68%,#080C12 100%);
  --glass:rgba(16,22,31,.55);
  --glass-2:rgba(12,17,24,.82);
  --glass-edge:rgba(255,255,255,.10);
  --sheet:rgba(20,27,37,.72);
  --text:#EDF0F3;--text-2:#9BA6B2;--text-3:#6B7683;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.05);
  --line-hi:rgba(242,179,61,.38);
  --amber:#F2B33D;--teal:#63D9C4;--danger:#E2725B;
  --em-1:#F2B33D;--em-2:#F7CF83;--em-3:#63D9C4;
  --glow-a:rgba(242,179,61,.10);--glow-t:rgba(99,217,196,.08);
  --shadow:0 18px 46px -22px rgba(0,0,0,.75);
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
  --on-accent:#12171F;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --max:1180px;--pad:22px;
  --t-s:.25s;--t-m:.45s;
}
html[data-theme="light"]{
  color-scheme:light;
  --void:#EEF1F6;
  --bg-grad:linear-gradient(175deg,#F5F7FA 0%,#EAEEF4 38%,#E6EBF2 68%,#F2F4F8 100%);
  --glass:rgba(255,255,255,.60);
  --glass-2:rgba(248,250,252,.88);
  --glass-edge:rgba(17,25,35,.10);
  --sheet:rgba(255,255,255,.78);
  --text:#111923;--text-2:#4A5563;--text-3:#7A8491;
  --line:rgba(17,25,35,.10);
  --line-2:rgba(17,25,35,.06);
  --line-hi:rgba(224,162,31,.55);
  --amber:#E0A21F;--teal:#2FA894;--danger:#B4442E;
  --em-1:#C98A0C;--em-2:#E0A21F;--em-3:#2FA894;
  --glow-a:rgba(224,162,31,.13);--glow-t:rgba(47,168,148,.10);
  --shadow:0 18px 40px -24px rgba(30,40,60,.30);
  --shadow-lg:0 30px 70px -34px rgba(30,40,60,.42);
  --on-accent:#FFFFFF;
}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.locked{overflow:hidden;background:var(--void)}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--display);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .35s ease,color .35s ease}
a{color:inherit}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── Hintergrund ───────────────────────────────────────────── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg-grad)}
.bg i{position:absolute;border-radius:50%;filter:blur(60px)}
.bg .g1{width:620px;height:620px;left:-180px;top:-220px;background:radial-gradient(circle,var(--glow-a),transparent 70%)}
.bg .g2{width:720px;height:720px;right:-260px;top:38%;background:radial-gradient(circle,var(--glow-t),transparent 70%)}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 62%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 62%)}

/* ── Navigation ────────────────────────────────────────────── */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(12px + env(safe-area-inset-top)) var(--pad) 0}
/* Zurück ins Kontor – nur, wenn das Notizbuch aus dem Kontor gestartet wurde */
.kontor-zurueck{position:fixed;z-index:41;top:calc(12px + env(safe-area-inset-top));left:var(--pad);
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--text);
  border:1px solid var(--glass-edge);background:var(--glass);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  transition:color var(--t-s),border-color var(--t-s)}
.kontor-zurueck svg{width:20px;height:20px}
.kontor-zurueck:hover{color:var(--amber);border-color:var(--amber)}
.kontor-zurueck[hidden]{display:none}
@media (max-width:1360px){ body.aus-kontor .nav{padding-left:calc(var(--pad) + 62px)} }
.nav-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:14px;height:52px;padding:0 8px 0 18px;
  border-radius:100px;border:1px solid var(--glass-edge);background:var(--glass);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.brand b{font-weight:800;font-variation-settings:'wdth' 112}
.mark{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;flex:none;color:var(--text)}
.mark svg{width:100%;height:100%;display:block;overflow:visible}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:12px;color:var(--text-3);letter-spacing:.08em;margin-right:6px;font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:100px;border:1px solid var(--glass-edge);
  background:transparent;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background var(--t-s),border-color var(--t-s),color var(--t-s)}
.pill:hover{background:var(--glass);border-color:var(--line-hi)}
.pill:disabled{opacity:.35;cursor:default}
.pill:disabled:hover{background:transparent;border-color:var(--glass-edge)}
.pill.primary{background:var(--amber);color:var(--on-accent);border-color:transparent;font-weight:600}
.pill.primary:hover{background:var(--amber);filter:brightness(1.06)}
.pill.on{background:var(--amber);color:var(--on-accent);border-color:transparent;font-weight:600}
.icon-btn{width:36px;padding:0;justify-content:center}
.pill svg{width:16px;height:16px;flex:none}
.sun{display:none}
html[data-theme="light"] .sun{display:block}
html[data-theme="light"] .moon{display:none}
.dot-state{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
.dot-state.on{background:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
.dot-state.warn{background:var(--amber)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:2px}

/* ── Hero ──────────────────────────────────────────────────── */
main{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.hero{padding:clamp(112px,16vw,158px) 0 clamp(20px,4vw,34px)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);
  display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--amber);flex:none}
.hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.hero-count{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--text-3);white-space:nowrap}
h1{font-family:var(--display);font-size:clamp(38px,6.6vw,78px);line-height:.98;letter-spacing:-.045em;margin:20px 0 0;font-weight:700}
/* Hero-Zeile: eine Zeile, die Größe passt fitHero() an die Breite an */
#heroTitle{font-size:72px;white-space:nowrap;margin-top:18px}
#heroTitle.umbruch{white-space:normal;text-wrap:balance}
h1 span{font-variation-settings:'wdth' 116,'wght' 800}
h1 em{font-style:italic;font-weight:600;background:linear-gradient(94deg,var(--em-1),var(--em-2) 52%,var(--em-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.lead{max-width:560px;color:var(--text-2);font-size:clamp(15.5px,1.8vw,18px);margin:20px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:24px;font-family:var(--mono);font-size:12.5px;color:var(--text-3)}
.stats b{color:var(--text);font-weight:500}

/* ── Bühne: immer nur eine Ansicht, weich überblendet ──────── */
.stage{position:relative;will-change:height}
.view{display:none}
.view.is-on{display:block}
.view-ghost{position:absolute;left:0;right:0;top:0;z-index:2;pointer-events:none}
.lead{transition:opacity var(--t-s)}

/* Glasscheiben: der ganze Bestand als Kamm – eine Scheibe je Notiz.
   Die Scheibe im Ziel schwenkt als Vollkörperglas auf wie ein Buchdeckel;
   darunter läuft die Notiz aus dem Glas heraus. */
.scope{margin:0;--pw:26px;padding-bottom:70px}
.scope-wrap{position:relative}
.panes{position:relative;height:clamp(150px,19vw,224px);overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;cursor:grab;touch-action:pan-x pinch-zoom;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.panes::-webkit-scrollbar{display:none}
.panes.dragging{cursor:grabbing;scroll-snap-type:none}
.panes-track{display:flex;align-items:center;gap:3px;height:100%;padding-inline:50%;perspective:1100px;width:max-content}
.pane{position:relative;flex:0 0 auto;width:var(--pw);height:var(--h,58%);padding:0;border:0;background:none;
  scroll-snap-align:center;cursor:pointer;border-radius:2px;transform-style:preserve-3d;
  transform:translateY(var(--y,0px)) rotate(var(--rot,0deg));
  transition:height var(--t-m) cubic-bezier(.2,.8,.2,1),transform var(--t-m) cubic-bezier(.2,.8,.2,1)}
.pane:focus-visible{outline:none}
/* geschliffenes Glas: heller Kopf, sattes Mittelstück, dunkler Fuß, Kanten wie Schliff */
.pane-glass{position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--wc,#F2B33D) 55%,#fff) 0%,
    var(--wc,#F2B33D) 22%,
    color-mix(in srgb,var(--wc,#F2B33D) 74%,var(--void)) 62%,
    color-mix(in srgb,var(--wc,#F2B33D) 38%,var(--void)) 100%);
  box-shadow:inset 1.5px 0 0 rgba(255,255,255,.42),inset -1.5px 0 0 rgba(0,0,0,.5),
             2px 0 7px -4px rgba(0,0,0,.85);
  transition:filter var(--t-m),box-shadow var(--t-m),opacity var(--t-m)}
/* Lichtkante, die über die Scheibe läuft */
.pane-glass::after{content:"";position:absolute;left:26%;top:0;bottom:0;width:22%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);opacity:.75}
.pane:hover .pane-glass{filter:brightness(1.14)}
/* Beschriftung im Farbblock: nur die erste Scheibe einer Kategorie trägt sie */
.pane-label{position:absolute;inset:7px 0 7px;display:flex;align-items:flex-start;justify-content:center;
  writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  color:rgba(10,14,20,.8);white-space:nowrap;overflow:hidden;pointer-events:none}
.pane.is-active{height:var(--ha,86%);transform:translateY(0) rotate(0deg);z-index:6}
.pane.is-active .pane-glass{filter:brightness(1.09) saturate(1.16);
  box-shadow:inset 1.5px 0 0 rgba(255,255,255,.6),inset -1.5px 0 0 rgba(0,0,0,.45),
             0 18px 34px -20px rgba(0,0,0,.95),0 0 30px -8px color-mix(in srgb,var(--wc) 75%,transparent)}
/* Vollkörperglas: der aufgeschwenkte Buchdeckel mit dem Titel */
.pane-body{position:absolute;left:calc(var(--pw) - 2px);top:50%;z-index:5;
  width:clamp(158px,18vw,216px);height:clamp(112px,13vw,148px);
  display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:14px 16px 13px;
  border-radius:3px 9px 9px 3px;overflow:hidden;text-align:left;pointer-events:none;
  transform-origin:left center;transform:translateY(-50%) rotateY(-48deg) scaleX(.04);opacity:0;
  background:linear-gradient(126deg,
    color-mix(in srgb,var(--wc) 52%,transparent) 0%,
    color-mix(in srgb,var(--wc) 20%,transparent) 46%,
    rgba(255,255,255,.16) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.34),inset 2px 0 0 rgba(255,255,255,.5),
             0 28px 46px -26px rgba(0,0,0,.95),0 0 40px -14px color-mix(in srgb,var(--wc) 70%,transparent);
  -webkit-backdrop-filter:blur(8px) saturate(1.3);backdrop-filter:blur(8px) saturate(1.3);
  transition:transform .26s cubic-bezier(.4,0,1,1),opacity .2s ease}
.pane-body::after{content:"";position:absolute;left:0;top:0;bottom:0;width:34%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,.22),transparent 78%)}
/* Lesegrund im Glas: unten eingetrübt, damit der Titel trägt */
.pane-body::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,color-mix(in srgb,var(--void) 82%,transparent) 4%,
             color-mix(in srgb,var(--void) 40%,transparent) 46%,transparent 78%)}
.pane.is-active .pane-body{opacity:1;transform:translateY(-50%) rotateY(-31deg) scaleX(1)}
.body-kick{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:color-mix(in srgb,var(--text) 68%,transparent);position:relative}
.body-title{font-size:clamp(14px,1.5vw,16.5px);font-weight:700;line-height:1.24;letter-spacing:-.015em;position:relative;
  color:var(--text);text-shadow:0 1px 12px color-mix(in srgb,var(--void) 70%,transparent);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
/* Ziel: die Fassung in der Mitte, in der die Scheibe steht */
.scope-aim{position:absolute;left:50%;top:10px;bottom:10px;width:calc(var(--pw) + 16px);transform:translateX(-50%);
  pointer-events:none;z-index:7}
.scope-aim i{position:absolute;left:0;right:0;height:10px;border:1px solid var(--line-hi);opacity:.85}
.scope-aim i:first-child{top:0;border-bottom:0;border-radius:5px 5px 0 0}
.scope-aim i:last-child{bottom:0;border-top:0;border-radius:0 0 5px 5px}
/* Der Guss: die Notiz läuft als geschmolzenes Glas nach unten heraus */
.melt{position:relative;height:56px;pointer-events:none;z-index:2}
.melt-stream{position:absolute;left:50%;top:-14px;width:clamp(30px,3.4vw,40px);height:76px;margin-left:calc(clamp(30px,3.4vw,40px) / -2);
  transform-origin:top center;
  clip-path:polygon(34% 0,66% 0,72% 22%,88% 58%,80% 82%,50% 100%,20% 82%,12% 58%,28% 22%);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--acc) 90%,transparent) 0%,
    color-mix(in srgb,var(--acc) 58%,transparent) 48%,
    color-mix(in srgb,var(--acc) 12%,transparent) 100%);
  filter:drop-shadow(0 8px 16px color-mix(in srgb,var(--acc) 45%,transparent))}
.melt-drop{position:absolute;left:50%;top:32px;width:15px;height:17px;margin-left:-7.5px;opacity:0;
  border-radius:50% 50% 54% 54%/62% 62% 38% 38%;background:color-mix(in srgb,var(--acc) 86%,transparent);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35);
  filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--acc) 50%,transparent))}
.melt-drop.d2{width:11px;height:13px;margin-left:-14px}
.melt-drop.d3{width:9px;height:11px;margin-left:5px}
/* die Tropfen sammeln sich – daraus wird die Detailkarte */
.melt-pool{position:absolute;left:50%;bottom:-6px;width:100%;height:16px;margin-left:-50%;opacity:0;
  border-radius:50%/100% 100% 60% 60%;transform:scaleX(.06) scaleY(1.6);
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,transparent),
             color-mix(in srgb,var(--acc) 26%,transparent));
  filter:blur(.4px) drop-shadow(0 6px 18px color-mix(in srgb,var(--acc) 45%,transparent))}
.melt.pour .melt-drop.d1{animation:drip .34s .86s cubic-bezier(.4,.05,.8,1) both}
.melt.pour .melt-drop.d2{animation:drip .34s .97s cubic-bezier(.4,.05,.8,1) both}
.melt.pour .melt-drop.d3{animation:drip .32s 1.08s cubic-bezier(.4,.05,.8,1) both}
.melt.pour .melt-pool{animation:pool .9s 1.06s cubic-bezier(.3,.8,.25,1) both}
@keyframes pool{
  0%{opacity:0;transform:scaleX(.05) scaleY(1.7)}
  10%{opacity:1;transform:scaleX(.22) scaleY(1.5)}
  33%{opacity:1;transform:scaleX(1.02) scaleY(.85)}
  47%{opacity:.9;transform:scaleX(1) scaleY(.7)}
  100%{opacity:0;transform:scaleX(1) scaleY(.3)}}
@keyframes drip{0%{opacity:0;transform:translateY(-8px) scale(.45)}22%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(30px) scaleX(1.5) scaleY(.6)}}
/* Herausgezoomte Notiz */
.scope-detail{position:relative;margin:0;transform-origin:top center;border-radius:16px;border:1px solid var(--line);background:var(--glass);
  box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  overflow:hidden;display:flex;gap:18px;align-items:center;padding:16px 18px 16px 24px;text-align:left;
  transform-origin:top center}
.scope-detail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--amber))}
.scope-detail::after{content:"";position:absolute;left:50%;top:0;width:clamp(120px,22vw,260px);height:2px;
  transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--acc) 85%,transparent),transparent);
  box-shadow:0 0 22px 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.sd-main{flex:1;min-width:0}
.sd-kick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.sd-cat{border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);border-radius:100px;
  padding:2px 9px;font-size:10.5px;letter-spacing:.12em;background:none;cursor:pointer;font-family:inherit}
.sd-cat:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.scope-detail h2{margin:8px 0 0;font-size:clamp(19px,2.4vw,24px);letter-spacing:-.02em;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-text{margin:7px 0 0;color:var(--text-2);font-size:14px;line-height:1.55;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sd-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.sd-tags .tag{font-size:10px;padding:1px 7px}
.sd-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sd-hint{font-family:var(--mono);font-size:11px;color:var(--text-3);white-space:nowrap}
.sd-empty{color:var(--text-3);font-style:italic;padding:6px 0}

/* ── Steuerleiste ──────────────────────────────────────────── */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 0 18px;
  border-bottom:1px solid var(--line);margin-bottom:26px}
.search{flex:1;min-width:190px;height:38px;padding:0 14px;border-radius:100px;border:1px solid var(--glass-edge);
  background:var(--glass);color:var(--text);font-size:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.search::placeholder{color:var(--text-3)}
.seg{display:flex;gap:4px;padding:3px;border-radius:100px;border:1px solid var(--glass-edge);background:var(--glass)}
.seg button{height:30px;padding:0 12px;border:none;background:transparent;border-radius:100px;font-size:13px;cursor:pointer;
  color:var(--text-2);transition:background var(--t-s),color var(--t-s)}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--amber);color:var(--on-accent);font-weight:600}

/* ── Whiteboard 1: Haufen aus Glaskörpern je Kategorie ─────── */
.deck{padding-bottom:90px}
.board{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;
  padding:22px;border-radius:18px;border:1px solid var(--line);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 25px,color-mix(in srgb,var(--text-3) 14%,transparent) 25px 26px),
    repeating-linear-gradient(90deg,transparent 0 25px,color-mix(in srgb,var(--text-3) 14%,transparent) 25px 26px);
  background-color:color-mix(in srgb,var(--void) 58%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pile{display:flex;flex-direction:column;gap:10px;min-width:0}
.pile.open{grid-column:1/-1}
.pile-head{display:flex;align-items:center;gap:10px;width:100%;padding:0;border:0;background:none;cursor:pointer;
  font:inherit;color:inherit;text-align:left}
.pile-dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.pile-name{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pile-n{font-family:var(--mono);font-size:11.5px;color:var(--text-3);letter-spacing:.12em}
.pile-hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap}
.pile-head:hover .pile-hint{color:var(--acc)}
.cat-filter{border:1px solid var(--line);background:none;padding:2px 8px;border-radius:100px;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);
  transition:color var(--t-s),border-color var(--t-s)}
.cat-filter:hover{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.pile-stack{position:relative;height:196px;cursor:pointer}
.pile.open .pile-stack{height:auto;display:flex;flex-wrap:wrap;gap:16px;cursor:default;padding:4px 0}

/* Notizkörper: Glas statt Papier */
.sticky{position:absolute;left:50%;top:10px;width:162px;height:158px;margin-left:-81px;padding:13px 14px 12px;
  display:flex;flex-direction:column;gap:6px;border:0;text-align:left;font:inherit;cursor:pointer;
  transform:translate(var(--dx,0px),var(--dy,0px)) rotate(var(--rot,0deg));
  transition:transform var(--t-m) cubic-bezier(.2,.8,.2,1),box-shadow var(--t-m),opacity var(--t-m)}
.sticky.glass{color:var(--text);border-radius:4px 11px 11px 4px;overflow:hidden;
  background:linear-gradient(132deg,
    color-mix(in srgb,var(--acc) 48%,transparent) 0%,
    color-mix(in srgb,var(--acc) 16%,transparent) 52%,
    rgba(255,255,255,.16) 100%);
  -webkit-backdrop-filter:blur(8px) saturate(1.3);backdrop-filter:blur(8px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 2px 0 0 rgba(255,255,255,.45),
             0 22px 36px -24px rgba(0,0,0,.95),0 0 30px -14px color-mix(in srgb,var(--acc) 62%,transparent)}
.sticky.glass::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,color-mix(in srgb,var(--void) 74%,transparent) 2%,
             color-mix(in srgb,var(--void) 30%,transparent) 48%,transparent 82%)}
.sticky.glass::after{content:"";position:absolute;left:0;top:0;bottom:0;width:32%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,.2),transparent 76%)}
.pile:not(.open) .sticky:nth-child(n+6){opacity:0;pointer-events:none}
.pile:not(.open) .pile-stack:hover .sticky{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 5px)) rotate(var(--rot,0deg))}
.pile.open .sticky{position:relative;left:auto;top:auto;margin:0;opacity:1;pointer-events:auto;
  transform:rotate(var(--rot,0deg))}
.pile.open .sticky:hover,.sticky:focus-visible{outline:none;
  transform:rotate(0deg) translateY(-4px) scale(1.03);box-shadow:0 18px 32px -16px rgba(0,0,0,.9)}
.sticky:focus-visible{box-shadow:0 0 0 2px var(--amber),0 18px 32px -16px rgba(0,0,0,.9)}
.s-date{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;position:relative;
  color:color-mix(in srgb,var(--text) 58%,transparent)}
.s-title{font-size:13.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em;overflow:hidden;position:relative;
  overflow-wrap:break-word;hyphens:auto;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.s-text{font-size:11.5px;line-height:1.45;overflow:hidden;position:relative;
  color:color-mix(in srgb,var(--text) 74%,transparent);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;margin-top:auto}

/* ── Whiteboard 2: Themenleiste oben, große Tafel darunter ─── */
.arena{position:relative;display:flex;flex-direction:column;gap:16px;touch-action:pan-y}
/* Die Leiste: nur die Themen, je nach Sortierung Kategorie, Buchstabe oder Zeitraum */
.wb-strip{--fl:0px;--fr:0px;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:6px 2px 10px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
  scroll-snap-type:x proximity;scrollbar-width:none;touch-action:pan-x;cursor:grab}
.wb-strip::-webkit-scrollbar{display:none}
.wb-strip.dragging{cursor:grabbing;scroll-snap-type:none}
.wb-mini{flex:0 0 auto;scroll-snap-align:center;min-width:132px;max-width:190px;padding:10px 13px 9px;
  display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer;border:0;border-radius:10px;
  background:linear-gradient(180deg,#D6DBE2,#B4BCC7);color:#20262F;font:inherit;opacity:.55;
  box-shadow:0 10px 20px -16px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.5);
  transition:opacity var(--t-m),transform var(--t-m),box-shadow var(--t-m)}
.wb-mini:hover{opacity:.85}
.wb-mini i{display:block;height:3px;border-radius:2px;background:var(--acc)}
.m-label{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-n{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#4E5663}
.wb-mini.on{opacity:1;transform:translateY(-4px);
  box-shadow:0 18px 28px -18px rgba(0,0,0,.95),0 0 0 2px var(--amber),inset 0 1px 0 rgba(255,255,255,.6)}
/* Die große Tafel: eine sichtbar, Wechsel als Zoom */
.wb-main{position:relative;height:clamp(340px,44vh,460px)}
.wb{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:12px;padding:10px;
  background:linear-gradient(180deg,#D8DDE4,#B9C0CB);
  box-shadow:0 34px 60px -30px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.25);
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(.9)}
.wb.is-front{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.wb-face{flex:1;border-radius:6px;padding:16px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:#FBFCFD;
  box-shadow:inset 0 2px 10px rgba(16,22,31,.16);
  display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px}
.wb-face::-webkit-scrollbar{width:8px}
.wb-face::-webkit-scrollbar-thumb{background:rgba(16,22,31,.2);border-radius:8px}
.wb-head{display:flex;align-items:baseline;gap:12px;padding:4px 8px 9px}
.wb-title{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.02em;color:#20262F;
  text-shadow:0 1px 0 rgba(255,255,255,.5)}
.wb-cat{margin-left:auto;border:1px solid rgba(16,22,31,.22);background:none;padding:3px 10px;border-radius:100px;
  cursor:pointer;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#4A5260}
.wb-cat:hover{color:#11151c;border-color:rgba(16,22,31,.45)}
.wb-n{font-family:var(--mono);font-size:11px;color:#69707B;letter-spacing:.12em}
/* Zettel auf der Tafel: Papier, bunt, schon ausgebreitet */
.sticky.paper{position:relative;left:auto;top:auto;margin:0;width:132px;height:132px;padding:11px 12px 10px;
  color:#171b22;border-radius:2px;
  background-color:color-mix(in srgb,var(--acc) 66%,#fff);
  background-image:linear-gradient(160deg,rgba(255,255,255,.4),rgba(0,0,0,.08));
  box-shadow:0 8px 14px -8px rgba(16,22,31,.6),0 1px 0 rgba(255,255,255,.5) inset;
  transform:rotate(var(--rot,0deg))}
.sticky.paper::after{content:"";position:absolute;right:0;bottom:0;width:15px;height:15px;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.14) 50%)}
.sticky.paper:hover{transform:rotate(0deg) translateY(-4px) scale(1.05);box-shadow:0 14px 22px -10px rgba(16,22,31,.7);z-index:3}
.sticky.paper .s-date{font-size:8.5px;color:rgba(23,27,34,.6)}
.sticky.paper .s-title{font-size:12.5px;-webkit-line-clamp:4}
.sticky.paper .s-text{display:none}
.strip-row{position:relative;min-width:0}
/* Laufschiene: zeigt, wie weit die Leiste reicht und wo man steht */
.strip-rail{position:relative;height:2px;margin:-6px 2px 0;border-radius:2px;overflow:hidden;
  background:color-mix(in srgb,var(--text-3) 20%,transparent);opacity:1;transition:opacity var(--t-m)}
.strip-rail.hidden{opacity:0}
.strip-thumb{position:absolute;inset:0 auto 0 0;border-radius:2px;
  background:color-mix(in srgb,var(--amber) 52%,transparent);transition:transform .16s linear,width .2s ease}
/* Pfeile nur als zarter Hinweis, und nur wo es eine Maus gibt */
.strip-edge{position:absolute;top:calc(50% - 8px);transform:translateY(-50%);z-index:4;
  width:24px;height:52px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;padding:0;cursor:pointer;font-size:17px;line-height:1;
  color:var(--text-3);opacity:0;pointer-events:none;transition:opacity var(--t-s),color var(--t-s)}
.strip-edge::before{content:"";position:absolute;inset:-2px -8px;border-radius:14px;z-index:-1;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--void) 88%,transparent),transparent)}
.strip-edge.l{left:-8px}
.strip-edge.r{right:-8px}
.strip-edge:hover{color:var(--text)}
@media (hover:hover){
  .strip-row:hover .strip-edge.on{opacity:.6;pointer-events:auto}
}
.deck-empty{text-align:center;color:var(--text-3);font-style:italic;padding:60px 20px;border:1px dashed var(--line);border-radius:17px}

/* ── Leseansicht ───────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--void) 82%,transparent);opacity:0;pointer-events:none;
  transition:opacity var(--t-m) ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.reading .scrim{opacity:1;pointer-events:auto}
.bar{position:fixed;top:0;left:0;right:0;z-index:70;padding:env(safe-area-inset-top) 10px 0;height:calc(58px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--glass-edge);background:var(--glass-2);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  transform:translateY(-102%);transition:transform var(--t-m) cubic-bezier(.2,.8,.2,1)}
body.reading .bar{transform:none}
.bar-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;justify-content:center}
.bar-title strong{font-size:16px;font-weight:700;letter-spacing:-.01em;font-variation-settings:'wdth' 108;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title .c-idx{flex:none}
.bar .grp{display:flex;gap:6px;align-items:center}
.reader{position:fixed;inset:calc(58px + env(safe-area-inset-top)) 0 0;z-index:60;overflow:auto;-webkit-overflow-scrolling:touch;
  opacity:0;visibility:hidden;transition:opacity .28s ease}
body.reading .reader{opacity:1;visibility:visible}
.sheet{max-width:760px;margin:30px auto 80px;border-radius:18px;border:1px solid var(--line);background:var(--glass);
  box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  padding:clamp(22px,4vw,46px);position:relative;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--acc),transparent 70%)}
.s-kick{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--text-3)}
.s-kick .rule{flex:1;height:1px;background:var(--line)}
.sheet h1{font-size:clamp(28px,4.6vw,44px);line-height:1.05;letter-spacing:-.035em;margin:18px 0 0;font-weight:700;
  font-variation-settings:'wdth' 110}
.s-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:18px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.s-source{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:6px;font-style:italic}
.s-tags{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.s-rule{height:1px;background:var(--line);margin:22px 0 24px}
.s-body{font-size:16.5px;line-height:1.72;color:var(--text)}
.s-body p{margin:0 0 1.05em}
.s-body h1{font-size:1.5em;margin:1.4em 0 .5em;letter-spacing:-.02em}
.s-body h2{font-size:1.25em;margin:1.3em 0 .5em;letter-spacing:-.015em;font-weight:700}
.s-body h3{font-size:1.08em;margin:1.2em 0 .4em;font-weight:700}
.s-body ul,.s-body ol{padding-left:1.25em;margin:0 0 1.05em}
.s-body li{margin:.3em 0}
.s-body blockquote{margin:1.1em 0;padding:.2em 0 .2em 1.1em;border-left:2px solid var(--acc);color:var(--text-2);font-style:italic}
.s-body a{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.s-body a:hover{border-color:var(--acc)}
.s-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:34px;padding-top:18px;
  border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.s-empty{text-align:center;color:var(--text-3);font-style:italic;padding:40px 0}

/* ── Menüs ─────────────────────────────────────────────────── */
.menu{position:fixed;z-index:130;min-width:210px;max-width:320px;border-radius:14px;overflow:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--glass-edge);background:var(--glass-2);box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3)}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:.62rem .9rem;font-size:14px;
  cursor:pointer;border-bottom:1px solid var(--line-2)}
.menu button:last-child{border-bottom:none}
.menu button:hover{background:color-mix(in srgb,var(--amber) 16%,transparent)}
.m-note{padding:.7rem .9rem;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--text-3);
  border-bottom:1px solid var(--line)}
.m-side{display:flex !important;align-items:center;gap:.5rem}
.m-side::before{content:'○';opacity:.5}
.m-side.selected::before{content:'●';opacity:1;color:var(--amber)}
.tagmenu{padding:6px;display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto}
.tag-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.35rem .35rem .5rem .6rem;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--line);margin-bottom:3px}
.tag-close{background:none;border:none;color:var(--text-3);font-size:.9rem;line-height:1;padding:.25rem .4rem;border-radius:6px;cursor:pointer}
.tag-close:hover{background:var(--glass);color:var(--text)}
.tag-chip{background:none;border:none;color:var(--text);padding:.45rem .6rem;font-size:14px;text-align:left;
  border-radius:8px;display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;border-bottom:none !important}
.tag-chip:hover{background:var(--glass)}
.tag-chip.selected{background:color-mix(in srgb,var(--amber) 20%,transparent);font-weight:600}
.tag-chip .check{opacity:0}
.tag-chip.selected .check{opacity:1;color:var(--amber)}
.merk-gr{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:10px .6rem 4px}
.merk-n{font:500 11px/1 var(--mono);color:var(--text-3);margin-left:4px}
.tag-empty{font-size:13px;color:var(--text-3);font-style:italic;padding:.5rem .6rem}
.tag-clear{text-align:left;padding:.5rem .6rem;background:none;border:none;border-top:1px solid var(--line) !important;
  font-size:13px;color:var(--text-3);margin-top:3px;cursor:pointer;border-radius:0}

/* ── Editor ────────────────────────────────────────────────── */
.editor{position:fixed;inset:0;z-index:120;background:var(--void);overflow:auto;
  opacity:0;visibility:hidden;transition:opacity .28s ease}
.editor.active{opacity:1;visibility:visible}
.editor-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg-grad)}
.ed-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  border-bottom:1px solid var(--glass-edge);background:var(--glass-2);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3)}
.ed-bar .eyebrow{margin-left:6px}
.ed-bar .grp{margin-left:auto;display:flex;gap:8px}
.ed-sheet{position:relative;z-index:1;max-width:760px;margin:28px auto 80px;padding:clamp(22px,4vw,40px);
  border-radius:18px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3)}
.ed-title{width:100%;border:none;background:none;font-family:var(--display);font-size:clamp(26px,4vw,38px);
  font-weight:700;letter-spacing:-.035em;font-variation-settings:'wdth' 110;color:var(--text);
  padding:0 0 14px;border-bottom:1px solid var(--line);outline:none}
.ed-title::placeholder{color:var(--text-3);opacity:.7}
.ed-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0 0}
.field{height:36px;padding:0 12px;border-radius:100px;border:1px solid var(--glass-edge);background:var(--glass);
  color:var(--text);font-size:14px}
.field::placeholder{color:var(--text-3)}
select.field{padding-right:8px}
.ed-tags{flex:1;min-width:170px}
.ed-source{font-family:var(--mono);font-size:11.5px;color:var(--text-3);font-style:italic}
.ed-hint{font-family:var(--mono);font-size:11.5px;color:var(--danger);min-height:1.2em;margin:10px 0 0}
.ed-toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:7px;border-radius:12px;border:1px solid var(--line);
  background:var(--glass);margin:16px 0 18px}
.ed-toolbar button{height:30px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;
  font-size:13px;cursor:pointer;color:var(--text-2)}
.ed-toolbar button:hover{background:var(--amber);color:var(--on-accent)}
.tb-sep{width:1px;background:var(--line);margin:4px 3px}
.ed-body{min-height:40vh;outline:none;font-size:16.5px;line-height:1.72}
.ed-body:empty::before{content:'Schreib deine Notiz …';color:var(--text-3);opacity:.7}
.ed-body h1{font-size:1.5em;margin:1.2em 0 .4em;letter-spacing:-.02em}
.ed-body h2{font-size:1.25em;margin:1.1em 0 .4em}
.ed-body blockquote{border-left:2px solid var(--amber);margin:1em 0;padding:.2em 0 .2em 1.1em;color:var(--text-2);font-style:italic}
.ed-body ul,.ed-body ol{padding-left:1.25em;margin:.6em 0}
.ed-body p{margin:0 0 1em}

/* ── Dialog & Toast ────────────────────────────────────────── */
.confirm{position:fixed;inset:0;z-index:200;background:color-mix(in srgb,var(--void) 72%,transparent);
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.confirm-box{max-width:380px;width:100%;padding:24px;border-radius:18px;border:1px solid var(--glass-edge);
  background:var(--glass-2);box-shadow:var(--shadow-lg)}
.confirm-box p{margin:0 0 20px;font-size:15px;line-height:1.55}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end}
/* Verknüpfungs-Vorschlag: welche Kategorien wie Auftraggeber aussehen.
   Breiter als die Rückfrage, weil hier eine Liste zum Abhaken steht. */
.confirm-box.weit{max-width:520px}
/* Hilfe */
.hilfe{max-width:600px;max-height:86vh;display:flex;flex-direction:column;padding:20px 22px 22px}
.hilfe-kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.hilfe-kopf h2{margin:0;font-size:20px;letter-spacing:-.02em}
.hilfe-in{overflow:auto;font-size:14.5px;line-height:1.55;color:var(--text-2)}
.hilfe-in h3{margin:18px 0 6px;font:600 10.5px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.hilfe-in p{margin:0 0 8px}
.hilfe-in b{color:var(--text)}
.hilfe-in .h-jetzt{padding:12px 14px;border-radius:12px;border:1px solid var(--line-hi);background:var(--amber-soft);color:var(--text)}
.hilfe-in dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.hilfe-in dt{font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap}
.hilfe-in dd{margin:0}
.hilfe-in kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
/* Teilen */
.teil-ebene{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.teil-liste{margin:0 0 18px;border:1px solid var(--line);border-radius:13px;max-height:46vh;overflow-y:auto}
.teil-liste b{display:block;font-size:14.5px;font-weight:600;line-height:1.35;padding-top:5px}
.teil-liste .t-zeile{display:flex;align-items:flex-start;gap:11px;padding:10px 14px;border-top:1px solid var(--line)}
.teil-liste .t-zeile:first-child{border-top:0}
.teil-liste .t-nr{font:500 11px/1.6 var(--mono);color:var(--text-3);flex:none;width:22px}
.teil-liste input[type=text]{width:100%;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--glass-edge);
  background:var(--glass);color:var(--text);font:600 14px var(--display)}
.teil-liste .t-info{display:block;font:11.5px/1.4 var(--mono);color:var(--text-3);margin-top:4px}
.verkn{margin:0 0 18px;border:1px solid var(--line,rgba(255,255,255,.10));border-radius:13px;overflow:hidden;
  max-height:46vh;overflow-y:auto;text-align:left}
.verkn label{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;cursor:pointer;
  border-top:1px solid var(--line,rgba(255,255,255,.10))}
.verkn label:first-child{border-top:0}
.verkn input{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--accent,#F2B33D);cursor:pointer}
.verkn b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.verkn span{display:block;font-size:11.5px;opacity:.62;margin-top:2px;
  font-family:var(--mono,ui-monospace,Menlo,monospace)}
.pill.danger{background:var(--danger);color:#fff;border-color:transparent;font-weight:600}
.pill.danger:hover{background:var(--danger);filter:brightness(1.08)}
/* ── Würfel: Kanban in drei Richtungen ────────────────────── */
.wf{display:flex;flex-direction:column;gap:18px}
.cube-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px 34px;padding:16px 20px;border-radius:18px;
  border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow)}
.cube{--s:min(340px, 62vw);--gap:calc(var(--s) * var(--gf, .3));position:relative;flex:1 1 440px;
  max-width:calc(var(--s) * 2.2);height:calc(var(--s) * 2);margin:10px 0;perspective:calc(var(--s) * 4);
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.cube.dreht,.cube.dreht *{cursor:grabbing !important}
.cube-in{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  transform-style:preserve-3d;
  transform:rotateX(var(--rx, 58deg)) rotateZ(var(--rz, -38deg)) translateZ(calc(var(--gap) * var(--top) / -2))}
@property --top{syntax:'<number>';inherits:true;initial-value:0}
@property --rx{syntax:'<angle>';inherits:true;initial-value:58deg}
@property --rz{syntax:'<angle>';inherits:true;initial-value:-38deg}
.cube-in.tauscht{transition:--top .8s cubic-bezier(.65,0,.35,1)}
.cube-in.faehrt{transition:--rx .7s cubic-bezier(.65,0,.35,1),--rz .7s cubic-bezier(.65,0,.35,1)}
/* Achsen im Würfel: Ursprung oben links auf der untersten Ebene */
.cube-ach{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d;
  transform:translateZ(calc(var(--gap) * var(--top) + 12px))}
.cube-lin{position:absolute;left:0;top:0;border-radius:2px}
.cube-lin.x{height:3px;width:calc(100% + 26px);background:var(--amber);transform:translate(0,-12px)}
.cube-lin.y{width:3px;height:calc(100% + 26px);background:var(--teal);transform:translate(-12px,0)}
.cube-lin.z{height:3px;width:calc(var(--gap) * var(--top) + 14px);background:#9A7BF0;
  transform-origin:0 50%;transform:translate(-12px,-12px) rotateY(90deg)}
.cube-lin::after{position:absolute;font:700 13px/1 var(--mono);white-space:nowrap}
.cube-lin.x::after{content:'→';right:-14px;top:-6px;color:var(--amber)}
.cube-lin.y::after{content:'↓';left:-5px;bottom:-14px;color:var(--teal)}
.cube-tit{position:absolute;font:700 12px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.cube-tit.x{left:0;width:100%;bottom:calc(100% + 40px);text-align:center;color:var(--amber)}
.cube-tit.y{right:calc(100% + var(--s) * .3 + 26px);top:50%;color:var(--teal);transform:translate(50%,-50%) rotate(-90deg)}
.cube-tit.z{right:calc(100% + 22px);bottom:calc(100% + 38px);color:#9A7BF0}
.cube-cl,.cube-rl{position:absolute;font:600 11.5px/1.15 var(--mono);color:var(--text);text-align:center;
  overflow:hidden;text-overflow:ellipsis}
.cube-cl{bottom:calc(100% + 16px);width:calc((100% - 12px) / var(--cols));white-space:nowrap;
  left:calc(6px + (100% - 12px) * var(--i) / var(--cols))}
.cube-rl{right:calc(100% + 16px);width:calc(var(--s) * .3);text-align:right;transform:translateY(-50%);white-space:nowrap;
  top:calc(6px + (100% - 12px) * (var(--i) + .5) / var(--rows))}
.cube-ll{position:absolute;left:0;top:0;white-space:nowrap;cursor:pointer;
  transform:translateZ(calc(var(--k) * var(--gap) + 1px)) translate(calc(-100% - 22px), calc(-100% - 6px));
  transition:transform var(--t-m) cubic-bezier(.2,.8,.2,1),opacity var(--t-s);
  font:600 12.5px/1 var(--mono);color:var(--text);padding:5px 9px;border-radius:100px;
  border:1.5px solid #9A7BF0;background:var(--glass-2)}
.cube-ll.on{color:var(--on-accent);background:var(--amber);border-color:transparent;
  transform:translateZ(calc(var(--k) * var(--gap) + 11px)) translate(calc(-100% - 22px), calc(-100% - 6px))}
.cube-ll.aus{opacity:.45}
.cube-ll:hover{border-color:var(--amber)}
.cube-ll b{font-weight:500;opacity:.7;margin-left:4px}
.cube-reset{width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-edge);background:none;cursor:pointer;font-size:14px;line-height:1;color:var(--text-2)}
.cube-reset:hover{border-color:var(--line-hi);color:var(--amber)}
.cube-l{position:absolute;inset:0;padding:6px;border-radius:9px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--teal) 42%,transparent);
  background:color-mix(in srgb,var(--glass-2) 70%,transparent);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 10px 24px -14px rgba(0,0,0,.8);
  transform:translateZ(calc(var(--k) * var(--gap)));transition:transform var(--t-m) cubic-bezier(.2,.8,.2,1),opacity var(--t-s),border-color var(--t-s)}
.cube-l:hover{transform:translateZ(calc(var(--k) * var(--gap) + 8px));border-color:var(--amber)}
.cube-l.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--glass-2));
  transform:translateZ(calc(var(--k) * var(--gap) + 10px))}
.cube-l.aus{opacity:.35}
.cube-in.tauscht .cube-l,.cube-in.tauscht .cube-ll{transition-duration:.8s,var(--t-s),var(--t-s);
  transition-timing-function:cubic-bezier(.65,0,.35,1)}
.cube-g{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:4px;width:100%;height:100%}
.cube-g i{display:grid;place-items:center;border-radius:5px;font:700 calc(var(--s) * .26 / var(--m)) /1 var(--mono);font-style:normal;color:var(--on-accent);
  background:color-mix(in srgb,var(--teal) calc(var(--c) * 100%),color-mix(in srgb,var(--text-3) 14%,transparent))}
.cube-l.on .cube-g i{background:color-mix(in srgb,var(--amber) calc(var(--c) * 100%),color-mix(in srgb,var(--text-3) 14%,transparent))}
.cube-leg{flex:1;min-width:250px;display:flex;flex-direction:column;gap:9px;font-size:13.5px;color:var(--text-2)}
.cube-ax{display:flex;align-items:center;gap:8px}
.cube-ax b{color:var(--text);font-weight:600}
.ax{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-size:12px;border:1px solid var(--line);color:var(--text)}
.ax.x{border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.ax.y{border-color:color-mix(in srgb,var(--teal) 55%,transparent)}
.ax.z{border-color:color-mix(in srgb,#B79BFF 60%,transparent)}
.wf-sel{height:30px;padding:0 8px;border-radius:100px;border:1px solid var(--glass-edge);background:var(--glass-2);color:var(--text);font-size:13px}
.wf-dreh{width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-edge);background:none;cursor:pointer;font-size:15px;line-height:1}
.wf-dreh:hover{border-color:var(--line-hi);color:var(--amber)}
.cube-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cube-tag{border:1px solid var(--line);background:none;border-radius:100px;padding:4px 11px;cursor:pointer;font-size:12.5px;color:var(--text-2)}
.cube-tag b{font-family:var(--mono);font-weight:500;color:var(--text-3);margin-left:3px}
.cube-tag:hover{border-color:var(--line-hi);color:var(--text)}
.cube-tag.on{background:var(--amber);border-color:transparent;color:var(--on-accent);font-weight:600}
.cube-tag.on b{color:inherit}
/* ── Würfel klarer: deckende Ebenen, leere Zellen bleiben leer, die
   gewählte Ebene schwebt deutlich über den anderen ── */
.cube{--lift:calc(var(--s) * .16)}
.cube-l{background:var(--surface);border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 16px -10px rgba(0,0,0,.45)}
.cube-l:hover{transform:translateZ(calc(var(--k) * var(--gap) + 4px));border-color:var(--amber)}
.cube-l.on{background:var(--surface);border:1.5px solid var(--amber);
  box-shadow:0 18px 34px -16px rgba(0,0,0,.55);transform:translateZ(calc(var(--k) * var(--gap) + var(--lift)))}
.cube-ll.on{transform:translateZ(calc(var(--k) * var(--gap) + var(--lift) + 1px)) translate(calc(-100% - 22px), calc(-100% - 6px))}
.cube-l.aus{opacity:.55;filter:saturate(0)}
.cube-l.aus .cube-g i{color:transparent}
.cube-ll.aus{opacity:.4}
.cube-in.gewaehlt .cube-ach{transform:translateZ(calc(var(--gap) * var(--top) + var(--lift) + 4px))}
.cube{--lift:6px}
/* Würfel ↔ Liste: was zusammengehört, leuchtet auf */
.cube-g i.glimmt{outline:3px solid var(--amber);outline-offset:2px;z-index:2}
.cube-g i.glimmt.leer{border-color:var(--amber)}
.wf.verbunden .wf-grid .kc{opacity:.35;transition:opacity var(--t-s),box-shadow var(--t-s)}
.wf.verbunden .wf-grid .kc.glimmt{opacity:1;box-shadow:0 0 0 2px var(--amber),var(--shadow)}
/* Feste Blickwinkel */
.cube-in.flach .cube-ll{opacity:0;pointer-events:none}
.cube-in.flach .cube-ll.on{opacity:1;pointer-events:auto}
.cube-blicke{display:inline-flex;gap:2px;padding:2px;border-radius:100px;border:1px solid var(--glass-edge)}
.cube-blick{border:none;background:none;border-radius:100px;padding:4px 10px;cursor:pointer;font-size:12.5px;color:var(--text-2)}
.cube-blick:hover{color:var(--text)}
.cube-blick.on{background:var(--amber);color:var(--on-accent);font-weight:600}
.cube-g{gap:5px}
.cube-g i{border-radius:6px;color:#fff;
  background:color-mix(in srgb,var(--teal) calc(35% + var(--c) * 65%),var(--surface))}
.cube-g i.lo{color:var(--text)}
.cube-g i.leer{background:none;border:1px dashed color-mix(in srgb,var(--text-3) 35%,transparent)}
.cube-l.on .cube-g i{background:color-mix(in srgb,var(--amber) calc(35% + var(--c) * 65%),var(--surface))}
.cube-l.on .cube-g i.leer{background:none;border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.cube-lin{opacity:.85}
.cube-cl,.cube-rl{font-size:12px}

/* ── Desktop: Würfel links (bleibt stehen), Liste rechts ── */
@media (min-width:1100px){
  .deck[data-mode="wuerfel"] .wf{--bw:min(1680px, calc(100vw - 2 * var(--pad) - 20px));width:var(--bw);
    margin-left:calc((100% - var(--bw)) / 2);display:grid;grid-template-columns:minmax(440px, 37%) minmax(0, 1fr);
    gap:22px;align-items:start}
  .deck[data-mode="wuerfel"] .cube-wrap{position:sticky;top:84px;flex-direction:column;flex-wrap:nowrap;
    align-items:stretch;gap:10px;padding:14px 16px;container-type:inline-size}
  .deck[data-mode="wuerfel"] .cube{flex:none;width:100%;max-width:none;margin:0;
    --s:min(330px, 46cqi);height:calc(var(--s) * 1.75)}
  .deck[data-mode="wuerfel"] .cube-in{left:58%}
  .deck[data-mode="wuerfel"] .cube-leg{min-width:0}
  .deck[data-mode="wuerfel"] .wf-scroll{grid-column:2;grid-row:1}
  .deck[data-mode="wuerfel"] .wf-hint{grid-column:2}
  .deck[data-mode="wuerfel"] .wf-grid{grid-template-columns:96px repeat(var(--cols),minmax(176px,1fr))}
}
.wf-scroll{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.wf-grid{display:grid;grid-template-columns:118px repeat(var(--cols),minmax(208px,1fr));gap:8px;min-width:min-content}
.wf-c{border-radius:12px;min-width:0}
.wf-corner{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-3);align-self:end;padding:0 4px 8px;line-height:1.4}
.wf-h,.wf-rh{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);
  display:flex;align-items:center;gap:8px}
.wf-h{padding:8px 12px;border-bottom:2px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:0}
.wf-rh{padding:12px 10px;align-items:flex-start;flex-direction:column;gap:4px;border-right:2px solid color-mix(in srgb,var(--teal) 45%,transparent);border-radius:0}
.wf-h span,.wf-rh span{color:var(--text-3);letter-spacing:.06em}
.wf-h[data-v="erledigt"]{color:var(--teal)}
.wf-rh[data-v="hoch"],.wf-h[data-v="hoch"]{color:var(--danger)}
.wf-cell{position:relative;display:flex;flex-direction:column;gap:7px;padding:8px;min-height:92px;
  border:1px dashed var(--line);background:color-mix(in srgb,var(--glass) 60%,transparent);
  transition:border-color var(--t-s),background var(--t-s)}
.wf-cell.ziel{border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--glass))}
.kc{position:relative;padding:9px 10px 10px 12px;border-radius:10px;cursor:grab;text-align:left;
  background:var(--glass-2);border:1px solid var(--glass-edge);box-shadow:var(--shadow);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:transform var(--t-s),box-shadow var(--t-s),opacity var(--t-s),border-color var(--t-s)}
.kc::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc)}
.kc:hover{border-color:color-mix(in srgb,var(--acc) 55%,transparent);transform:translateY(-1px)}
.kc:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.kc.dragging{opacity:.3}
.kc.done .kc-t{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text) 40%,transparent);color:var(--text-2)}
/* Ablegen von E-Mails */
.ablage{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:0;transition:opacity var(--t-s);
  box-shadow:inset 0 0 0 3px var(--amber);border-radius:14px}
.ablage.on{opacity:1}
.ablage-k{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:10px 18px;border-radius:100px;background:var(--amber);color:var(--on-accent);font-weight:650;font-size:14px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.45);white-space:nowrap}
.ablage-k small{font:500 12px/1 var(--mono);opacity:.85}
.ablage-k small:not(:empty)::before{content:'→ '}
.wf-cell.ablage-ziel{border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--glass))}
.cube-g i.ablage-ziel{background:var(--amber) !important;outline:2px solid var(--amber);outline-offset:1px}
.cube-l.ablage-ziel{border-color:var(--amber)}
/* Gestaffelter Stapel erledigter Karten */
.kc-stapel{display:flex;flex-direction:column;gap:6px}
.kc-stapel-kopf{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:3px 8px;
  border:none;border-top:1px dashed var(--line);background:none;cursor:pointer;
  font:600 10.5px/1.4 var(--mono);letter-spacing:.06em;color:var(--teal)}
.kc-stapel-kopf i{font-style:normal;color:var(--text-3)}
.kc-stapel-kopf:hover i{color:var(--amber)}
.kc-stapel:not(.auf) .kc-stapel-k{display:grid;padding-bottom:calc((var(--n) - 1) * 9px);cursor:pointer}
.kc-stapel:not(.auf) .kc-stapel-k > .kc{grid-area:1/1;z-index:calc(10 - var(--i));transform-origin:50% 100%;
  background:var(--surface);transform:translateY(calc(var(--i) * 9px)) scale(calc(1 - var(--i) * .05))}
.kc-stapel:not(.auf) .kc-stapel-k > .kc:not(:first-child){box-shadow:0 2px 6px -3px rgba(0,0,0,.25)}
.kc-stapel:not(.auf) .kc-stapel-k > .kc:not(:first-child) > *,
.kc-stapel:not(.auf) .kc-stapel-k > .kc:not(:first-child)::before{visibility:hidden}
.kc-stapel:not(.auf) .kc-stapel-k > .kc:nth-child(n+5){visibility:hidden}
.kc-stapel:not(.auf) .kc-stapel-k:hover > .kc:first-child{transform:translateY(-2px)}
.kc-stapel.auf .kc-stapel-k{display:flex;flex-direction:column;gap:7px}
.kc-ghost{position:fixed;z-index:300;pointer-events:none;margin:0;transform:rotate(-2.5deg) scale(1.03);
  box-shadow:var(--shadow-lg);opacity:.95;cursor:grabbing}
body.ziehen,body.ziehen *{cursor:grabbing !important}
.kc-top{display:flex;align-items:center;gap:6px;min-height:20px}
.kc-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.kc-cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.kc-acts{display:flex;gap:3px;opacity:0;transition:opacity var(--t-s)}
.kc:hover .kc-acts,.kc:focus-within .kc-acts{opacity:1}
.kc-acts button{width:22px;height:22px;display:grid;place-items:center;padding:0;border-radius:6px;border:1px solid var(--line);
  background:none;cursor:pointer;font-size:12px;line-height:1;color:var(--text-2)}
.kc-ok:hover{color:var(--teal);border-color:var(--teal)}
.kc-del:hover{color:var(--danger);border-color:var(--danger)}
.kc-t{font-size:13.5px;font-weight:650;line-height:1.3;margin-top:3px;overflow-wrap:anywhere}
.kc-m{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kc-chip{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--line);border-radius:100px;padding:1px 7px}
.kc-neu{align-self:center;margin-top:auto;width:26px;height:26px;border-radius:50%;border:1px dashed var(--line);background:none;
  color:var(--text-3);cursor:pointer;font-size:15px;line-height:1;opacity:0;transition:opacity var(--t-s),color var(--t-s),border-color var(--t-s)}
.wf-cell:hover .kc-neu,.kc-neu:focus-visible{opacity:1}
.kc-neu:hover{color:var(--amber);border-color:var(--amber)}
.wf-hint{margin:0;font-family:var(--mono);font-size:11px;color:var(--text-3)}
@media (pointer:coarse){
  .kc-acts,.kc-neu{opacity:1}
  .kc-acts button{width:28px;height:28px}
}
@media (max-width:720px){
  .cube{--s:min(300px, 64vw);flex-basis:100%;max-width:100%}
  .wf-grid{grid-template-columns:84px repeat(var(--cols),minmax(176px,1fr))}
}
/* Status-, Prioritäts- und Personenmarken – Leseansicht und Vorschau */
.s-kanban,.hv-k{display:flex;flex-wrap:wrap;gap:6px}
.s-kanban{margin:12px 0 0}
.kb-s,.kb-p,.kb-w{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:100px;border:1px solid var(--line);color:var(--text-2)}
.kb-s[data-s="arbeit"]{border-color:color-mix(in srgb,var(--amber) 60%,transparent);color:var(--amber)}
.kb-s[data-s="erledigt"]{border-color:color-mix(in srgb,var(--teal) 60%,transparent);color:var(--teal)}
.kb-p[data-p="hoch"]{border-color:color-mix(in srgb,var(--danger) 60%,transparent);color:var(--danger)}
/* Vorschau beim Überfahren */
.hv{position:fixed;z-index:220;pointer-events:none;padding:14px 16px 12px;border-radius:14px;
  border:1px solid color-mix(in srgb,var(--acc,var(--amber)) 45%,var(--glass-edge));background:var(--glass-2);
  box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  opacity:0;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease}
.hv.on{opacity:1;transform:none}
.hv-kick{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.hv-dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.hv-d{margin-left:auto;letter-spacing:.06em}
.hv-t{font-size:16px;font-weight:700;letter-spacing:-.015em;line-height:1.25;margin:6px 0 8px}
.hv-tags{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.hv-b{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.55;color:var(--text-2);
  max-height:220px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.hv-b > *{margin:0 0 .5em}
.hv-b h1,.hv-b h2,.hv-b h3,.hv-b h4{font-size:13.5px;color:var(--text);margin:0 0 .35em}
.hv-b ul,.hv-b ol{padding-left:1.2em}
.hv-b blockquote{border-left:2px solid var(--acc);padding-left:8px;margin-left:0}
.hv-b pre{font-size:11px;white-space:pre-wrap}
/* Editor: Würfelfelder */
.ed-lab{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.ed-lab .field{font-family:var(--display);letter-spacing:0;text-transform:none}
#editorPerson{width:150px}
/* Hinweis mit Rückgängig */
.toast.aktion{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:.45rem .55rem .45rem 1.2rem}
.toast button{border:0;border-radius:100px;padding:.4rem .9rem;background:var(--amber);color:var(--on-accent);font-weight:600;cursor:pointer;font-size:13px}
/* Lesen: Formatierungen, die jetzt erhalten bleiben */
.s-body u,.hv-b u{text-decoration-thickness:1px;text-underline-offset:2px}
.s-body mark{background:color-mix(in srgb,var(--amber) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.s-body code{font-family:var(--mono);font-size:.88em;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--text-3) 18%,transparent)}
.s-body pre{font-family:var(--mono);font-size:13px;line-height:1.55;padding:12px 14px;border-radius:10px;overflow:auto;
  background:color-mix(in srgb,var(--void) 60%,transparent);border:1px solid var(--line)}
.s-body pre code{padding:0;background:none}
.s-body hr{border:0;height:1px;background:var(--line);margin:1.4em 0}
.toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);z-index:210;
  background:var(--glass-2);color:var(--text);padding:.7rem 1.2rem;border-radius:100px;border:1px solid var(--glass-edge);
  font-size:13.5px;box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
  opacity:0;transition:opacity .25s ease;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}

footer{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:26px var(--pad) calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;color:var(--text-3)}
footer a{text-decoration:none}
footer a:hover{color:var(--text)}

@media (max-width:820px){

  .clock,.hide-sm{display:none !important}
  .nav-in{padding-left:14px}
  .row{grid-template-columns:3px 40px minmax(0,1fr) auto 14px;padding-right:12px}

  .scope{--pw:20px}
  .panes{height:168px}

  .sd-side{flex-direction:row;align-items:center;justify-content:space-between}

  .sheet{margin:16px auto 60px;border-radius:14px}

/* ── Druck ─────────────────────────────────────────────────── */
.print-sheet{display:none}
@media print{
  body > *:not(.print-sheet){display:none !important}
  .print-sheet{display:block !important;font-family:Georgia,'Times New Roman',serif;color:#161207;background:#fff}

/* ═══════════════════════════════════════════════════════════════
   WERKBANK — kanonischer Token-Satz, Stand 19.09.2026
   Eine Quelle für Auftritt und Werkzeuge. Die Aliase am Ende halten
   die gewachsenen Namen am Leben, bis alles die kanonischen benutzt.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Schrift */
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  /* Flächen und Schrift */
  --void:#06090E;
  --text:#EDF0F3; --text-2:#9BA6B2; --text-3:#6B7683;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
  --glass:rgba(16,22,31,.55);          /* Glas mit Blur dahinter */
  --film:rgba(255,255,255,.045);       /* heller Schleier auf Glas */
  --surface:rgba(12,17,24,.86);        /* deckende Fläche: Dialog, Tafel */
  --shadow:0 18px 46px -22px rgba(0,0,0,.75);
  /* Akzente */
  --amber:#F2B33D; --amber-soft:rgba(242,179,61,.14);
  --free:#63D9C4; --free-ink:#63D9C4;
  --over:#EE8E6A; --red-ink:#E8646E;
  --ink:#12171F;                       /* Schrift auf Bernstein */
  --em-1:#F2B33D; --em-2:#F7D68C; --em-3:#63D9C4;
  /* Bewegung */
  --t-s:.25s; --t-m:.45s; --t-lang:.8s;
  --kurve:cubic-bezier(.2,.8,.2,1);      /* die Handschrift des Hauses */
  --t-kurz:var(--t-s); --t-aussehen:.35s;
  /* Aliase auf die gewachsenen Namen */
  --teal:var(--free); --accent:var(--amber); --accent2:var(--free);
  --acc-brand:var(--amber);
  --txt:var(--text); --muted:var(--text-2); --muted-2:var(--text-3);
  --panel:var(--glass); --panel2:var(--film); --glass-2:var(--surface);
  --ok:var(--free-ink); --bad:var(--red-ink); --danger:var(--red-ink);
  --off:var(--text-3); --on-accent:var(--ink);
}
html[data-theme="light"]{
  --void:#EEF1F6;
  --text:#111923; --text-2:#4A5563; --text-3:#7A8493;
  --line:rgba(17,28,44,.10); --line-strong:rgba(17,28,44,.20);
  --glass:rgba(255,255,255,.62);
  --film:rgba(255,255,255,.55);
  --surface:rgba(250,251,253,.92);
  --shadow:0 20px 44px -24px rgba(20,36,60,.38);
  --amber:#E0A21F; --amber-soft:rgba(224,162,31,.16);
  --free:#2FA894; --free-ink:#17806D;
  --over:#D2704A; --red-ink:#C6404E;
  --em-1:#B8791A; --em-2:#8E7A26; --em-3:#14796A;
}

/* ═══════════════════════════════════════════════════════════════
   Wer Bewegung abgestellt hat, bekommt keine. Pauschal statt
   handverlesen: die alten Einzelregeln deckten je ein bis zwei
   Selektoren ab, alles andere lief weiter.
   ═══════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important}
}

/* Dekoration kostet am Telefon am meisten und bringt dort am wenigsten:
   die driftenden Farbfelder stehen still, der Weichzeichner wird kleiner. */
@media (max-width:820px),(pointer:coarse){
  .blob,.bg i{animation:none!important}
  .blob{filter:blur(48px)}
  .bg i{filter:blur(38px)}
}
</style>

<!-- ══════════════════════════════════════════════════════════════
     LIZENZBLOCK  (lizenz.js + lizenz-tor.js + Konfiguration)
     Prüfschlüssel der Lizenzstelle ist eingetragen.
     ══════════════════════════════════════════════════════════════ -->
<script>
/* ============================================================
   WBLizenz — Lizenzbaustein für das Kontor
   ------------------------------------------------------------
   Stufe A: signierter Schlüssel, offline prüfbar, kein Server.
   Signatur ECDSA P-256 / SHA-256 über die rohen Bytes des
   Nutzdaten-JSON. Öffentlicher Schlüssel steht hier im Klartext –
   das ist in Ordnung, er kann nur prüfen, nicht ausstellen.

   Schlüsselformat (eine Zeile):
     WB1.<base64url(Nutzdaten-JSON)>.<base64url(Signatur, 64 Byte)>

   Nutzdaten:
     { v:1, id:"L-2026-0007", n:"Name", e:"mail@…",
       w:["rechnungsbuch","terminbuch"],      // freigeschaltete Werkzeuge
       m:"kauf"|"miete", a:"2026-09-19",      // ausgestellt
       b:"2027-09-19"|null,                   // Wartungsfenster bzw. Laufzeitende
       s:{ "rechnungsbuch":"<base64>" } }     // optional, erst Stufe B

   Stufe B ist vorbereitet: das Feld `s` trägt je Werkzeug ein
   Geheimnis, mit dem sich ein verschlüsselt ausgelieferter
   Codeblock aufsperren lässt. Die Signatur deckt es mit ab,
   das Format bleibt unverändert.
   ============================================================ */
(function (global) {
  'use strict';

  var LS_KEY   = 'wb-lizenz';
  var PRAEFIX  = 'WB1.';

  /* Öffentlicher Schlüssel der Lizenzstelle, SPKI als Base64.
     Wird beim Ausrollen durch den echten Wert ersetzt –
     die Lizenzstelle zeigt ihn zum Kopieren an. */
  var PUB_B64 = 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAESwn5vJH6rMd87uKAXdmC4qXnI47PQn7lpnDtpPfzuv4bhSIp2QkxeL2RC7cVaXbnD0lZRdh6g3b+x3MYKm61Pg==';

  /* ---------- Kleinkram ---------- */

  function b64urlZuBytes(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function bytesZuB64url(a) {
    var s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64ZuBytes(s) {
    var bin = atob(String(s).replace(/\s+/g, '')), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function heute() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  }
  function tagDe(iso) {
    if (!iso) return '';
    var t = String(iso).split('-');
    return t.length === 3 ? t[2] + '.' + t[1] + '.' + t[0] : iso;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function lese(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function schreibe(k, v) {
    try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; }
    catch (e) { return false; }
  }

  /* ---------- Prüfung ---------- */

  var pubCache = null;
  function pruefbereit() { return !!(PUB_B64 && PUB_B64.indexOf('EINSETZEN') < 0); }
  function pubKey() {
    if (pubCache) return pubCache;
    if (!pruefbereit()) return Promise.reject(new Error('kein-pubkey'));
    pubCache = crypto.subtle.importKey(
      'spki', b64ZuBytes(PUB_B64),
      { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']
    );
    return pubCache;
  }

  /* Prüft einen Schlüsseltext und gibt die Nutzdaten zurück –
     oder wirft mit einem sprechenden Grund. */
  /* Nimmt, was eingefügt wurde, und holt den Schlüssel heraus: eine ganze
     .wblic-Datei mit Kommentarzeilen, eine E-Mail, Zeilenumbrüche mittendrin. */
  function saeubern(text) {
    var roh = String(text || '').replace(/\s+/g, '');
    /* Normalfall: der ganze Schlüssel steckt irgendwo im eingefügten Text. */
    var m = roh.match(/WB1\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+/i);
    if (m) return PRAEFIX + m[0].slice(4);
    /* Vorspann unterwegs verlorengegangen – manche Felder und Zwischenablagen
       verschlucken den Anfang. Zwei Base64url-Teile mit Punkt dazwischen sind
       eindeutig genug; die Signatur entscheidet danach ohnehin. */
    m = roh.match(/^(?:WB1\.?)?([A-Za-z0-9\-_]{20,})\.([A-Za-z0-9\-_]{20,})$/i);
    if (m) return PRAEFIX + m[1] + '.' + m[2];
    return roh;
  }

  function pruefeText(text) {
    return Promise.resolve().then(function () {
      var t = saeubern(text);
      if (!t) throw new Error('leer');
      if (t.indexOf(PRAEFIX) !== 0) {
        /* Der Prüfschlüssel der Lizenzstelle ist reines Base64 und beginnt
           mit MFkw – eine Verwechslung, die ohne Hinweis ratlos macht. */
        if (/^MFkw[A-Za-z0-9+/=]+$/.test(t)) throw new Error('pruefschluessel');
        throw new Error('format');
      }
      var teile = t.slice(PRAEFIX.length).split('.');
      if (teile.length !== 2) throw new Error('format');
      var daten = b64urlZuBytes(teile[0]);
      var sig   = b64urlZuBytes(teile[1]);
      return pubKey().then(function (k) {
        return crypto.subtle.verify(
          { name: 'ECDSA', hash: 'SHA-256' }, k, sig, daten
        );
      }).then(function (ok) {
        if (!ok) throw new Error('signatur');
        var p;
        try { p = JSON.parse(new TextDecoder().decode(daten)); }
        catch (e) { throw new Error('format'); }
        if (!p || p.v !== 1 || !Array.isArray(p.w)) throw new Error('format');
        return p;
      });
    });
  }

  /* Lage eines Werkzeugs. `build` ist das Veröffentlichungsdatum
     dieser Fassung (ISO), es steht im Werkzeug selbst.

     status: 'frei'        – voller Umfang
             'nurlesen'    – Miete abgelaufen: lesen und ausgeben ja,
                             speichern nein. Daten bleiben erreichbar.
             'schaufenster'– keine gültige Lizenz für dieses Werkzeug   */
  function stand(werkzeug, build) {
    var roh = lese(LS_KEY);
    if (!roh) return Promise.resolve({ status: 'schaufenster', grund: 'keine' });
    return pruefeText(roh).then(function (p) {
      var basis = {
        name: p.n || '', email: p.e || '', nummer: p.id || '',
        modus: p.m || 'kauf', bis: p.b || null, werkzeuge: p.w,
        geheim: (p.s && p.s[werkzeug]) || null
      };
      if (p.w.indexOf(werkzeug) < 0 && p.w.indexOf('*') < 0) {
        return Object.assign(basis, { status: 'schaufenster', grund: 'nicht-enthalten' });
      }
      if (basis.modus === 'miete' && basis.bis && heute() > basis.bis) {
        return Object.assign(basis, { status: 'nurlesen', grund: 'laufzeit' });
      }
      /* Kauf: das Datum begrenzt nur das Wartungsfenster.
         Eine neuere Fassung läuft weiter, weist aber darauf hin. */
      var hinweis = basis.modus === 'kauf' && basis.bis && build && build > basis.bis;
      return Object.assign(basis, { status: 'frei', grund: hinweis ? 'wartung' : null });
    }).catch(function (e) {
      return { status: 'schaufenster', grund: e.message || 'ungueltig' };
    });
  }

  function speichern(text) {
    return pruefeText(text).then(function (p) {
      if (!schreibe(LS_KEY, saeubern(text))) throw new Error('speicher');
      return p;
    });
  }
  function loeschen() { schreibe(LS_KEY, null); }
  function roh() { return lese(LS_KEY); }

  /* ---------- Freischalten über die Adresse ----------
     …/index.html#lizenz=WB1.…  schaltet beim Öffnen frei. Am Telefon ist das
     der einzige Weg, der ohne Abtippen und ohne Dateiauswahl auskommt: Link
     antippen, fertig. Der Schlüssel verschwindet danach aus der Adresszeile,
     damit er nicht im Verlauf oder in einem Lesezeichen stehenbleibt. */
  function ausUrl() {
    try {
      var m = (String(location.hash || '') + '&' + String(location.search || ''))
              .match(/[#?&]lizenz=([^&#]+)/i);
      return m ? decodeURIComponent(m[1]) : null;
    } catch (e) { return null; }
  }
  function urlSaeubern() {
    try {
      var such = String(location.search || '').replace(/([?&])lizenz=[^&]*&?/i, '$1').replace(/[?&]$/, '');
      var hash = String(location.hash || '').replace(/([#&])lizenz=[^&]*&?/i, '$1').replace(/[#&]$/, '');
      history.replaceState(null, '', location.pathname + such + hash);
    } catch (e) {}
  }
  /* Nimmt einen Schlüssel aus der Adresse an, falls einer dasteht.
     Gibt die Nutzdaten zurück, null wenn keiner dastand – und wirft nie. */
  function ausUrlUebernehmen() {
    var t = ausUrl();
    if (!t) return Promise.resolve(null);
    return speichern(t).then(function (p) { urlSaeubern(); return p; },
                             function ()  { urlSaeubern(); return null; });
  }

  var GRUENDE = {
    keine: 'Für dieses Werkzeug liegt keine Lizenz vor.',
    'nicht-enthalten': 'Die hinterlegte Lizenz deckt dieses Werkzeug nicht ab.',
    signatur: 'Der Schlüssel ist beschädigt oder stammt nicht von der Lizenzstelle.',
    format: 'Das sieht nicht nach einem Lizenzschlüssel aus – er beginnt mit „WB1.".',
    pruefschluessel: 'Das ist der Prüfschlüssel der Lizenzstelle. Gebraucht wird hier der '
      + 'Lizenzschlüssel aus „Lizenz ausstellen" – er beginnt mit „WB1.".',
    leer: 'Kein Schlüssel eingegeben.',
    laufzeit: 'Die Laufzeit ist abgelaufen – Speichern ist gesperrt, Lesen und Ausgabe bleiben möglich.',
    wartung: 'Diese Fassung ist neuer als dein Wartungsfenster.',
    'kein-pubkey': 'In dieser Fassung ist noch kein Prüfschlüssel hinterlegt.',
    speicher: 'Der Browser lässt kein Speichern zu (privates Fenster?).'
  };
  function grundText(g) { return GRUENDE[g] || 'Die Lizenz konnte nicht geprüft werden.'; }

  /* ---------- Oberfläche ---------- */

  /* Alles aus den Token des Werkzeugs, mit Rückfallwerten für Umgebungen,
     die sie nicht kennen (die Lizenzstelle). Damit zieht der Lizenzteil
     Palette, Schrift und Hell-/Dunkelmodus der Werkbank automatisch mit. */
  var CSS = '\

 padding:12px 16px;border-radius:14px;\
 font:500 14px/1.45 var(--display,system-ui,sans-serif);color:var(--text,var(--txt,#EDF0F3));\
 border:1px solid color-mix(in srgb,var(--amber,var(--accent,#F2B33D)) 45%,transparent);\
 background:color-mix(in srgb,var(--amber,var(--accent,#F2B33D)) 11%,transparent)}\

 font:400 11.5px/1.5 var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.14em;\
 text-transform:uppercase;color:var(--text-3,var(--muted-2,#6B7683))}\

 background:transparent;color:inherit;cursor:pointer;white-space:nowrap;\

 transition:background .25s,border-color .25s}\
