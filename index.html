<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NoteOS – Wissen der Werkbank</title>
<meta name="description" content="Notizen als Kartei: Kategorien, Tags und Volltext – lokal im Ordner gespeichert.">
<meta name="theme-color" content="#06090E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306090E'/%3E%3Crect x='7' y='6' width='18' height='4' rx='1.5' fill='%23F2B33D'/%3E%3Crect x='7' y='13' width='18' height='4' rx='1.5' fill='%2363D9C4'/%3E%3Crect x='7' y='20' width='11' height='4' rx='1.5' fill='%23EDF0F3' opacity='.35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
/* Theme vor dem ersten Bild setzen – gleicher Schlüssel wie im Cockpit,
   gleiche Herkunft, also teilen sich alle Werkzeuge die Einstellung. */
(function(){var t=null;try{t=localStorage.getItem('wb-cockpit-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  color-scheme:dark;
  --void:#06090E;
  --bg-grad:linear-gradient(175deg,#070B11 0%,#0A121B 38%,#0C1620 68%,#080C12 100%);
  --glass:rgba(16,22,31,.55);
  --glass-2:rgba(12,17,24,.82);
  --glass-edge:rgba(255,255,255,.10);
  --sheet:rgba(20,27,37,.72);
  --text:#EDF0F3;--text-2:#9BA6B2;--text-3:#6B7683;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.05);
  --line-hi:rgba(242,179,61,.38);
  --amber:#F2B33D;--teal:#63D9C4;--danger:#E2725B;
  --em-1:#F2B33D;--em-2:#F7CF83;--em-3:#63D9C4;
  --glow-a:rgba(242,179,61,.10);--glow-t:rgba(99,217,196,.08);
  --shadow:0 18px 46px -22px rgba(0,0,0,.75);
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
  --on-accent:#12171F;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --max:1180px;--pad:22px;
  --t-s:.25s;--t-m:.45s;
}
html[data-theme="light"]{
  color-scheme:light;
  --void:#EEF1F6;
  --bg-grad:linear-gradient(175deg,#F5F7FA 0%,#EAEEF4 38%,#E6EBF2 68%,#F2F4F8 100%);
  --glass:rgba(255,255,255,.60);
  --glass-2:rgba(248,250,252,.88);
  --glass-edge:rgba(17,25,35,.10);
  --sheet:rgba(255,255,255,.78);
  --text:#111923;--text-2:#4A5563;--text-3:#7A8491;
  --line:rgba(17,25,35,.10);
  --line-2:rgba(17,25,35,.06);
  --line-hi:rgba(224,162,31,.55);
  --amber:#E0A21F;--teal:#2FA894;--danger:#B4442E;
  --em-1:#C98A0C;--em-2:#E0A21F;--em-3:#2FA894;
  --glow-a:rgba(224,162,31,.13);--glow-t:rgba(47,168,148,.10);
  --shadow:0 18px 40px -24px rgba(30,40,60,.30);
  --shadow-lg:0 30px 70px -34px rgba(30,40,60,.42);
  --on-accent:#FFFFFF;
}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.locked{overflow:hidden;background:var(--void)}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--display);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .35s ease,color .35s ease}
a{color:inherit}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── Hintergrund ───────────────────────────────────────────── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg-grad)}
.bg i{position:absolute;border-radius:50%;filter:blur(60px)}
.bg .g1{width:620px;height:620px;left:-180px;top:-220px;background:radial-gradient(circle,var(--glow-a),transparent 70%)}
.bg .g2{width:720px;height:720px;right:-260px;top:38%;background:radial-gradient(circle,var(--glow-t),transparent 70%)}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 62%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 62%)}

/* ── Navigation ────────────────────────────────────────────── */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(12px + env(safe-area-inset-top)) var(--pad) 0}
.nav-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:14px;height:52px;padding:0 8px 0 18px;
  border-radius:100px;border:1px solid var(--glass-edge);background:var(--glass);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.brand b{font-weight:800;font-variation-settings:'wdth' 112}
.mark{display:flex;flex-direction:column;gap:2px;width:16px}
.mark i{height:3px;border-radius:2px;background:var(--text-3)}
.mark i:nth-child(1){background:var(--amber)}
.mark i:nth-child(2){background:var(--teal)}
.mark i:nth-child(3){width:60%}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:12px;color:var(--text-3);letter-spacing:.08em;margin-right:6px;font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:100px;border:1px solid var(--glass-edge);
  background:transparent;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background var(--t-s),border-color var(--t-s),color var(--t-s)}
.pill:hover{background:var(--glass);border-color:var(--line-hi)}
.pill:disabled{opacity:.35;cursor:default}
.pill:disabled:hover{background:transparent;border-color:var(--glass-edge)}
.pill.primary{background:var(--amber);color:var(--on-accent);border-color:transparent;font-weight:600}
.pill.primary:hover{background:var(--amber);filter:brightness(1.06)}
.pill.on{background:var(--amber);color:var(--on-accent);border-color:transparent;font-weight:600}
.icon-btn{width:36px;padding:0;justify-content:center}
.pill svg{width:16px;height:16px;flex:none}
.sun{display:none}
html[data-theme="light"] .sun{display:block}
html[data-theme="light"] .moon{display:none}
.dot-state{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
.dot-state.on{background:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
.dot-state.warn{background:var(--amber)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:2px}

/* ── Hero ──────────────────────────────────────────────────── */
main{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.hero{padding:clamp(112px,16vw,158px) 0 clamp(20px,4vw,34px)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);
  display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--amber);flex:none}
.hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.hero-count{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--text-3);white-space:nowrap}
h1{font-family:var(--display);font-size:clamp(38px,6.6vw,78px);line-height:.98;letter-spacing:-.045em;margin:20px 0 0;font-weight:700}
h1 span{font-variation-settings:'wdth' 116,'wght' 800}
h1 em{font-style:italic;font-weight:600;background:linear-gradient(94deg,var(--em-1),var(--em-2) 52%,var(--em-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.lead{max-width:560px;color:var(--text-2);font-size:clamp(15.5px,1.8vw,18px);margin:20px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:24px;font-family:var(--mono);font-size:12.5px;color:var(--text-3)}
.stats b{color:var(--text);font-weight:500}

/* Fächer-Welle: der Bestand als gekippte Blätter */
.wave{position:relative;height:clamp(96px,15vw,168px);margin:26px 0 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.wave-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;perspective:900px}
.wave i{display:block;flex:1 1 0;min-width:4px;max-width:15px;border-radius:2px;
  background:linear-gradient(180deg,var(--wc,#F2B33D),color-mix(in srgb,var(--wc,#F2B33D) 55%,var(--void)));
  box-shadow:1px 0 0 rgba(0,0,0,.35),-1px 0 0 rgba(255,255,255,.10);
  animation:waveIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes waveIn{from{opacity:0;transform:translateY(18px) scaleY(.2)}}

/* ── Steuerleiste ──────────────────────────────────────────── */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 0 18px;
  border-bottom:1px solid var(--line);margin-bottom:26px}
.search{flex:1;min-width:190px;height:38px;padding:0 14px;border-radius:100px;border:1px solid var(--glass-edge);
  background:var(--glass);color:var(--text);font-size:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.search::placeholder{color:var(--text-3)}
.seg{display:flex;gap:4px;padding:3px;border-radius:100px;border:1px solid var(--glass-edge);background:var(--glass)}
.seg button{height:30px;padding:0 12px;border:none;background:transparent;border-radius:100px;font-size:13px;cursor:pointer;
  color:var(--text-2);transition:background var(--t-s),color var(--t-s)}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--amber);color:var(--on-accent);font-weight:600}

/* ── Kartei ────────────────────────────────────────────────── */
.deck{padding-bottom:90px}
.group-head{display:flex;align-items:center;gap:14px;margin:34px 0 16px}
.group-head:first-child{margin-top:0}
.group-head .eyebrow{flex:none}
.group-head .rule{flex:1;height:1px;background:var(--line)}
.group-head .n{font-family:var(--mono);font-size:11.5px;color:var(--text-3);letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{position:relative;border-radius:17px;padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;
  border:0;background:none;text-align:left;font:inherit;color:inherit;opacity:0;animation:fade .55s ease forwards;
  min-width:0;overflow:hidden}
@keyframes fade{to{opacity:1}}
.card-bg{position:absolute;inset:0;border-radius:inherit;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  transition:border-color var(--t-m),box-shadow var(--t-m),transform var(--t-m)}
.card:hover .card-bg,.card:focus-visible .card-bg{border-color:var(--acc,var(--line-hi))}
.card:focus-visible{outline:none}
.card:focus-visible .card-bg{box-shadow:var(--shadow-lg),0 0 0 2px var(--amber)}
.c-head{position:relative;display:flex;align-items:center;gap:10px;padding:0 4px;min-width:0}
.c-idx{font-family:var(--mono);font-size:11.5px;color:var(--text-3);letter-spacing:.06em;flex:none}
.c-head h2{margin:0;font-size:18px;letter-spacing:-.02em;font-weight:700;font-variation-settings:'wdth' 108;line-height:1.25;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
  border:1px solid var(--line);border-radius:100px;padding:2px 8px;white-space:nowrap}
.c-cat{border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc)}

/* Vorschau: ein Blatt mit gefächertem Stapel dahinter */
.leaf{position:relative;aspect-ratio:16/10;border-radius:11px;perspective:1000px}
.leaf-stack{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--t-m) cubic-bezier(.2,.8,.2,1)}
.card:hover .leaf-stack{transform:rotateX(2deg) translateY(-3px)}
.leaf-back{position:absolute;left:8px;right:8px;top:10px;bottom:-4px;border-radius:9px;background:var(--sheet);
  border:1px solid var(--line-2);transform:translateZ(-24px) rotate(-1.6deg);opacity:.75}
.leaf-back.b2{left:14px;right:14px;top:16px;transform:translateZ(-42px) rotate(2.2deg);opacity:.45}
.leaf-face{position:absolute;inset:0;border-radius:11px;overflow:hidden;background:var(--sheet);
  border:1px solid var(--line);padding:14px 15px;
  box-shadow:0 14px 30px -18px rgba(0,0,0,.8)}
.leaf-face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:.9}
.leaf-face::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--void) 72%,transparent))}
.leaf-rule{height:1px;background:var(--line);margin:0 0 9px}
.leaf-text{font-size:12.5px;line-height:1.55;color:var(--text-2);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.leaf-kick{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px}
.open-hint{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:100px;
  background:var(--glass-2);border:1px solid var(--glass-edge);font-size:12.5px;font-weight:600;pointer-events:none;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background var(--t-s),color var(--t-s)}
.card:hover .open-hint{background:var(--acc);color:var(--on-accent);border-color:transparent}
.c-foot{position:relative;padding:0 4px;min-width:0}
.c-meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--text-3);min-width:0}
.c-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.c-tags .tag{font-size:10px;padding:1px 7px}
.deck-empty{text-align:center;color:var(--text-3);font-style:italic;padding:60px 20px;border:1px dashed var(--line);border-radius:17px}

/* ── Leseansicht ───────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--void) 82%,transparent);opacity:0;pointer-events:none;
  transition:opacity var(--t-m) ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.reading .scrim{opacity:1;pointer-events:auto}
.bar{position:fixed;top:0;left:0;right:0;z-index:70;padding:env(safe-area-inset-top) 10px 0;height:calc(58px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--glass-edge);background:var(--glass-2);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  transform:translateY(-102%);transition:transform var(--t-m) cubic-bezier(.2,.8,.2,1)}
body.reading .bar{transform:none}
.bar-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;justify-content:center}
.bar-title strong{font-size:16px;font-weight:700;letter-spacing:-.01em;font-variation-settings:'wdth' 108;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title .c-idx{flex:none}
.bar .grp{display:flex;gap:6px;align-items:center}
.reader{position:fixed;inset:calc(58px + env(safe-area-inset-top)) 0 0;z-index:60;overflow:auto;-webkit-overflow-scrolling:touch;
  opacity:0;visibility:hidden;transition:opacity .28s ease}
body.reading .reader{opacity:1;visibility:visible}
.sheet{max-width:760px;margin:30px auto 80px;border-radius:18px;border:1px solid var(--line);background:var(--glass);
  box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  padding:clamp(22px,4vw,46px);position:relative;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--acc),transparent 70%)}
.s-kick{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--text-3)}
.s-kick .rule{flex:1;height:1px;background:var(--line)}
.sheet h1{font-size:clamp(28px,4.6vw,44px);line-height:1.05;letter-spacing:-.035em;margin:18px 0 0;font-weight:700;
  font-variation-settings:'wdth' 110}
.s-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:18px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.s-source{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:6px;font-style:italic}
.s-tags{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.s-rule{height:1px;background:var(--line);margin:22px 0 24px}
.s-body{font-size:16.5px;line-height:1.72;color:var(--text)}
.s-body p{margin:0 0 1.05em}
.s-body h1{font-size:1.5em;margin:1.4em 0 .5em;letter-spacing:-.02em}
.s-body h2{font-size:1.25em;margin:1.3em 0 .5em;letter-spacing:-.015em;font-weight:700}
.s-body h3{font-size:1.08em;margin:1.2em 0 .4em;font-weight:700}
.s-body ul,.s-body ol{padding-left:1.25em;margin:0 0 1.05em}
.s-body li{margin:.3em 0}
.s-body blockquote{margin:1.1em 0;padding:.2em 0 .2em 1.1em;border-left:2px solid var(--acc);color:var(--text-2);font-style:italic}
.s-body a{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.s-body a:hover{border-color:var(--acc)}
.s-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:34px;padding-top:18px;
  border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.s-empty{text-align:center;color:var(--text-3);font-style:italic;padding:40px 0}

/* ── Menüs ─────────────────────────────────────────────────── */
.menu{position:fixed;z-index:130;min-width:210px;max-width:320px;border-radius:14px;overflow:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--glass-edge);background:var(--glass-2);box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3)}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:.62rem .9rem;font-size:14px;
  cursor:pointer;border-bottom:1px solid var(--line-2)}
.menu button:last-child{border-bottom:none}
.menu button:hover{background:color-mix(in srgb,var(--amber) 16%,transparent)}
.m-note{padding:.7rem .9rem;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--text-3);
  border-bottom:1px solid var(--line)}
.m-side{display:flex !important;align-items:center;gap:.5rem}
.m-side::before{content:'○';opacity:.5}
.m-side.selected::before{content:'●';opacity:1;color:var(--amber)}
.tagmenu{padding:6px;display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto}
.tag-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.35rem .35rem .5rem .6rem;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--line);margin-bottom:3px}
.tag-close{background:none;border:none;color:var(--text-3);font-size:.9rem;line-height:1;padding:.25rem .4rem;border-radius:6px;cursor:pointer}
.tag-close:hover{background:var(--glass);color:var(--text)}
.tag-chip{background:none;border:none;color:var(--text);padding:.45rem .6rem;font-size:14px;text-align:left;
  border-radius:8px;display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;border-bottom:none !important}
.tag-chip:hover{background:var(--glass)}
.tag-chip.selected{background:color-mix(in srgb,var(--amber) 20%,transparent);font-weight:600}
.tag-chip .check{opacity:0}
.tag-chip.selected .check{opacity:1;color:var(--amber)}
.tag-empty{font-size:13px;color:var(--text-3);font-style:italic;padding:.5rem .6rem}
.tag-clear{text-align:left;padding:.5rem .6rem;background:none;border:none;border-top:1px solid var(--line) !important;
  font-size:13px;color:var(--text-3);margin-top:3px;cursor:pointer;border-radius:0}

/* ── Editor ────────────────────────────────────────────────── */
.editor{position:fixed;inset:0;z-index:120;background:var(--void);overflow:auto;
  opacity:0;visibility:hidden;transition:opacity .28s ease}
.editor.active{opacity:1;visibility:visible}
.editor-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg-grad)}
.ed-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;

  border-bottom:1px solid var(--glass-edge);background:var(--glass-2);

.ed-bar .eyebrow{margin-left:6px}

.ed-sheet{position:relative;z-index:1;max-width:760px;margin:28px auto 80px;padding:clamp(22px,4vw,40px);

.ed-title::placeholder{color:var(--text-3);opacity:.7}

footer{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:26px var(--pad) calc(40px + env(safe-area-inset-bottom));

}

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════
   WERKBANK-BUS · gleichlautend in jedem Werkzeug
   Alle Werkzeuge liegen unter derselben Herkunft, teilen sich also
   Speicher. Wer etwas ändert, sagt Bescheid; die anderen ziehen nach.
   ════════════════════════════════════════════════════════════════ */
const WB = (function(){
  const KANAL = 'werkbank', WECK = 'wb-signal';
  const eigen = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const hoerer = [];
  let bc = null;
  try { bc = new BroadcastChannel(KANAL); } catch (e) {}
  function zustellen(n){
    if (!n || typeof n !== 'object' || n.von === eigen) return;
    for (let i = 0; i < hoerer.length; i++){
      const h = hoerer[i];
      if (h.thema && h.thema !== n.thema) continue;
      try { h.fn(n); } catch (e) {}
    }
  }
  if (bc) bc.onmessage = e => zustellen(e.data);
  addEventListener('storage', e => {
    if (e.key !== WECK || !e.newValue) return;
    try { zustellen(JSON.parse(e.newValue)); } catch (err) {}
  });
  return {
    id: eigen,
    melden(thema, zusatz){
      const n = Object.assign({ thema, von: eigen, zeit: Date.now() }, zusatz || {});
      if (bc) { try { bc.postMessage(n); } catch (e) {} }
      try { localStorage.setItem(WECK, JSON.stringify(n)); } catch (e) {}
    },
    horchen(thema, fn){ hoerer.push({ thema, fn }); },
    lesen(k){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } },
    schreiben(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  };
})();
const WB_NOTES_LS = 'wb-noteos-stand';

/* Aussehen gilt für die ganze Werkbank. Geschrieben werden beide
   Schlüssel — jedes Werkzeug liest beim Start seinen eigenen, und so
   finden alle denselben Stand vor. Gemeldet wird zusätzlich über den
   Bus, damit offene Fenster sofort mitziehen. */
const WB_THEME_KEYS = ['wb-theme', 'wb-cockpit-theme'];
function wbThemeSichern(t){
  WB_THEME_KEYS.forEach(k => { try { localStorage.setItem(k, t); } catch (e) {} });
}
const WB_AB_LS = 'wb-auftragsbuch-data';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const root = document.documentElement;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad3 = n => String(n).padStart(3,'0');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ───────── Theme & Uhr ───────── */
function setTheme(t, persist){
  root.setAttribute('data-theme', t);
  $('meta[name="theme-color"]').content = t === 'light' ? '#EEF1F6' : '#06090E';
  if (persist){ wbThemeSichern(t); WB.melden('theme', { theme:t }); }
}
setTheme(root.getAttribute('data-theme'), false);
$('#themeBtn').addEventListener('click', () => {
  setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
});
WB.horchen('theme', n => { if (n.theme) setTheme(n.theme, false); });
addEventListener('storage', e => {
  if (e.key === 'wb-cockpit-theme' && (e.newValue === 'light' || e.newValue === 'dark')) setTheme(e.newValue, false);
});
$('#yr').textContent = new Date().getFullYear();
const clock = $('#clock');
const tick = () => { const d = new Date(); clock.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
tick(); setInterval(tick, 15000);

/* ───────── Demodaten ───────── */
const TODAY = new Date('2026-08-02');
const daysAgo = d => { const x = new Date(TODAY); x.setDate(x.getDate()-d); return x; };
const fmt = d => d.toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const c = v => Math.max(0,Math.min(255, v + Math.round(255*amt)));
  return '#'+((1<<24)+(c(n>>16)<<16)+(c((n>>8)&255)<<8)+c(n&255)).toString(16).slice(1);
}
/* Akzente aus der Cockpit-Familie: Amber/Teal als Achse, dazu drei
   gedämpfte Töne, die auf Fast-Schwarz wie auf Hell noch tragen. */
const CATS = { Rezept:'#F2B33D', Projekt:'#63D9C4', Arbeit:'#8FA6FF', Alltag:'#AEBAC7',
               Reise:'#F58F7C', Lernen:'#B79BFF', Familie:'#F7CF83' };
const FALLBACK_COLORS = ['#F2B33D','#63D9C4','#8FA6FF','#B79BFF'];
function colorForCategory(cat){
  if (CATS[cat]) return CATS[cat];
  let h = 0; for (let i=0;i<cat.length;i++) h = (h + cat.charCodeAt(i)) % FALLBACK_COLORS.length;
  return FALLBACK_COLORS[h];
}
function slugify(title, taken){
  let base = title.toLowerCase()
    .replace(/[äöüß]/g, c => ({'ä':'ae','ö':'oe','ü':'ue','ß':'ss'}[c]))
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'notiz';
  let name = base, i = 2;
  while (taken.has(name+'.md')) name = base+'-'+(i++);
  return name + '.md';
}
const CONTENT = {
  Rezept:['Zutaten und Zubereitungsschritte für dieses Gericht.','Nach mehrmaligem Testen die Version, die am besten funktioniert.'],
  Projekt:['Ideen, nächste Schritte und offene Fragen zu diesem Vorhaben.','Wird laufend ergänzt, sobald sich der Stand ändert.'],
  Arbeit:['Besprochene Punkte, Entscheidungen und nächste Schritte.','Verantwortlichkeiten und Termine im Überblick.'],
  Alltag:['Dinge, die erledigt werden müssen.','Wird bei Bedarf ergänzt und abgehakt.'],
  Reise:['Orte, Ideen und praktische Hinweise für die Reise.','Sammlung von Empfehlungen und Notizen unterwegs.'],
  Lernen:['Zusammenfassung der wichtigsten Punkte.','Notizen zum Nacharbeiten und Wiederholen.'],
  Familie:['Planung, Termine und Absprachen.','Wichtige Details für alle Beteiligten.']
};
const RAW = [
  ['Rezept','Rezept: Apfelkuchen',3],['Rezept','Rezept: Linsensuppe',18],['Rezept','Rezept: Pesto alla Genovese',40],
  ['Rezept','Rezept: Sonntagsbraten',65],['Rezept','Rezept: Zitronenkuchen',12],['Rezept','Rezept: Kürbissuppe',200],
  ['Rezept','Rezept: Bananenbrot',30],
  ['Projekt','Projektideen Sommer',13],['Projekt','Website Relaunch – Notizen',22],['Projekt','Gartenprojekt Kräuterbeet',8],
  ['Projekt','Buchprojekt: Kapitelplan',90],['Projekt','Renovierung Bad – Checkliste',55],['Projekt','App-Idee: Skizze',4],

/* ───────── Markdown ───────── */
function inlineMdToHtml(text){
  return String(text)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function contentToHtml(lines){
  let html = '', i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (line.startsWith('- ')){
      let items=''; while (i<lines.length && lines[i].startsWith('- ')){ items+='<li>'+inlineMdToHtml(lines[i].slice(2))+'</li>'; i++; }
      html += '<ul>'+items+'</ul>';
    } else if (/^\d+\.\s/.test(line)){
      let items=''; while (i<lines.length && /^\d+\.\s/.test(lines[i])){ items+='<li>'+inlineMdToHtml(lines[i].replace(/^\d+\.\s/,''))+'</li>'; i++; }
      html += '<ol>'+items+'</ol>';
    } else if (line.startsWith('### ')){ html += '<h3>'+inlineMdToHtml(line.slice(4))+'</h3>'; i++; }
    else if (line.startsWith('## ')){ html += '<h2>'+inlineMdToHtml(line.slice(3))+'</h2>'; i++; }
    else if (line.startsWith('# ')){ html += '<h1>'+inlineMdToHtml(line.slice(2))+'</h1>'; i++; }
    else if (line.startsWith('> ')){ html += '<blockquote>'+inlineMdToHtml(line.slice(2))+'</blockquote>'; i++; }
    else { html += '<p>'+inlineMdToHtml(line)+'</p>'; i++; }
  }
  return html;
}
function plainExcerpt(n){
  const raw = (n.content || []).join(' ').replace(/^#+\s*/gm,'').replace(/[*>`]/g,'').replace(/\s+/g,' ').trim();
  return raw || '(Kein Inhalt)';
}

/* ───────── Suche ───────── */
const searchCache = new WeakMap();
function searchIndex(n){
  let s = searchCache.get(n);
  if (s === undefined){
    s = [n.title, n.author, ...(n.tags||[]), ...(n.content||[])].join('\n').toLowerCase();
    searchCache.set(n, s);
  }
  return s;
}
const matchesSearch = (n, terms) => { const hay = searchIndex(n); return terms.every(t => hay.includes(t)); };

  const terms = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = terms.length ? notes.filter(n => matchesSearch(n, terms)) : notes.slice();
  if (activeTags.size) list = list.filter(n => n.tags.some(t => activeTags.has(t)));
  return list;
}
function cardHtml(n, pos, delay){
  const tags = n.tags.filter(t => t !== n.category).slice(0,3)

  return '<button class="card" data-note="'+n.id+'" style="--acc:'+n.accent+';animation-delay:'+delay+'ms" aria-label="'+esc(n.title)+' öffnen">'
    + '<span class="card-bg"></span>'
    + '<span class="c-head"><span class="c-idx">'+pad3(pos)+'</span><h2>'+esc(n.title)+'</h2>'
    +   '<span class="tag c-cat">'+esc(n.category)+'</span></span>'

    +   '<span class="leaf-face"><span class="leaf-kick">'+esc(n.modified)+'</span><span class="leaf-rule"></span>'
    +     '<span class="leaf-text">'+esc(plainExcerpt(n))+'</span></span>'

function renderDeck(){
  const list = filtered();
  if (!list.length){
    view = [];
    deck.innerHTML = '<div class="deck-empty">Keine Notiz gefunden.</div>';
    updateHero(); return;
  }
  let html = '', pos = 0, d = 0;
  if (sortMode === 'kategorie'){
    const by = {};
    list.forEach(n => (by[n.category] = by[n.category] || []).push(n));
    const order = [];
    Object.keys(by).sort((a,b)=>a.localeCompare(b,'de')).forEach(cat => {
      const group = by[cat].slice().sort((a,b)=>a.title.localeCompare(b.title,'de'));
      html += '<div class="group-head"><div class="eyebrow">'+esc(cat)+'</div><div class="rule"></div>'
            + '<div class="n">'+pad3(group.length)+'</div></div><div class="grid">';
      group.forEach(n => { order.push(n); html += cardHtml(n, ++pos, Math.min(d += 35, 700)); });
      html += '</div>';
    });
    view = order;
  } else {
    const l = list.slice();
    if (sortMode==='az') l.sort((a,b)=>a.title.localeCompare(b.title,'de'));
    if (sortMode==='neu') l.sort((a,b)=>b.modifiedSort-a.modifiedSort);
    if (sortMode==='erstellt') l.sort((a,b)=>(b.createdSort||b.modifiedSort)-(a.createdSort||a.modifiedSort));
    view = l;
    html = '<div class="grid">' + l.map(n => cardHtml(n, ++pos, Math.min(d += 35, 700))).join('') + '</div>';
  }
  deck.innerHTML = html;

}
function updateHero(){

  buildWave();

function buildWave(){
  const el = $('#wave');
  if (!el) return;
  const max = innerWidth < 820 ? 30 : 56;
  const src = notes.slice(0, max);
  const n = src.length || 1;
  el.innerHTML = src.map((note,i) => {
    const p = i/(n-1 || 1);
    const h = 34 + Math.sin(p*Math.PI*2.1)*22 + Math.sin(p*Math.PI*5.5)*7;
    const rot = Math.cos(p*Math.PI*2.1)*13;
    const y = Math.sin(p*Math.PI*2.1)*-9;
    return '<i style="--wc:'+note.accent+';height:'+Math.max(16,h+38)+'%;'
      + 'transform:translateY('+y.toFixed(1)+'px) rotate('+rot.toFixed(1)+'deg);'
      + 'animation-delay:'+(i*14)+'ms"></i>';
  }).join('');
}

/* Menü am Knopf ausrichten – und notfalls nach oben klappen,
   damit es nie unter den Bildschirmrand rutscht. */
function placeMenu(menu, anchor, width){
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - (width||240) - 8)) + 'px';
  const below = innerHeight - r.bottom - 16;
  const above = r.top - 16;
  if (below < 180 && above > below){
    menu.style.top = '';
    menu.style.bottom = (innerHeight - r.top + 8) + 'px';
    menu.style.maxHeight = Math.max(140, above) + 'px';
  } else {
    menu.style.bottom = '';
    menu.style.top = (r.bottom + 8) + 'px';
    menu.style.maxHeight = Math.max(140, below) + 'px';
  }
}
$('#tagBtn').addEventListener('click', e => {

function openNote(id, fromEl){
  if (!notes[id]) return;
  curIdx = id;
  const card = fromEl || deck.querySelector('.card[data-note="'+id+'"]');
  renderSheet();
  reading = true;
  document.body.classList.add('reading');
  root.classList.add('locked');
  reader.scrollTop = 0;
  $('#printBtn').disabled = false;
  if (card && !reduced() && sheet.animate){
    const a = card.getBoundingClientRect();
    const b = sheet.getBoundingClientRect();
    if (b.width && b.height){
      const s = Math.max(.35, Math.min(1, a.width / b.width));
      const dx = (a.left + a.width/2) - (b.left + b.width/2);
      const dy = (a.top + a.height/2) - (b.top + b.height/2);
      sheet.animate(
        [{ transform:'translate('+dx+'px,'+dy+'px) scale('+s+')', opacity:0 }, { transform:'none', opacity:1 }],
        { duration:460, easing:'cubic-bezier(.2,.8,.2,1)' });
    }
  }
  if (history.state && history.state.noteos) history.replaceState({ noteos:id }, '', '#n'+id);
  else history.pushState({ noteos:id }, '', '#n'+id);
  setTimeout(() => $('#backBtn').focus({ preventScroll:true }), 60);
}
function closeNote({ back = true } = {}){
  if (!reading) return;
  reading = false;
  document.body.classList.remove('reading');
  root.classList.remove('locked');
  $('#printBtn').disabled = true;
  document.title = 'NoteOS – Wissen der Werkbank';
  const card = deck.querySelector('.card[data-note="'+curIdx+'"]');
  if (card && card.scrollIntoView) card.scrollIntoView({ block:'center' });
  if (card && card.focus) card.focus({ preventScroll:true });
  if (back && history.state && history.state.noteos) history.back();
  else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
function stepNote(dir){
  if (!reading) return;
  const i = view.indexOf(notes[curIdx]);
  const next = view[i + dir];
  if (!next) return;
  curIdx = next.id;
  renderSheet();
  history.replaceState({ noteos:curIdx }, '', '#n'+curIdx);
  if (!reduced() && sheet.animate){
    sheet.animate([{ opacity:0, transform:'translateX('+(dir*24)+'px)' }, { opacity:1, transform:'none' }],
      { duration:260, easing:'cubic-bezier(.2,.8,.2,1)' });
  }
  reader.scrollTop = 0;
}
$('#backBtn').addEventListener('click', () => closeNote());
$('#scrim').addEventListener('click', () => closeNote());
$('#prevBtn').addEventListener('click', () => stepNote(-1));
$('#nextBtn').addEventListener('click', () => stepNote(1));
addEventListener('popstate', () => {
  const m = /^#n(\d+)$/.exec(location.hash);
  if (m && notes[+m[1]]){ if (!reading || curIdx !== +m[1]) openNote(+m[1]); }
  else if (reading) closeNote({ back:false });
});
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#editorView').classList.contains('active')) return;
  if (!$('#confirmOverlay').hidden) return;
  if (POPOVERS.some(([id]) => { const m = document.getElementById(id); return m && !m.hidden; })) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.key === 'Escape' && reading){ closeNote(); return; }
  if (!reading) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); stepNote(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); stepNote(1); }
});
/* Wischen blättert */
(function(){
  let sx = 0, sy = 0, on = false;
  reader.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, { passive:true });
  reader.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6) stepNote(dx < 0 ? 1 : -1);
  }, { passive:true });
})();

/* ═══════ Auftraggeber aus dem Auftragsbuch ═══════
   Unter derselben Herkunft liegt der Bestand des Auftragsbuchs. Seine
   Auftraggeber stehen hier als Kategorie zur Wahl — so lässt sich eine
   Notiz einem Kunden zuordnen, ohne dass NoteOS etwas über Aufträge
   wissen müsste. Fehlt das Auftragsbuch, bleibt die Liste wie zuvor. */
function auftraggeberNamen(){
  const d = WB.lesen(WB_AB_LS);
  if (!d || !Array.isArray(d.auftraggeber)) return [];
  return d.auftraggeber.filter(x => x && x.name && x.aktiv !== false)
    .map(x => String(x.name)).sort((a,b) => a.localeCompare(b,'de'));
}
function kategorienAufbauen(){
  const gewaehlt = editorCategory.value;
  editorCategory.innerHTML = '<option value="">Kategorie wählen …</option>';
  const eigene = new Set(notes.map(n => n.category));
  const fest = new Set(Object.keys(CATS));
  [...new Set([...fest, ...eigene])].sort((a,b)=>a.localeCompare(b,'de')).forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c;
    editorCategory.appendChild(o);
  });
  const kunden = auftraggeberNamen().filter(n => !fest.has(n));
  if (kunden.length){
    const g = document.createElement('optgroup'); g.label = 'Auftraggeber';
    kunden.forEach(n => {
      const o = document.createElement('option'); o.value = n; o.textContent = n;
      g.appendChild(o);
    });
    editorCategory.appendChild(g);
  }
  if (gewaehlt) editorCategory.value = gewaehlt;
}
kategorienAufbauen();
/* Wird im Auftragsbuch ein Kunde angelegt oder umbenannt, steht er
   hier beim nächsten Öffnen des Editors bereit — ohne Neuladen. */
WB.horchen('auftragsbuch', () => kategorienAufbauen());

/* ───────── Import ───────── */
function loadScript(src){
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="'+src+'"]')){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
}
async function loadPdfJs(){
  if (window.pdfjsLib) return window.pdfjsLib;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/';
  const mod = await import(base + 'pdf.min.mjs');
  mod.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
  window.pdfjsLib = mod;
  return mod;
}
async function loadMammoth(){
  if (window.mammoth) return window.mammoth;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js');
  return window.mammoth;
}
async function extractPdfText(file){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const paragraphs = [];
  for (let i=1; i<=doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    const text = tc.items.map(it => it.str).join(' ').replace(/\s+/g,' ').trim();
    if (text) paragraphs.push(text);
  }
  return contentToHtml(paragraphs.length ? paragraphs : ['(Kein Text im PDF gefunden – evtl. ein gescanntes Dokument ohne Textebene.)']);
}
async function extractDocxHtml(file){
  const m = await loadMammoth();
  return (await m.convertToHtml({ arrayBuffer: await file.arrayBuffer() })).value;
}

/* ───────── HTML → Markdown ───────── */
function inlineToMd(node){
  let out = '';
  node.childNodes.forEach(child => {
    if (child.nodeType === 3){ out += child.textContent; return; }
    const tag = child.tagName;
    if (tag==='B'||tag==='STRONG') out += '**'+inlineToMd(child)+'**';
    else if (tag==='I'||tag==='EM') out += '*'+inlineToMd(child)+'*';
    else if (tag==='A') out += '['+inlineToMd(child)+']('+(child.getAttribute('href')||'')+')';
    else if (tag==='BR') out += ' ';
    else out += inlineToMd(child);
  });
  return out;
}
function htmlToMarkdown(rootEl){
  const lines = [];
  rootEl.childNodes.forEach(node => {
    if (node.nodeType !== 1){ const t = (node.textContent||'').trim(); if (t) lines.push(t); return; }
    const tag = node.tagName;
    if (tag==='H1') lines.push('# '+inlineToMd(node).trim());
    else if (tag==='H2') lines.push('## '+inlineToMd(node).trim());
    else if (tag==='H3') lines.push('### '+inlineToMd(node).trim());
    else if (tag==='BLOCKQUOTE') lines.push('> '+inlineToMd(node).trim());
    else if (tag==='UL') node.querySelectorAll(':scope > li').forEach(li => lines.push('- '+inlineToMd(li).trim()));
    else if (tag==='OL'){ let i=1; node.querySelectorAll(':scope > li').forEach(li => lines.push((i++)+'. '+inlineToMd(li).trim())); }
    else { const t = inlineToMd(node).trim(); if (t) lines.push(t); }
  });
  return lines.filter(Boolean);
}

$('#editorSave').addEventListener('click', async () => {
  const title = editorTitle.value.trim(), category = editorCategory.value;
  if (!title || !category){ editorHint.textContent = 'Bitte Titel und Kategorie angeben.'; return; }
  const extraTags = editorTags.value.split(',').map(t=>t.trim()).filter(Boolean).filter(t=>t!==category);
  const tags = [category, ...extraTags];
  const content = htmlToMarkdown(editorBody);
  const now = new Date();
  const saveBtn = $('#editorSave');
  saveBtn.disabled = true;
  try{
    if (editingNoteId !== null){
      const n = notes[editingNoteId];
      const oldTitle = n.title, oldFilename = n.filename;
      n.title = title; n.category = category; n.tags = tags;
      n.accent = shade(colorForCategory(category), ((n.id%5)-2)*0.025);
      n.modified = fmt(now); n.modifiedSort = now.getTime();
      n.content = content.length ? content : ['(Kein Inhalt)'];
      n.source = pendingSource;
      searchCache.delete(n);

      let newFilename = oldFilename;
      if (fsMode !== 'none' && (title !== oldTitle || !newFilename)){
        const taken = new Set(notes.filter(x => x !== n).map(x => x.filename).filter(Boolean));
        newFilename = slugify(title, taken);
      }
      const renamed = !!(oldFilename && newFilename && newFilename !== oldFilename);
      let conflict = false;
      if (fsMode === 'fs'){
        if (renamed) conflict = await renameNoteFile(n, newFilename);
        else { n.filename = newFilename; conflict = await writeNoteFile(n); }
      } else if (fsMode === 'idb'){
        n.filename = newFilename;
        if (renamed) await idbRenameNote(n, oldFilename);
        else await idbPutNote(n);
      }
      closeEditor();

      if (reading) renderSheet();
      WB.melden('noteos', { was:'geaendert' });

      else if (renamed && fsMode === 'fs') toast('Gespeichert, Datei heißt jetzt „'+newFilename+'".');
      else savedToast(n.title, false);
      return;
    }
    const id = notes.length;
    const taken = new Set(notes.map(n => n.filename).filter(Boolean));
    const newNote = {
      id, title, category, tags,
      accent: shade(colorForCategory(category), ((id%5)-2)*0.025),
      created: fmt(now), createdSort: now.getTime(), modified: fmt(now), modifiedSort: now.getTime(),
      author:'Du', source: pendingSource, content: content.length ? content : ['(Kein Inhalt)'],
      filename: slugify(title, taken)
    };
    if (fsMode === 'fs') await writeNoteFile(newNote);
    else if (fsMode === 'idb') await idbPutNote(newNote);
    notes.push(newNote);
    closeEditor();
    if (activeTags.size && !newNote.tags.some(t => activeTags.has(t))){ activeTags.clear(); updateTagBtn(); }
    renderDeck();

    toast('Speichern fehlgeschlagen – Notiz nicht gesichert.');

  }
});

function noteToMarkdown(n){
  const fm = ['---', 'title: '+n.title,
    'created: '+n.created, 'created_iso: '+new Date(n.createdSort||Date.now()).toISOString(),
    'modified: '+n.modified, 'modified_iso: '+new Date(n.modifiedSort||Date.now()).toISOString(),
    'author: '+n.author, 'tags: ['+n.tags.join(', ')+']'];
  if (n.source) fm.push('source: '+n.source);
  fm.push('---', '');
  return fm.join('\n') + n.content.join('\n\n');
}
function parseMarkdownFile(text, filename, fileLastMod){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  let meta = {}, body = text;
  if (m){
    body = m[2];
    m[1].split(/\r?\n/).forEach(line => {
      const mm = line.match(/^(\w+):\s*(.*)$/); if (!mm) return;
      const key = mm[1], val = mm[2].trim();
      meta[key] = key === 'tags' ? val.replace(/^\[|\]$/g,'').split(',').map(s=>s.trim()).filter(Boolean) : val;
    });
  }
  const contentLines = body.split(/\r?\n+/).map(l=>l.trim()).filter(Boolean);
  const category = (meta.tags && meta.tags[0]) || 'Ohne Kategorie';
  const modSort = meta.modified_iso ? Date.parse(meta.modified_iso) : fileLastMod;
  const creSort = meta.created_iso ? Date.parse(meta.created_iso) : fileLastMod;
  return {
    title: meta.title || filename.replace(/\.md$/,''),
    category, tags: meta.tags && meta.tags.length ? meta.tags : [category],
    created: meta.created || fmt(new Date(creSort)), createdSort: creSort,
    modified: meta.modified || fmt(new Date(modSort)), modifiedSort: modSort,
    author: meta.author || 'Du', source: meta.source || null,
    content: contentLines.length ? contentLines : ['(Kein Inhalt)'],
    filename, fileMtime: fileLastMod
  };
}
function exportMarkdown(n){
  const blob = new Blob([noteToMarkdown(n)], { type:'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (n.title.replace(/[\\/:*?"<>|]/g,'').trim() || 'notiz') + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ───────── Speicherort: echter Ordner (Chromium) + IndexedDB ───────── */
const hasFSAccess = 'showDirectoryPicker' in window;
let dirHandle = null;
let fsMode = 'none';   /* 'fs' | 'idb' | 'none' */
let idbPromise = null;

function idbOpen(){
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('noteos-store', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath:'filename' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      if (!db.objectStoreNames.contains('trash')) db.createObjectStore('trash', { keyPath:'filename' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;
}
const idbGetAllNotes = () => idbOpen().then(db => new Promise((res, rej) => {
  const req = db.transaction('notes','readonly').objectStore('notes').getAll();
  req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
}));
const idbPutNote = note => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction('notes','readwrite'); tx.objectStore('notes').put(note);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const idbSetMeta = (key, val) => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction('meta','readwrite'); tx.objectStore('meta').put(val, key);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const idbGetMeta = key => idbOpen().then(db => new Promise((res, rej) => {
  const req = db.transaction('meta','readonly').objectStore('meta').get(key);
  req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
}));
const idbRenameNote = (note, oldFilename) => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction('notes','readwrite');
  tx.objectStore('notes').put(note);
  tx.objectStore('notes').delete(oldFilename);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const idbMoveToTrash = n => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction(['notes','trash'],'readwrite');
  tx.objectStore('trash').put(n);
  tx.objectStore('notes').delete(n.filename);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));

function replaceNotes(list){
  notes.length = 0;
  list.forEach((n,i) => { n.id = i; notes.push(n); });
  curIdx = 0;
}
function rebuildAccents(list){
  list.forEach((n,i) => { n.accent = shade(colorForCategory(n.category), ((i%5)-2)*0.025); });
}
async function loadNotesFromFolder(){
  const loaded = [];
  for await (const [name, handle] of dirHandle.entries()){
    if (handle.kind !== 'file' || !name.toLowerCase().endsWith('.md')) continue;
    try{
      const file = await handle.getFile();
      loaded.push(parseMarkdownFile(await file.text(), name, file.lastModified));
    }catch(e){}
  }
  loaded.sort((a,b)=>a.title.localeCompare(b.title,'de'));
  rebuildAccents(loaded);
  replaceNotes(loaded);
}
async function saveConflictCopy(filename, text){
  const dir = await dirHandle.getDirectoryHandle('Konflikte', { create:true });
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const fh = await dir.getFileHandle(filename.replace(/\.md$/, '.'+stamp+'.md'), { create:true });
  const wr = await fh.createWritable();
  await wr.write(text);
  await wr.close();
}
/* neue Datei zuerst schreiben, alte erst danach entfernen – nie eine Notiz verlieren */
async function renameNoteFile(note, newFilename){
  let conflict = false;
  const oldName = note.filename;
  try{
    const oldHandle = await dirHandle.getFileHandle(oldName);
    const existing = await oldHandle.getFile();
    if (note.fileMtime && existing.lastModified > note.fileMtime + 1500){
      await saveConflictCopy(oldName, await existing.text());
      conflict = true;
    }
  }catch(e){}
  note.filename = newFilename;
  note.fileMtime = null;
  await writeNoteFile(note);
  try{ await dirHandle.removeEntry(oldName); }catch(e){}
  return conflict;
}
async function writeNoteFile(note){
  if (fsMode !== 'fs' || !dirHandle) return false;
  const handle = await dirHandle.getFileHandle(note.filename, { create:true });
  let conflict = false;
  if (note.fileMtime){
    try{
      const existing = await handle.getFile();
      if (existing.lastModified > note.fileMtime + 1500){
        await saveConflictCopy(note.filename, await existing.text());
        conflict = true;
      }
    }catch(e){}
  }
  const writable = await handle.createWritable();
  await writable.write(noteToMarkdown(note));
  await writable.close();
  try{ note.fileMtime = (await handle.getFile()).lastModified; }catch(e){}
  return conflict;
}
const folderErrorMsg = () => 'Ordnerzugriff nicht möglich. Das kann an einer eingebetteten Vorschau liegen – öffne die Seite dazu einmal direkt in einem eigenen Browser-Tab.';

async function connectFolder(){
  try{
    dirHandle = await window.showDirectoryPicker({ mode:'readwrite' });
    await idbSetMeta('dirHandle', dirHandle);
    await loadNotesFromFolder();
    fsMode = 'fs';
    renderDeck(); updateFolderStatus();
  }catch(err){
    if (err && err.name === 'AbortError') return;
    updateFolderStatus(folderErrorMsg());
  }
}
async function tryRestoreFolder(){
  try{
    const handle = await idbGetMeta('dirHandle');
    if (!handle) return false;
    dirHandle = handle;
    const perm = await handle.queryPermission({ mode:'readwrite' });
    if (perm === 'granted'){ await loadNotesFromFolder(); fsMode = 'fs'; return true; }
    return 'needs-permission';
  }catch(e){ return false; }
}
async function reconnectFolder(){
  try{
    const perm = await dirHandle.requestPermission({ mode:'readwrite' });
    if (perm !== 'granted'){ updateFolderStatus(); return; }
    await loadNotesFromFolder();
    fsMode = 'fs';
    renderDeck(); updateFolderStatus();
  }catch(e){ updateFolderStatus(folderErrorMsg()); }
}
function disconnectFolder(){
  dirHandle = null; fsMode = 'none';
  idbSetMeta('dirHandle', null).catch(()=>{});
  $('#folderMenu').hidden = true;
  updateFolderStatus();
}
async function reloadFolder(){
  if (editorView.classList.contains('active') && editorIsDirty()){
    const ok = await confirmDialog('Der Editor hat ungespeicherte Änderungen. Trotzdem neu einlesen?', 'Neu einlesen');
    if (!ok) return;
    closeEditor();
  }
  const keep = notes[curIdx] && notes[curIdx].filename;
  try{ await loadNotesFromFolder(); }
  catch(err){ toast('Neu einlesen fehlgeschlagen.'); return; }
  const i = notes.findIndex(n => n.filename === keep);
  curIdx = i >= 0 ? i : 0;
  renderDeck();
  if (reading){ if (notes[curIdx]) renderSheet(); else closeNote(); }
  toast(notes.length + ' Notiz' + (notes.length === 1 ? '' : 'en') + ' neu eingelesen.');
}
function updateFolderStatus(errorMsg){
  const dot = $('#folderDot'), text = $('#folderStatusText');
  const bConnect = $('#folderConnect'), bReconnect = $('#folderReconnect');
  const bBulk = $('#folderBulkImport'), bDisconnect = $('#folderDisconnect'), bReload = $('#folderReload');
  [bConnect,bReconnect,bBulk,bDisconnect,bReload].forEach(b => b.hidden = true);
  dot.className = 'dot-state';
  if (errorMsg){ text.textContent = errorMsg; dot.classList.add('warn'); bConnect.hidden = !hasFSAccess; bBulk.hidden = false; return; }
  if (!hasFSAccess){
    text.textContent = fsMode === 'idb'
      ? 'Firefox/Safari-Modus: '+notes.length+' Notiz(en) im Browser-Speicher dieses Geräts. Zusätzlich über „⎙ → Markdown exportieren" sichern.'
      : 'Kein Live-Ordnerzugriff in diesem Browser. Ordner einmalig einlesen – Speichern läuft dann über den Browser-Speicher plus manuellen Export.';
    bBulk.hidden = false; return;
  }
  if (fsMode === 'fs'){
    text.textContent = 'Verbunden: „'+(dirHandle ? dirHandle.name : '…')+'" – Notizen werden direkt als .md-Dateien gespeichert.';
    dot.classList.add('on'); bDisconnect.hidden = false; bReload.hidden = false; return;
  }
  if (dirHandle){
    text.textContent = 'Zuletzt verbunden: „'+dirHandle.name+'" – Berechtigung erneut bestätigen.';
    dot.classList.add('warn'); bReconnect.hidden = false; return;
  }
  text.textContent = 'Noch kein Ordner verbunden – Notizen liegen nur im Speicher dieser Sitzung.';
  bConnect.hidden = false;
}

$('#folderBulkImport').addEventListener('click', () => { $('#folderMenu').hidden = true; $('#bulkImportInput').click(); });
$('#folderReload').addEventListener('click', () => { $('#folderMenu').hidden = true; reloadFolder(); });
$('#folderDisconnect').addEventListener('click', disconnectFolder);
$('#bulkImportInput').addEventListener('change', async () => {
  const input = $('#bulkImportInput');
  const files = Array.from(input.files).filter(f => f.name.toLowerCase().endsWith('.md'));
  const loaded = [];
  for (const file of files){
    try{ loaded.push(parseMarkdownFile(await file.text(), file.name, file.lastModified)); }catch(e){}
  }
  if (loaded.length){
    loaded.sort((a,b)=>a.title.localeCompare(b.title,'de'));
    rebuildAccents(loaded);
    replaceNotes(loaded);
    for (const n of loaded){ try{ await idbPutNote(n); }catch(e){} }
    fsMode = 'idb';
    renderDeck();
  }
  updateFolderStatus();
  input.value = '';
});
async function initStorage(){
  if (hasFSAccess){
    const restored = await tryRestoreFolder();
    if (restored === true) renderDeck();
    updateFolderStatus();
    return;
  }
  try{
    const cached = await idbGetAllNotes();
    if (cached && cached.length){
      cached.sort((a,b)=>a.title.localeCompare(b.title,'de'));
      rebuildAccents(cached);
      replaceNotes(cached);
      fsMode = 'idb';
      renderDeck();
    }
  }catch(e){}
  updateFolderStatus();
}

/* ───────── Dialog & Toast ───────── */
let confirmResolve = null;
function confirmDialog(text, okLabel='In den Papierkorb'){
  return new Promise(resolve => {
    confirmResolve = resolve;
    $('#confirmText').textContent = text;
    $('#confirmOk').textContent = okLabel;
    $('#confirmOverlay').hidden = false;
  });
}
function closeConfirm(result){
  $('#confirmOverlay').hidden = true;
  if (confirmResolve){ const r = confirmResolve; confirmResolve = null; r(result); }
}
$('#confirmOk').addEventListener('click', () => closeConfirm(true));
$('#confirmCancel').addEventListener('click', () => closeConfirm(false));
$('#confirmOverlay').addEventListener('click', e => { if (e.target.id === 'confirmOverlay') closeConfirm(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#confirmOverlay').hidden) closeConfirm(false);
});
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ───────── Löschen ───────── */
async function moveFileToTrash(n){
  const trashDir = await dirHandle.getDirectoryHandle('Papierkorb', { create:true });
  const fh = await trashDir.getFileHandle(n.filename, { create:true });
  const wr = await fh.createWritable();
  await wr.write(noteToMarkdown(n));
  await wr.close();
  await dirHandle.removeEntry(n.filename);
}
$('#delBtn').addEventListener('click', async () => {
  const n = notes[curIdx];
  if (!n) return;
  const ok = await confirmDialog('„'+n.title+'" in den Papierkorb verschieben?');
  if (!ok) return;
  try{
    if (fsMode === 'fs' && dirHandle && n.filename) await moveFileToTrash(n);
    else if (fsMode === 'idb' && n.filename) await idbMoveToTrash(n);
  }catch(err){
    toast('Verschieben fehlgeschlagen – Notiz bleibt erhalten.');
    return;
  }
  const idx = curIdx;
  notes.splice(idx, 1);
  notes.forEach((x,i) => x.id = i);       /* ids sind Array-Positionen */
  renderDeck();
  WB.melden('noteos', { was:'geloescht' });
  if (!notes.length){ closeNote(); }
  else {
    curIdx = Math.min(idx, notes.length - 1);
    if (reading) renderSheet();
  }
  toast(fsMode === 'fs'
    ? '„'+n.title+'" liegt jetzt im Ordner „Papierkorb".'
    : '„'+n.title+'" in den Papierkorb verschoben.');
});

/* ───────── Start ───────── */
renderDeck();
updateTagBtn();
initStorage();
const startHash = /^#n(\d+)$/.exec(location.hash);
if (startHash && notes[+startHash[1]]){
  history.replaceState(null, '', location.pathname + location.search);
  requestAnimationFrame(() => openNote(+startHash[1]));
}
})();
</script>
