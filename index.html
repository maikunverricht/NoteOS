/* ───────── Import ───────── */
function loadScript(src){
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="'+src+'"]')){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
}
async function loadPdfJs(){
  if (window.pdfjsLib) return window.pdfjsLib;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/';
  const mod = await import(base + 'pdf.min.mjs');
  mod.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
  window.pdfjsLib = mod;
  return mod;
}
async function loadMammoth(){
  if (window.mammoth) return window.mammoth;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js');
  return window.mammoth;
}
async function extractPdfText(file){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const paragraphs = [];
  for (let i=1; i<=doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    const text = tc.items.map(it => it.str).join(' ').replace(/\s+/g,' ').trim();
    if (text) paragraphs.push(escLead(mdEsc(text)));
  }
  return contentToHtml(paragraphs.length ? paragraphs : ['(Kein Text im PDF gefunden – evtl. ein gescanntes Dokument ohne Textebene.)']);
}
async function extractDocxHtml(file){
  const m = await loadMammoth();
  return (await m.convertToHtml({ arrayBuffer: await file.arrayBuffer() })).value;
}
importInput.addEventListener('change', () => {
  const file = importInput.files[0]; if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const titleGuess = file.name.replace(/\.[^.]+$/, '');
  if (ext === 'txt' || ext === 'md'){
    const reader2 = new FileReader();
    reader2.onload = () => {
      const roh = String(reader2.result);
      const lines = ext === 'md' ? bodyToLines(roh.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, ''))
                                 : roh.split(/\r?\n+/).map(l => l.trim()).filter(Boolean).map(l => escLead(mdEsc(l)));
      openEditor({ title:titleGuess, bodyHtml:contentToHtml(lines.length ? lines : ['']), source:file.name });
    };
    reader2.readAsText(file);
  } else if (ext === 'msg' || ext === 'eml'){
    MAIL.lies(file).then(m => openEditor({ ...mailZuNotiz(m, file.name), category:'E-Mail' }))
      .catch(() => toast('„'+file.name+'“ ließ sich nicht lesen.'));
  } else if (ext === 'pdf' || ext === 'docx'){
    openEditor({ title:titleGuess, bodyHtml:'<p><em>'+ext.toUpperCase()+' wird eingelesen …</em></p>', source:file.name });
    const myToken = importToken;
    (ext === 'pdf' ? extractPdfText(file) : extractDocxHtml(file))
      .then(html => { if (importToken !== myToken) return; editorBody.innerHTML = html || '<p></p>'; editorSnapshot = snapshotEditor(); })
      .catch(() => {
        if (importToken !== myToken) return;
        editorBody.innerHTML = '<p><em>Extraktion fehlgeschlagen – die '+(ext==='pdf'?'pdf.js':'mammoth.js')+'-Bibliothek konnte nicht geladen werden (evtl. blockiert durch diese Vorschau) oder die Datei ist beschädigt. Inhalt bitte manuell einfügen.</em></p>';
        editorSnapshot = snapshotEditor();
      });
  } else {
    openEditor({ title:titleGuess, bodyHtml:'<p><em>Dateityp nicht unterstützt.</em></p>', source:file.name });
  }
  importInput.value = '';
});

/* ───────── E-Mails: Outlook (.msg) und .eml lesen ─────────
   Ohne Bibliothek aus dem Netz: .msg ist ein OLE-Verbunddokument (CFB),
   .eml reines MIME. Beide werden zu { betreff, von, an, cc, datum, text,
   anhaenge } – daraus entsteht die Notiz mit Kopfzeilen als Meta-Block. */
const MAIL = (() => {
  const u16 = (v, o) => v.getUint16(o, true), u32 = (v, o) => v.getUint32(o, true);
  const ENDE = 0xFFFFFFFE, FREI = 0xFFFFFFFF;

  function cfb(buf){
    const v = new DataView(buf), b = new Uint8Array(buf);
    if (u32(v, 0) !== 0xE011CFD0 || u32(v, 4) !== 0xE11AB1A1) throw new Error('keine Outlook-Datei');
    const ss = 1 << u16(v, 30), ms = 1 << u16(v, 32), cutoff = u32(v, 56);
    const secs = Math.floor((b.length - ss) / ss);
    const off = id => (id + 1) * ss;
    /* FAT-Sektoren aus der DIFAT sammeln */
    const fatIds = [];
    for (let i = 0; i < 109; i++){ const id = u32(v, 76 + i * 4); if (id < secs) fatIds.push(id); }
    let d = u32(v, 68), dn = 0;
    while (d < secs && dn++ < secs){
      for (let i = 0; i < ss / 4 - 1; i++){ const id = u32(v, off(d) + i * 4); if (id < secs) fatIds.push(id); }
      d = u32(v, off(d) + ss - 4);
    }
    const fat = new Uint32Array(fatIds.length * ss / 4);
    fatIds.forEach((id, k) => { for (let i = 0; i < ss / 4; i++) fat[k * ss / 4 + i] = u32(v, off(id) + i * 4); });
    function kette(start, tab, max){
      const out = [], seen = new Set();
      for (let s = start; s !== ENDE && s !== FREI && s < max; s = tab[s]){
        if (seen.has(s)) break;                     /* Ringe in kaputten Dateien */
        seen.add(s); out.push(s);
      }
      return out;
    }
    function lesen(start, size){
      const out = new Uint8Array(size); let p = 0;
      for (const s of kette(start, fat, secs)){
        const n = Math.min(ss, size - p); if (n <= 0) break;
        out.set(b.subarray(off(s), off(s) + n), p); p += n;
      }
      return out.subarray(0, p);
    }
    /* Verzeichnis */
    const dirRoh = lesen(u32(v, 48), kette(u32(v, 48), fat, secs).length * ss);
    const dv = new DataView(dirRoh.buffer, dirRoh.byteOffset, dirRoh.byteLength);
    const eintraege = [];
    for (let o = 0; o + 128 <= dirRoh.length; o += 128){
      const nl = Math.min(64, u16(dv, o + 64));
      let name = '';
      for (let i = 0; i + 2 < nl; i += 2) name += String.fromCharCode(u16(dv, o + i));
      eintraege.push({ name, typ:dirRoh[o + 66], l:u32(dv, o + 68), r:u32(dv, o + 72), c:u32(dv, o + 76),
                       start:u32(dv, o + 116), size:u32(dv, o + 120) });
    }
    const root = eintraege[0];
    const miniStrom = lesen(root.start, root.size);
    const mfIds = kette(u32(v, 60), fat, secs);
    const mfat = new Uint32Array(mfIds.length * ss / 4);
    mfIds.forEach((id, k) => { for (let i = 0; i < ss / 4; i++) mfat[k * ss / 4 + i] = u32(v, off(id) + i * 4); });
    function strom(e){
      if (e.size >= cutoff) return lesen(e.start, e.size);
      const out = new Uint8Array(e.size); let p = 0;
      for (const s of kette(e.start, mfat, Math.floor(miniStrom.length / ms))){
        const n = Math.min(ms, e.size - p); if (n <= 0) break;
        out.set(miniStrom.subarray(s * ms, s * ms + n), p); p += n;
      }
      return out.subarray(0, p);
    }
    function kinder(e){
      const out = [], seen = new Set(), stapel = [e.c];
      while (stapel.length){
        const i = stapel.pop();
        if (i >= eintraege.length || seen.has(i)) continue;
        seen.add(i); const k = eintraege[i]; out.push(k); stapel.push(k.l, k.r);
      }
      return out;
    }
    return { root, kinder, strom };
  }

  const utf16 = a => new TextDecoder('utf-16le').decode(a).replace(/\0+$/, '');
  function dekodiere(bytes, cs){
    try { return new TextDecoder(cs || 'utf-8').decode(bytes); }
    catch(e){ return new TextDecoder('windows-1252').decode(bytes); }
  }
  const CP_FEST = { 65001:'utf-8', 28591:'iso-8859-1', 28592:'iso-8859-2', 28605:'iso-8859-15', 20127:'us-ascii',
                    932:'shift_jis', 936:'gbk', 949:'euc-kr', 950:'big5', 20866:'koi8-r', 50220:'iso-2022-jp', 51932:'euc-jp' };
  const CP = new Proxy({}, { get:(o, cp) => CP_FEST[cp] || ((cp >= 1250 && cp <= 1258) || +cp === 874 ? 'windows-'+cp : undefined) });

  function msg(buf){
    const { root, kinder, strom } = cfb(buf);
    function props(storage){
      const p = {}, ansi = {};
      let roh = null;
      for (const k of kinder(storage)){
        const m = /^__substg1\.0_([0-9A-F]{4})([0-9A-F]{4})$/i.exec(k.name);
        if (m && k.typ === 2){
          const id = m[1].toUpperCase(), typ = m[2].toUpperCase();
          if (typ === '001F') p[id] = utf16(strom(k));
          else if (typ === '001E') ansi[id] = strom(k);
          else if (typ === '0102') p[id + ':bin'] = strom(k);
        }
        if (k.name === '__properties_version1.0' && k.typ === 2) roh = strom(k);
      }
      return { p, ansi, roh };
    }
    const top = props(root);
    /* Feste Eigenschaften (Datum, Codepage) stehen im Eigenschaftenstrom. */
    const fest = {};
    if (top.roh){
      const v = new DataView(top.roh.buffer, top.roh.byteOffset, top.roh.byteLength);
      for (let o = 32; o + 16 <= top.roh.length; o += 16){
        const typ = u16(v, o), id = u16(v, o + 2);
        if (typ === 0x0040) fest[id] = Number(v.getBigUint64(o + 8, true));
        else if (typ === 0x0003) fest[id] = u32(v, o + 8);
      }
    }
    /* ANSI-Texte stehen in der Windows-Codepage des Absendersystems. */
    const LCID_CP = { 1041:932, 2052:936, 4100:936, 1042:949, 1028:950, 3076:950, 1049:1251, 1058:1251, 1026:1251,
                      1045:1250, 1029:1250, 1038:1250, 1051:1250, 1060:1250, 1032:1253, 1055:1254, 1037:1255, 1025:1256 };
    const cs = CP[fest[0x3FFD]] || CP[LCID_CP[fest[0x3FF1]]] || 'windows-1252';
    const t = id => top.p[id] != null ? top.p[id] : top.ansi[id] ? dekodiere(top.ansi[id], cs).replace(/\0+$/, '') : '';
    const ft = fest[0x0039] || fest[0x0E06] || fest[0x3007];
    const datum = ft ? new Date(ft / 10000 - 11644473600000) : null;
    let text = t('1000');
    if (!text.trim() && top.p['1013:bin']) text = htmlZuText(dekodiere(top.p['1013:bin'], CP[fest[0x3FDE]] || 'utf-8'));
    const senderMail = ['5D01', '0065', '0C1F', '0076'].map(t).find(x => /@/.test(x)) || '';
    const anhaenge = kinder(root).filter(k => /^__attach_version1\.0_#/i.test(k.name)).map(a => {
      const q = props(a);
      const tt = id => q.p[id] != null ? q.p[id] : q.ansi[id] ? dekodiere(q.ansi[id], cs).replace(/\0+$/, '') : '';
      return tt('3707') || tt('3704') || tt('3001');
    }).filter(Boolean);
    return {
      betreff: t('0037') || t('0E1D'),
      von: [t('0C1A') || t('0042'), senderMail].filter(Boolean),
      an: t('0E04'), cc: t('0E03'), datum, text, anhaenge
    };
  }

  /* ── MIME ── */
  function wortDekodieren(s){
    return String(s || '').replace(/\?=\s+=\?/g, '?==?').replace(/=\?([^?]+)\?([bqBQ])\?([^?]*)\?=/g, (all, cs, enc, txt) => {
      try {
        const bytes = enc.toUpperCase() === 'B'
          ? Uint8Array.from(atob(txt.replace(/\s/g, '')), c => c.charCodeAt(0))
          : qpBytes(txt.replace(/_/g, ' '));
        return dekodiere(bytes, cs.split('*')[0]);
      } catch(e){ return all; }
    });
  }
  function qpBytes(s){
    const out = [];
    s = s.replace(/=\r?\n/g, '');
    for (let i = 0; i < s.length; i++){
      if (s[i] === '=' && /^[0-9A-F]{2}$/i.test(s.substr(i + 1, 2))){ out.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
      else { const c = s.charCodeAt(i); out.push(c < 256 ? c : 63); }
    }
    return new Uint8Array(out);
  }
  function teil(roh){
    const trenn = roh.search(/\r?\n\r?\n/);
    const kopfRoh = trenn < 0 ? roh : roh.slice(0, trenn);
    const koerper = trenn < 0 ? '' : roh.slice(trenn).replace(/^\r?\n\r?\n/, '');
    const kopf = {};
    kopfRoh.replace(/\r?\n[ \t]+/g, ' ').split(/\r?\n/).forEach(z => {
      const i = z.indexOf(':'); if (i < 1) return;
      const k = z.slice(0, i).trim().toLowerCase();
      if (!(k in kopf)) kopf[k] = z.slice(i + 1).trim();
    });
    return { kopf, koerper };
  }
  function param(h, n){
    const m = new RegExp(n + '(\\*)?=\\s*"?([^";]+)"?', 'i').exec(h || '');
    if (!m) return '';
    const r = /^([^']*)'[^']*'(.*)$/.exec(m[2]);              /* RFC 2231: utf-8''K%C3%BCche.pdf */
    if (m[1] && r){
      try { return dekodiere(qpBytes(r[2].replace(/%/g, '=')), r[1] || 'utf-8'); } catch(e){}
    }
    return m[2];
  }
  function inhalt(t){
    const enc = (t.kopf['content-transfer-encoding'] || '').toLowerCase();
    const cs = param(t.kopf['content-type'], 'charset') || 'utf-8';
    let bytes;
    if (enc === 'base64'){
      try { bytes = Uint8Array.from(atob(t.koerper.replace(/[^A-Za-z0-9+/=]/g, '')), c => c.charCodeAt(0)); }
      catch(e){ bytes = new Uint8Array(0); }
    } else if (enc === 'quoted-printable') bytes = qpBytes(t.koerper);
    else bytes = Uint8Array.from(t.koerper, c => c.charCodeAt(0) & 255);
    return dekodiere(bytes, cs);
  }
  function eml(buf){
    const roh = new TextDecoder('latin1').decode(buf);       /* Bytes 1:1, Zeichensatz je Teil */
    const top = teil(roh);
    let plain = '', html = '';
    const anhaenge = [];
    (function lauf(t, tiefe){
      if (tiefe > 12) return;
      const ct = (t.kopf['content-type'] || 'text/plain').toLowerCase();
      const disp = t.kopf['content-disposition'] || '';
      const name = wortDekodieren(param(disp, 'filename') || param(t.kopf['content-type'], 'name'));
      if (ct.startsWith('multipart/')){
        const grenze = param(t.kopf['content-type'], 'boundary');
        if (!grenze) return;
        const stuecke = t.koerper.split('--' + grenze);
        stuecke.slice(1).forEach(s => { if (!/^--/.test(s)) lauf(teil(s.replace(/^\r?\n/, '')), tiefe + 1); });
        return;
      }
      if (/attachment/i.test(disp) || (name && !ct.startsWith('text/'))){ anhaenge.push(name || ct); return; }
      if (ct.startsWith('text/plain') && !plain) plain = inhalt(t);
      else if (ct.startsWith('text/html') && !html) html = inhalt(t);
    })(top, 0);
    const k = top.kopf;
    const datum = k.date ? new Date(k.date) : null;
    return {
      betreff: wortDekodieren(k.subject), von: [wortDekodieren(k.from)].filter(Boolean),
      an: wortDekodieren(k.to), cc: wortDekodieren(k.cc),
      datum: datum && !isNaN(datum) ? datum : null,
      text: plain.trim() ? plain : htmlZuText(html), anhaenge
    };
  }

  function htmlZuText(h){
    if (!h) return '';
    const doc = new DOMParser().parseFromString(h, 'text/html');
    doc.querySelectorAll('script,style,head,title').forEach(x => x.remove());
    doc.querySelectorAll('br').forEach(x => x.replaceWith('\n'));
    doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4,blockquote').forEach(x => x.append('\n'));
    return (doc.body ? doc.body.textContent : '').replace(/ /g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
  }

  async function lies(file){
    const buf = await file.arrayBuffer();
    const kopf = new Uint8Array(buf.slice(0, 4));
    return (kopf[0] === 0xD0 && kopf[1] === 0xCF) ? msg(buf) : eml(buf);
  }
  return { lies, htmlZuText };
})();

/* Aus einer gelesenen Mail die Felder für den Editor bauen. */
function mailZuNotiz(m, dateiname){
  const zeilen = [];
  const meta = (k, w) => { if (w && String(w).trim()) zeilen.push('**'+k+':** '+mdEsc(String(w).trim())); };
  const von = m.von.length === 2 && m.von[0] !== m.von[1] ? m.von[0]+' <'+m.von[1]+'>' : (m.von[0] || '');
  meta('Von', von);
  meta('An', m.an);
  meta('Cc', m.cc);
  if (m.datum) meta('Datum', m.datum.toLocaleString('de-DE', { dateStyle:'full', timeStyle:'short' }));
  if (m.anhaenge.length) meta('Anhänge', m.anhaenge.join(', '));
  if (zeilen.length) zeilen.push('---');
  const absaetze = String(m.text || '').replace(/\r\n?/g, '\n').split(/\n\s*\n/)
    .map(a => a.split('\n').map(z => mdEsc(z.trim())).filter(Boolean).join('<br>'))
    .filter(Boolean).map(escLead);
  return {
    title: (m.betreff || '').trim() || (dateiname ? dateiname.replace(/\.[^.]+$/, '') : 'E-Mail'),
    bodyHtml: contentToHtml(zeilen.concat(absaetze.length ? absaetze : ['(Kein Text in der E-Mail gefunden.)'])),
    source: dateiname || 'E-Mail'
  };
}

/* ───────── Ablegen: E-Mails per Drag & Drop ─────────
   Outlook (Chrome/Edge unter Windows) liefert beim Ziehen eine .msg-Datei,
   andere Programme .eml oder nur Text. Wo losgelassen wird, bestimmt die
   Werte: Zelle der Würfel-Tafel oder Zelle im 3D-Würfel → Status,
   Priorität, Person dieser Zelle; sonst die aktuelle Filteransicht. */
const ablageHinweis = document.createElement('div');
ablageHinweis.className = 'ablage';
ablageHinweis.innerHTML = '<div class="ablage-k">✉ <span>E-Mail ablegen</span><small></small></div>';
document.body.appendChild(ablageHinweis);
let ablageTiefe = 0, eigenerZug = false, ablageEl = null;
document.addEventListener('dragstart', () => { eigenerZug = true; });
document.addEventListener('dragend', () => { eigenerZug = false; });
const istAblage = e => !eigenerZug && e.dataTransfer &&
  Array.from(e.dataTransfer.types || []).some(t => t === 'Files' || t === 'text/plain' || t === 'text/html');

function ablageZiel(x, y){
  const ziel = { category:'E-Mail', tags:[...activeTags], status:'offen', prio:'mittel', person:'' };
  if (activeCategory && activeCategory !== 'E-Mail' && !ziel.tags.includes(activeCategory)) ziel.tags.push(activeCategory);
  ['status','prio','person'].forEach(a => { if (activeMerk[a].size === 1) ziel[ACHSEN[a].feld] = [...activeMerk[a]][0]; });
  let el = null, text = activeCategory || activeTags.size || merkAnzahl() ? 'in die gefilterte Ansicht' : 'als neue Notiz';
  if (viewMode === 'wuerfel' && !editorView.classList.contains('active')){
    const unter = document.elementFromPoint(x, y);
    const e3 = wfE();
    const zelle = unter && unter.closest('.wf-cell, .cube-g i[data-s]');
    const ebeneEl = unter && unter.closest('.cube-l, .cube-ll');
    let ebene = wf.ebene;
    if (ebeneEl && ebeneEl.dataset.ebene !== undefined && ebeneEl.dataset.ebene !== '*') ebene = ebeneEl.dataset.ebene;
    if (ebene !== null) ziel[ACHSEN[e3].feld] = ebene;
    if (zelle){
      el = zelle;
      ziel[ACHSEN[wf.s].feld] = zelle.dataset.s;
      ziel[ACHSEN[wf.z].feld] = zelle.dataset.z;
    } else if (ebeneEl) el = ebeneEl;
    if (zelle || ebene !== null){
      text = [zelle ? wertLabel(wf.s, zelle.dataset.s) : '', zelle ? wertLabel(wf.z, zelle.dataset.z) : '',
              ebene !== null ? wertLabel(e3, ebene) : ''].filter(Boolean).join(' · ');
    }
  }
  return { ziel, el, text };
}
function ablageMarkieren(el){
  if (ablageEl === el) return;
  if (ablageEl) ablageEl.classList.remove('ablage-ziel');
  ablageEl = el;
  if (el) el.classList.add('ablage-ziel');
}
function ablageEnde(){
  ablageTiefe = 0; ablageHinweis.classList.remove('on'); ablageMarkieren(null);
}
document.addEventListener('dragenter', e => {
  if (!istAblage(e)) return;
  e.preventDefault(); ablageTiefe++;
  ablageHinweis.classList.add('on');
});
document.addEventListener('dragover', e => {
  if (!istAblage(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  const { el, text } = ablageZiel(e.clientX, e.clientY);
  ablageMarkieren(el);
  ablageHinweis.querySelector('small').textContent = text;
});
document.addEventListener('dragleave', e => {
  if (!istAblage(e)) return;
  if (--ablageTiefe <= 0) ablageEnde();
});
document.addEventListener('drop', async e => {
  if (!istAblage(e)) { eigenerZug = false; return; }
  e.preventDefault();
  const { ziel } = ablageZiel(e.clientX, e.clientY);
  ablageEnde();
  if (editorView.classList.contains('active')){ toast('Erst die offene Notiz speichern oder verwerfen.'); return; }
  if (!darfSchreiben()) return;
  const dt = e.dataTransfer;
  const dateien = Array.from(dt.files || []);
  const mail = dateien.find(f => /\.(msg|eml)$/i.test(f.name) || f.type === 'message/rfc822' || f.type === 'application/vnd.ms-outlook');
  if (mail){
    try {
      const m = await MAIL.lies(mail);
      openEditor({ ...mailZuNotiz(m, mail.name), ...ziel });
      if (dateien.length > 1) toast('Nur die erste von '+dateien.length+' Dateien übernommen.');
    } catch(err){
      toast('„'+mail.name+'“ ließ sich nicht lesen.');
    }
    return;
  }
  if (dateien.length){
    const f = dateien[0];
    if (/\.(txt|md|pdf|docx)$/i.test(f.name)){
      const d = new DataTransfer(); d.items.add(f);
      importInput.files = d.files;
      importInput.dispatchEvent(new Event('change'));
    } else toast('Dateityp nicht unterstützt: '+f.name);
    return;
  }
  /* Nur Text – z. B. markierter Ausschnitt aus einer Mail */
  const html = dt.getData('text/html');
  const text = (dt.getData('text/plain') || (html ? MAIL.htmlZuText(html) : '')).trim();
  if (!text){ toast('Hier kam nichts Lesbares an. In Outlook die Mail selbst ziehen oder als .msg speichern.'); return; }
  const erste = text.split(/\r?\n/).find(z => z.trim()) || 'E-Mail';
  openEditor({ ...mailZuNotiz({ betreff:erste.trim().slice(0, 90), von:[], an:'', cc:'', datum:null, text, anhaenge:[] }, ''),
               source:'Abgelegter Text', ...ziel });
});

/* ───────── HTML → Markdown ─────────
   Der Editor liefert, was der Browser will: Text und <b> lose vor dem
   ersten <div>, Listen in <div> verpackt, <div><br></div> für eine
   Leerzeile, beim Einfügen <span style="font-weight:700">. Alles davon
   wird hier zu sauberem Markdown – lose Inline-Teile werden zu einem
   Absatz gesammelt, statt jeden für sich auf eine Zeile zu stellen. */
const MD_BLOCK = new Set(['P','DIV','H1','H2','H3','H4','H5','H6','UL','OL','LI','BLOCKQUOTE','PRE','HR',
  'TABLE','THEAD','TBODY','TR','SECTION','ARTICLE','HEADER','FOOTER','FIGURE']);
const isBlockEl = n => n && n.nodeType === 1 && MD_BLOCK.has(n.tagName);
const mdEsc = t => String(t).replace(/[\t\n\r ]+/g,' ').replace(/ /g,' ').replace(/[\\*~`\[\]<]/g,'\\$&');
const trimBr = s => String(s).replace(/^(\s|<br>)+|(\s|<br>)+$/g,'');
function inlineNode(c){
  if (c.nodeType === 3) return mdEsc(c.textContent);
  if (c.nodeType !== 1) return '';
  const tag = c.tagName;
  if (tag === 'BR') return '<br>';
  if (tag === 'IMG' || tag === 'SCRIPT' || tag === 'STYLE') return '';
  if (tag === 'CODE' || tag === 'KBD') { const t = c.textContent.replace(/`/g,''); return t ? '`'+t+'`' : ''; }
  const inner = inlineToMd(c);
  if (tag === 'A'){
    const h = (c.getAttribute('href') || '').replace(/[()\s]/g, m => m === '(' ? '%28' : m === ')' ? '%29' : '%20');
    return inner.trim() ? '['+inner+']('+h+')' : inner;
  }
  const st = c.style || {};
  const deko = String(st.textDecorationLine || st.textDecoration || '');
  const fett = tag === 'B' || tag === 'STRONG' || /^(bold|bolder|[6-9]00)$/.test(String(st.fontWeight || ''));
  const kurs = tag === 'I' || tag === 'EM' || st.fontStyle === 'italic';
  const unter = tag === 'U' || tag === 'INS' || /underline/.test(deko);
  const durch = tag === 'S' || tag === 'STRIKE' || tag === 'DEL' || /line-through/.test(deko);
  const mark = tag === 'MARK';
  if (!(fett || kurs || unter || durch || mark)) return inner;
  /* Leerzeichen gehören vor bzw. hinter die Marken, nicht hinein. */
  const m = /^((?:\s|<br>)*)([\s\S]*?)((?:\s|<br>)*)$/.exec(inner);
  let core = m[2];
  if (!core) return inner;
  if (durch) core = '~~'+core+'~~';
  if (unter) core = '<u>'+core+'</u>';
  if (kurs) core = '*'+core+'*';
  if (fett) core = '**'+core+'**';
  if (mark) core = '<mark>'+core+'</mark>';
  return m[1] + core + m[3];
}
function inlineToMd(node){
  let out = '';
  node.childNodes.forEach(c => { out += isBlockEl(c) ? (out ? '<br>' : '') + blockInline(c) : inlineNode(c); });
  return out;
}
/* Ein Block als eine Zeile – innere Absätze werden zu <br>. */
function blockInline(n){
  const parts = [];
  let buf = '';
  n.childNodes.forEach(c => {
    if (isBlockEl(c)){ if (trimBr(buf)) parts.push(buf); buf = ''; parts.push(blockInline(c)); }
    else buf += inlineNode(c);
  });
  if (trimBr(buf)) parts.push(buf);
  return parts.map(trimBr).filter(Boolean).join('<br>');
}
/* Ein Absatz darf nicht wie ein Blockzeichen anfangen, sonst wird er beim
   nächsten Öffnen zur Überschrift oder Liste. */
function escLead(t){
  if (/^\d+[.)]\s/.test(t)) return t.replace(/^(\d+)([.)])/, '$1\\$2');
  if (/^(#{1,6}\s|[-+]\s|>|(-\s*){3,}$|&nbsp;$)/.test(t)) return '\\' + t;
  return t;
}
function htmlToMarkdown(rootEl){
  const lines = [];
  const absatz = s => { const t = trimBr(s); lines.push(t ? escLead(t) : '&nbsp;'); };
  function liste(el, lvl){
    let k = 1;
    const ord = el.tagName === 'OL';
    Array.from(el.children).forEach(li => {
      if (li.tagName === 'UL' || li.tagName === 'OL'){ liste(li, lvl + 1); return; }
      if (li.tagName !== 'LI') return;
      let txt = '';
      const unter = [];
      li.childNodes.forEach(c => {
        if (c.nodeType === 1 && (c.tagName === 'UL' || c.tagName === 'OL')) unter.push(c);
        else if (isBlockEl(c)){ const b = blockInline(c); if (b) txt += (trimBr(txt) ? '<br>' : '') + b; }
        else txt += inlineNode(c);
      });
      lines.push('  '.repeat(lvl) + (ord ? (k++) + '. ' : '- ') + trimBr(txt));
      unter.forEach(u => liste(u, lvl + 1));
    });
  }
  function bloecke(parent){
    let buf = null;
    const flush = () => { if (buf !== null){ if (trimBr(buf) || /<br>/.test(buf)) absatz(buf); buf = null; } };
    parent.childNodes.forEach(n => {
      if (!isBlockEl(n)){
        const frag = inlineNode(n);
        if (buf === null && !frag.trim()) return;      /* Leerraum zwischen Blöcken */
        buf = (buf || '') + frag;
        return;
      }
      flush();
      const tag = n.tagName;
      if (/^H[1-6]$/.test(tag)){
        const t = trimBr(blockInline(n));
        if (t) lines.push('#'.repeat(Math.min(+tag[1], 4)) + ' ' + t);
      }
      else if (tag === 'UL' || tag === 'OL') liste(n, 0);
      else if (tag === 'LI'){ const t = trimBr(blockInline(n)); if (t) lines.push('- ' + t); }
      else if (tag === 'BLOCKQUOTE'){ const t = blockInline(n); if (t) lines.push('> ' + t); }
      else if (tag === 'PRE'){
        lines.push('```');
        n.textContent.replace(/\n$/,'').split('\n').forEach(l => lines.push(l.replace(/\s+$/,'')));
        lines.push('```');
      }
      else if (tag === 'HR') lines.push('---');
      else if (Array.from(n.childNodes).some(isBlockEl)) bloecke(n);
      else absatz(inlineToMd(n));
    });
    flush();
  }
  bloecke(rootEl);
  while (lines.length && lines[0] === '&nbsp;') lines.shift();
  while (lines.length && lines[lines.length-1] === '&nbsp;') lines.pop();
  return lines;
}

/* ───────── Speichern ───────── */
function savedToast(title, isNew){
  if (fsMode === 'fs') toast('„'+title+'" gespeichert.');
  else if (fsMode === 'idb') toast('„'+title+'" im Browser gesichert.');
  else toast('„'+title+(isNew ? '" angelegt' : '" geändert')+' – ohne verbundenen Ordner nur für diese Sitzung.');
}
/* Speichern als Funktion: der Knopf ruft sie, das Teilen am Cursor auch.
   Gibt die gespeicherte Notiz zurück – oder null, wenn nichts gesichert ist. */
$('#editorSave').addEventListener('click', () => { speichereEditor(); });
async function speichereEditor({ stumm = false } = {}){
  const title = editorTitle.value.trim(), category = editorCategory.value;
  if (!title || !category){ editorHint.textContent = 'Bitte Titel und Kategorie angeben.'; return null; }
  const extraTags = editorTags.value.split(',').map(t=>t.trim()).filter(Boolean).filter(t=>t!==category);
  const tags = [category, ...extraTags];
  const content = htmlToMarkdown(editorBody);
  const kanban = { status: editorStatus.value, prio: editorPrio.value, person: editorPerson.value.trim() };
  const now = new Date();
  const saveBtn = $('#editorSave');
  saveBtn.disabled = true;
  try{
    if (editingNoteId !== null){
      const n = notes[editingNoteId];
      const oldTitle = n.title, oldFilename = n.filename;
      const alteKat = n.category, alteAgb = n.agbId || null;
      n.title = title; n.category = category; n.tags = tags;
      Object.assign(n, kanban);
      /* Eine ausdrücklich gewählte Auftraggeber-Zeile bindet. Bleibt die
         Kategorie unberührt, bleibt auch die Bindung – sonst verlöre eine
         Notiz ihren Auftraggeber, nur weil der inzwischen inaktiv ist und
         deshalb nicht mehr in der Auswahlgruppe steht. */
      n.agbId = gewaehlteAgbId() || (category === alteKat ? alteAgb : null);
      n.accent = shade(colorForCategory(category), ((n.id%5)-2)*0.025);
      n.modified = fmt(now); n.modifiedSort = now.getTime();
      n.content = content.length ? content : ['(Kein Inhalt)'];
      n.source = pendingSource;
      searchCache.delete(n);

      let newFilename = oldFilename;
      if (fsMode !== 'none' && (title !== oldTitle || !newFilename)){
        const taken = new Set(notes.filter(x => x !== n).map(x => x.filename).filter(Boolean));
        newFilename = slugify(title, taken);
      }
      const renamed = !!(oldFilename && newFilename && newFilename !== oldFilename);
      let conflict = false;
      if (fsMode === 'fs'){
        if (renamed) conflict = await renameNoteFile(n, newFilename);
        else { n.filename = newFilename; conflict = await writeNoteFile(n); }
      } else if (fsMode === 'idb'){
        n.filename = newFilename;
        if (renamed) await idbRenameNote(n, oldFilename);
        else await idbPutNote(n);
      }
      closeEditor();
      renderDeck();
      if (reading) renderSheet();
      WB.melden('noteos', { was:'geaendert' });
      if (conflict) toast('„'+n.title+'" war extern geändert – fremde Fassung liegt im Ordner „Konflikte".');
      else if (stumm) {}
      else if (renamed && fsMode === 'fs') toast('Gespeichert, Datei heißt jetzt „'+newFilename+'".');
      else savedToast(n.title, false);
      return n;
    }
    const id = notes.length;
    const taken = new Set(notes.map(n => n.filename).filter(Boolean));
    const newNote = {
      id, title, category, tags, agbId: gewaehlteAgbId(), ...kanban,
      accent: shade(colorForCategory(category), ((id%5)-2)*0.025),
      created: fmt(now), createdSort: now.getTime(), modified: fmt(now), modifiedSort: now.getTime(),
      author:'Du', source: pendingSource, content: content.length ? content : ['(Kein Inhalt)'],
      filename: slugify(title, taken)
    };
    if (fsMode === 'fs') await writeNoteFile(newNote);
    else if (fsMode === 'idb') await idbPutNote(newNote);
    notes.push(newNote);
    closeEditor();
    if (activeTags.size && !newNote.tags.some(t => activeTags.has(t))){ activeTags.clear(); updateTagBtn(); }
    if (activeCategory && newNote.category !== activeCategory){ setCategoryFilter(null); }
    renderDeck();
    syncScope(newNote.id);
    landNewCard(newNote);
    WB.melden('noteos', { was:'neu' });
    if (!stumm) savedToast(newNote.title, true);
    return newNote;
  }catch(err){
    editorHint.textContent = 'Speichern fehlgeschlagen (Ordnerzugriff verloren?). Bitte Ordner-Status prüfen.';
    toast('Speichern fehlgeschlagen – Notiz nicht gesichert.');
    return null;
  }finally{
    saveBtn.disabled = false;
  }
}

/* ═══════ Notizen teilen ═══════
   Zwei Wege, beide nach „neu schreiben, dann kürzen“ – geht unterwegs
   etwas schief, liegt ein Teil höchstens doppelt vor, verloren geht nichts.
   1. Im Editor „✂ Am Cursor teilen“: alles ab dem Cursor wird eine eigene
      Notiz mit Kategorie, Tags, Status, Priorität und Person der alten.
   2. In der Leseansicht „✂“: an jeder Überschrift (H1 bzw. H1 + H2) eine
      eigene Notiz, Titel aus der Überschrift; die Vorschau zeigt vorher,
      was entsteht, und die Titel lassen sich dort noch ändern. */
async function notizAnlegen(f){
  const now = new Date();
  const id = notes.length;
  const taken = new Set(notes.map(n => n.filename).filter(Boolean));
  const n = {
    id, title:f.title, category:f.category, tags:[...new Set(f.tags || [f.category])], agbId:f.agbId || null,
    status:f.status || 'offen', prio:f.prio || 'mittel', person:f.person || '',
    accent: shade(colorForCategory(f.category), ((id%5)-2)*0.025),
    created: fmt(now), createdSort: now.getTime(), modified: fmt(now), modifiedSort: now.getTime(),
    author: f.author || 'Du', source: f.source || null,
    content: f.content && f.content.length ? f.content : ['(Kein Inhalt)'],
    filename: slugify(f.title, taken)
  };
  if (fsMode === 'fs') await writeNoteFile(n);
  else if (fsMode === 'idb') await idbPutNote(n);
  notes.push(n);
  return n;
}
/* Markdown einer Überschrift → reiner Text für den Titel */
function mdZuText(md){
  const d = document.createElement('div');
  d.innerHTML = inlineMdToHtml(md);
  return d.textContent.replace(/\s+/g,' ').trim();
}
let teilPlan = null;   /* { art:'cursor'|'ueberschrift', … } */
function teilDialog(text, zeilenHtml, okText, ebeneSichtbar){
  $('#teilText').textContent = text;
  $('#teilListe').innerHTML = zeilenHtml;
  $('#teilListe').hidden = !zeilenHtml;
  $('#teilEbene').hidden = !ebeneSichtbar;
  $('#teilOk').textContent = okText || 'Teilen';
  $('#teilOk').disabled = !zeilenHtml;
  $('#teilOverlay').hidden = false;
  const f = $('#teilListe input[type=text]');
  setTimeout(() => (f || $('#teilAbbr')).focus(), 40);
}
function teilZu(){ $('#teilOverlay').hidden = true; teilPlan = null; }
$('#teilAbbr').addEventListener('click', teilZu);
$('#teilOverlay').addEventListener('click', e => { if (e.target.id === 'teilOverlay') teilZu(); });

/* 1 · Am Cursor */
let teilCursor = null;   /* zuletzt bekannte Cursorstelle im Editor */
document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  if (sel && sel.rangeCount && editorBody.contains(sel.getRangeAt(0).startContainer)){
    const r = sel.getRangeAt(0);
    teilCursor = { node:r.startContainer, off:r.startOffset };
  }
});
$('#tbSplit').addEventListener('click', () => {
  if (!teilCursor || !editorBody.contains(teilCursor.node)){
    editorHint.textContent = 'Erst den Cursor an die Stelle im Text setzen, ab der geteilt werden soll.'; return;
  }
  if (!editorTitle.value.trim() || !editorCategory.value){
    editorHint.textContent = 'Zum Teilen braucht die Notiz zuerst Titel und Kategorie.'; return;
  }
  const r = document.createRange();
  r.setStart(teilCursor.node, teilCursor.off);
  r.setEnd(editorBody, editorBody.childNodes.length);
  const rv = document.createRange();
  rv.setStart(editorBody, 0); rv.setEnd(teilCursor.node, teilCursor.off);
  const nach = document.createElement('div'), vor = document.createElement('div');
  nach.appendChild(r.cloneContents()); vor.appendChild(rv.cloneContents());
  let zeilen = htmlToMarkdown(nach);
  if (!zeilen.length){ editorHint.textContent = 'Hinter dem Cursor steht nichts, was eine eigene Notiz werden könnte.'; return; }
  if (!htmlToMarkdown(vor).length){ editorHint.textContent = 'Vor dem Cursor steht nichts – zum Teilen den Cursor weiter nach unten setzen.'; return; }
  /* Beginnt der zweite Teil mit einer Überschrift, wird sie sein Titel. */
  const h = /^#{1,4}\s+(.*)$/.exec(zeilen[0]);
  const titel = h ? mdZuText(h[1]) : editorTitle.value.trim() + ' (Teil 2)';
  if (h) zeilen = zeilen.slice(1);
  editorHint.textContent = '';
  teilPlan = { art:'cursor', range:r, zeilen };
  teilDialog('Alles ab dem Cursor wird eine eigene Notiz – gleiche Kategorie, Tags, Status, Priorität und Person. '
    + 'Die aktuelle Notiz wird danach gekürzt gespeichert.',
    '<div class="t-zeile"><span class="t-nr">1</span><span style="flex:1;min-width:0"><b>'+esc(editorTitle.value.trim())+'</b>'
    + '<span class="t-info">bleibt · Text bis zum Cursor</span></span></div>'
    + '<div class="t-zeile"><span class="t-nr">2</span><span style="flex:1;min-width:0">'
    + '<input type="text" data-t="0" value="'+esc(titel)+'" aria-label="Titel der neuen Notiz">'
    + '<span class="t-info">neu · Text ab dem Cursor'+(h ? ', Überschrift wird zum Titel' : '')+'</span></span></div>',
    'Teilen', false);
});

/* 2 · An Überschriften */
function abschnitte(lines, tiefe){
  const re = tiefe === 2 ? /^#{1,2}\s+(.*)$/ : /^#\s+(.*)$/;
  const teile = [{ titel:null, zeilen:[] }];
  let fence = false;
  (lines || []).forEach(l => {
    if (MD_FENCE.test(l)) fence = !fence;
    const m = !fence && re.exec(l);
    if (m) teile.push({ titel:mdZuText(m[1]), kopf:l, zeilen:[] });
    else teile[teile.length-1].zeilen.push(l);
  });
  const vorspann = teile.shift();
  const echt = z => z.some(l => l.trim() && l !== '(Kein Inhalt)' && l !== '&nbsp;');
  /* Steht vor der ersten Überschrift nichts, behält die Notiz den ersten
     Abschnitt samt seiner Überschrift – sonst bliebe sie leer zurück. */
  let bleibt = vorspann.zeilen;
  if (!echt(bleibt) && teile.length){ const t = teile.shift(); bleibt = [t.kopf, ...t.zeilen]; }
  return { bleibt, neu: teile };
}
function teilVorschau(){
  const n = notes[curIdx];
  const { bleibt, neu } = abschnitte(n.content, teilPlan.tiefe);
  teilPlan.bleibt = bleibt; teilPlan.neu = neu;
  $$('#teilEbene button').forEach(b => b.classList.toggle('active', +b.dataset.ebene === teilPlan.tiefe));
  if (!neu.length){
    teilDialog('In „'+n.title+'“ gibt es keine '+(teilPlan.tiefe === 2 ? 'zweite H1- oder H2-' : 'zweite H1-')+'Überschrift, an der sich teilen ließe. '
      + 'Alternativ im Editor den Cursor setzen und „✂ Am Cursor teilen“ wählen.', '', 'Teilen', true);
    return;
  }
  teilDialog('„'+n.title+'“ wird in '+(neu.length + 1)+' Notizen aufgeteilt. Die neuen übernehmen Kategorie, Tags, Status, '
    + 'Priorität und Person; die Titel kannst du hier noch ändern.',
    '<div class="t-zeile"><span class="t-nr">1</span><span style="flex:1;min-width:0"><b>'+esc(n.title)+'</b>'
    + '<span class="t-info">bleibt · '+bleibt.length+' Zeile(n)</span></span></div>'
    + neu.map((t, i) => '<div class="t-zeile"><span class="t-nr">'+(i+2)+'</span><span style="flex:1;min-width:0">'
      + '<input type="text" data-t="'+i+'" value="'+esc(t.titel || 'Abschnitt '+(i+2))+'" aria-label="Titel">'
      + '<span class="t-info">neu · '+t.zeilen.length+' Zeile(n)</span></span></div>').join(''),
    (neu.length + 1)+' Notizen erzeugen', true);
}
$('#splitBtn').addEventListener('click', () => {
  const c = (notes[curIdx] && notes[curIdx].content) || [];
  if (!notes[curIdx]) return;
  /* Ebene vorwählen: H1, wenn es mehr als eine gibt, sonst H1 + H2 */
  teilPlan = { art:'ueberschrift', tiefe: c.filter(l => /^#\s/.test(l)).length > 1 ? 1 : 2 };
  teilVorschau();
});
$('#teilEbene').addEventListener('click', e => {
  const b = e.target.closest('button[data-ebene]');
  if (!b || !teilPlan || teilPlan.art !== 'ueberschrift') return;
  teilPlan.tiefe = +b.dataset.ebene; teilVorschau();
});
$('#teilListe').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('#teilOk').click(); } });

$('#teilOk').addEventListener('click', async () => {
  if (!teilPlan) return;
  const titel = $$('#teilListe input[type=text]').map(f => f.value.trim());
  if (titel.some(t => !t)){ toast('Jede neue Notiz braucht einen Titel.'); return; }
  const plan = teilPlan;
  $('#teilOk').disabled = true;
  try {
    if (plan.art === 'cursor'){
      const vorlage = { category:editorCategory.value, agbId:gewaehlteAgbId(),
        tags:[editorCategory.value, ...editorTags.value.split(',').map(t=>t.trim()).filter(Boolean)],
        status:editorStatus.value, prio:editorPrio.value, person:editorPerson.value.trim(), source:pendingSource };
      const neu = await notizAnlegen({ ...vorlage, title:titel[0], content:plan.zeilen });     /* erst neu … */
      teilZu();
      plan.range.deleteContents();                                                            /* … dann kürzen */
      const alt = await speichereEditor({ stumm:true });
      renderDeck();
      WB.melden('noteos', { was:'neu' });
      toast(alt ? 'Geteilt: „'+alt.title+'“ und „'+neu.title+'“.'
                : '„'+neu.title+'“ angelegt – die gekürzte Notiz ist noch nicht gespeichert.');
      return;
    }
    const n = notes[curIdx];
    const vorlage = { category:n.category, agbId:n.agbId, tags:n.tags, status:nStatus(n), prio:nPrio(n),
                      person:nPerson(n), author:n.author, source:n.source };
    const erzeugt = [];
    for (let i = 0; i < plan.neu.length; i++)
      erzeugt.push(await notizAnlegen({ ...vorlage, title:titel[i], content:plan.neu[i].zeilen }));
    teilZu();
    n.content = plan.bleibt.length ? plan.bleibt : ['(Kein Inhalt)'];
    await notizSichern(n, null);
    WB.melden('noteos', { was:'neu' });
    toast('„'+n.title+'“ in '+(erzeugt.length + 1)+' Notizen aufgeteilt.');
  } catch(err){
    toast('Teilen fehlgeschlagen – Ordnerzugriff prüfen. Die Ausgangsnotiz ist nicht gekürzt.');
    $('#teilOk').disabled = false;
  }
});

/* ═══════ Hilfe ═══════

function hilfeAuf(){

    + '<h3>Kamm bedienen</h3>'

/* ═══════ Hero-Zeile einzeilig ═══════
   Die Schrift wird so groß, wie die Breite es hergibt (höchstens 72 px).
   Erst wenn sie dafür unter 26 px müsste – schmale Telefone –, darf die
   Zeile umbrechen, und dann in lesbarer Größe. */
function fitHero(){
  const h = $('#heroTitle'); if (!h) return;
  h.classList.remove('umbruch');
  h.style.fontSize = '72px';
  const w = h.clientWidth, sw = h.scrollWidth;
  if (!w) return;
  const g = sw > w ? Math.floor(72 * w / sw * 0.98) : 72;
  if (g < 26){ h.classList.add('umbruch'); h.style.fontSize = '34px'; }
  else h.style.fontSize = g + 'px';
}

function noteToMarkdown(n){
  const fm = ['---', 'title: '+n.title,
    'created: '+n.created, 'created_iso: '+new Date(n.createdSort||Date.now()).toISOString(),
    'modified: '+n.modified, 'modified_iso: '+new Date(n.modifiedSort||Date.now()).toISOString(),
    'author: '+n.author, 'tags: ['+n.tags.join(', ')+']'];
  /* Die Bindung an den Auftraggeber gehört in die Datei, nicht nur in den
     Browser – sonst ist sie weg, sobald der Ordner woanders geöffnet wird. */
  if (n.agbId) fm.push('auftraggeber_id: '+n.agbId);
  /* Würfel: Status, Priorität, Person – nur was gesetzt ist. */
  if (n.status) fm.push('status: '+nStatus(n));
  if (n.prio) fm.push('prioritaet: '+nPrio(n));
  if (nPerson(n)) fm.push('person: '+nPerson(n).replace(/[\r\n]/g,' '));
  if (n.source) fm.push('source: '+n.source);
  fm.push('---', '');
  return fm.join('\n') + linesToMd(n.content);
}
function parseMarkdownFile(text, filename, fileLastMod){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  let meta = {}, body = text;
  if (m){
    body = m[2];
    m[1].split(/\r?\n/).forEach(line => {
      const mm = line.match(/^(\w+):\s*(.*)$/); if (!mm) return;
      const key = mm[1], val = mm[2].trim();
      meta[key] = key === 'tags' ? val.replace(/^\[|\]$/g,'').split(',').map(s=>s.trim()).filter(Boolean) : val;
    });
  }
  const contentLines = bodyToLines(body);
  const agbId = meta.auftraggeber_id ? String(meta.auftraggeber_id) : null;
  const category = (meta.tags && meta.tags[0]) || 'Ohne Kategorie';
  const modSort = meta.modified_iso ? Date.parse(meta.modified_iso) : fileLastMod;
  const creSort = meta.created_iso ? Date.parse(meta.created_iso) : fileLastMod;
  return {
    title: meta.title || filename.replace(/\.md$/,''),
    category, tags: meta.tags && meta.tags.length ? meta.tags : [category],
    created: meta.created || fmt(new Date(creSort)), createdSort: creSort,
    modified: meta.modified || fmt(new Date(modSort)), modifiedSort: modSort,
    author: meta.author || 'Du', source: meta.source || null, agbId,
    status: STATUS_W.some(w => w[0] === meta.status) ? meta.status : 'offen',
    prio: PRIO_W.some(w => w[0] === meta.prioritaet) ? meta.prioritaet : 'mittel',
    person: meta.person ? String(meta.person).trim() : '',
    content: contentLines.length ? contentLines : ['(Kein Inhalt)'],
    filename, fileMtime: fileLastMod
  };
}
function exportMarkdown(n){
  const blob = new Blob([noteToMarkdown(n)], { type:'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (n.title.replace(/[\\/:*?"<>|]/g,'').trim() || 'notiz') + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    + '<div class="p-tags">'+n.tags.map(t=>'<span class="p-tag">'+esc(t)+'</span>').join('')+'</div>'

const hasFSAccess = 'showDirectoryPicker' in window;
let dirHandle = null;
let fsMode = 'none';   /* 'fs' | 'idb' | 'none' */
let idbPromise = null;

function idbOpen(){
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('noteos-store', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath:'filename' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      if (!db.objectStoreNames.contains('trash')) db.createObjectStore('trash', { keyPath:'filename' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;
}
const idbGetAllNotes = () => idbOpen().then(db => new Promise((res, rej) => {
  const req = db.transaction('notes','readonly').objectStore('notes').getAll();
  req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
}));
const idbPutNote = note => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction('notes','readwrite'); tx.objectStore('notes').put(note);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const idbSetMeta = (key, val) => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction('meta','readwrite'); tx.objectStore('meta').put(val, key);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const idbGetMeta = key => idbOpen().then(db => new Promise((res, rej) => {
  const req = db.transaction('meta','readonly').objectStore('meta').get(key);
  req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
}));
const idbRenameNote = (note, oldFilename) => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction('notes','readwrite');
  tx.objectStore('notes').put(note);
  tx.objectStore('notes').delete(oldFilename);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const idbMoveToTrash = n => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction(['notes','trash'],'readwrite');
  tx.objectStore('trash').put(n);
  tx.objectStore('notes').delete(n.filename);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));

function replaceNotes(list){
  /* Ein Durchgang für alle drei Wege herein (Ordner, IndexedDB, Zwischenspeicher):
     verknüpfte Notizen bekommen den heutigen Namen ihres Auftraggebers. */

function rebuildAccents(list){

async function loadNotesFromFolder(){
  const loaded = [];
  for await (const [name, handle] of dirHandle.entries()){
    if (handle.kind !== 'file' || !name.toLowerCase().endsWith('.md')) continue;
    try{
      const file = await handle.getFile();
      loaded.push(parseMarkdownFile(await file.text(), name, file.lastModified));
    }catch(e){}
  }
  loaded.sort((a,b)=>a.title.localeCompare(b.title,'de'));
  rebuildAccents(loaded);
  replaceNotes(loaded);
}
async function saveConflictCopy(filename, text){
  const dir = await dirHandle.getDirectoryHandle('Konflikte', { create:true });
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const fh = await dir.getFileHandle(filename.replace(/\.md$/, '.'+stamp+'.md'), { create:true });
  const wr = await fh.createWritable();
  await wr.write(text);
  await wr.close();
}
/* neue Datei zuerst schreiben, alte erst danach entfernen – nie eine Notiz verlieren */
async function renameNoteFile(note, newFilename){
  let conflict = false;
  const oldName = note.filename;
  try{
    const oldHandle = await dirHandle.getFileHandle(oldName);
    const existing = await oldHandle.getFile();
    if (note.fileMtime && existing.lastModified > note.fileMtime + 1500){
      await saveConflictCopy(oldName, await existing.text());
      conflict = true;
    }
  }catch(e){}
  note.filename = newFilename;
  note.fileMtime = null;
  await writeNoteFile(note);
  try{ await dirHandle.removeEntry(oldName); }catch(e){}
  return conflict;
}
async function writeNoteFile(note){
  if (fsMode !== 'fs' || !dirHandle) return false;
  const handle = await dirHandle.getFileHandle(note.filename, { create:true });
  let conflict = false;
  if (note.fileMtime){
    try{
      const existing = await handle.getFile();
      if (existing.lastModified > note.fileMtime + 1500){
        await saveConflictCopy(note.filename, await existing.text());
        conflict = true;
      }
    }catch(e){}
  }
  const writable = await handle.createWritable();
  await writable.write(noteToMarkdown(note));
  await writable.close();
  try{ note.fileMtime = (await handle.getFile()).lastModified; }catch(e){}
  return conflict;
}
const folderErrorMsg = () => 'Ordnerzugriff nicht möglich. Das kann an einer eingebetteten Vorschau liegen – öffne die Seite dazu einmal direkt in einem eigenen Browser-Tab.';

async function tryRestoreFolder(){

    if (!handle) return false;
    dirHandle = handle;
    const perm = await handle.queryPermission({ mode:'readwrite' });
    if (perm === 'granted'){ await loadNotesFromFolder(); fsMode = 'fs'; return true; }
    return 'needs-permission';
  }catch(e){ return false; }
}
async function reconnectFolder(){

    renderDeck(); updateFolderStatus();

function updateFolderStatus(errorMsg){
  const dot = $('#folderDot'), text = $('#folderStatusText');
  const bConnect = $('#folderConnect'), bReconnect = $('#folderReconnect');
  const bBulk = $('#folderBulkImport'), bDisconnect = $('#folderDisconnect'), bReload = $('#folderReload');

  if (!hasFSAccess){
    text.textContent = fsMode === 'idb'
      ? 'Firefox/Safari-Modus: '+notes.length+' Notiz(en) im Browser-Speicher dieses Geräts. Zusätzlich über „⎙ → Markdown exportieren" sichern.'
      : 'Kein Live-Ordnerzugriff in diesem Browser. Ordner einmalig einlesen – Speichern läuft dann über den Browser-Speicher plus manuellen Export.';

    dot.classList.add('on'); bDisconnect.hidden = false; bReload.hidden = false; return;

/* ═══════ Altbestand verknüpfen ═══════
   Bis hierher lief die Verbindung zum Auftragsbuch über den Namen: eine
   Kategorie hieß wie ein Auftraggeber, das war alles. Wer umbenannte,
   riss den Faden. Einmalig wird deshalb angeboten, aus diesen Namen eine
   feste Bindung zu machen – sichtbar, zum Abhaken, nichts im Stillen.

   Geschrieben wird nur, was du ankreuzt; die Dateien behalten alles
   andere. Wer ablehnt, wird nicht wieder gefragt. */
function verknuepfungKandidaten(){
  const kunden = agbNachName();
  if (!kunden.size) return [];
  const proKat = new Map();
  notes.forEach(n => {
    if (!n || n.agbId || !kunden.has(n.category)) return;
    proKat.set(n.category, (proKat.get(n.category) || 0) + 1);
  });
  return [...proKat.entries()]
    .map(([name, anzahl]) => ({ name, anzahl, agbId: kunden.get(name) }))
    .sort((a,b) => b.anzahl - a.anzahl || a.name.localeCompare(b.name,'de'));
}
let verknListe = [];
function verknuepfungAnbieten(){
  let schonGefragt = false;
  try { schonGefragt = localStorage.getItem(WB_MIGR_LS) === 'nein'; } catch(e){}
  if (schonGefragt) return;
  verknListe = verknuepfungKandidaten();
  if (!verknListe.length) return;
  const summe = verknListe.reduce((s,k) => s + k.anzahl, 0);
  const eine = verknListe.length === 1;
  $('#verknText').textContent = (eine
      ? 'Eine Kategorie heißt wie ein Auftraggeber im Auftragsbuch'
      : verknListe.length + ' Kategorien heißen wie Auftraggeber im Auftragsbuch')
    + ' – zusammen ' + summe + ' Notiz' + (summe === 1 ? '' : 'en') + '. '
    + 'Fest verknüpft übersteh' + (eine ? 't sie' : 'en sie') + ' ein Umbenennen drüben.';
  $('#verknListe').innerHTML = verknListe.map((k, i) =>
      '<label><input type="checkbox" data-v="' + i + '" checked>'
    + '<span style="flex:1;min-width:0"><b>' + esc(k.name) + '</b>'
    + '<span>' + k.anzahl + ' Notiz' + (k.anzahl === 1 ? '' : 'en') + ' · ' + esc(k.agbId) + '</span></span></label>').join('');
  $('#verknOverlay').hidden = false;
}
function verknuepfungSchliessen(nieWieder){
  $('#verknOverlay').hidden = true;
  if (nieWieder) { try { localStorage.setItem(WB_MIGR_LS, 'nein'); } catch(e){} }
}
$('#verknSpaeter').addEventListener('click', () => verknuepfungSchliessen(true));
$('#verknOverlay').addEventListener('click', e => { if (e.target.id === 'verknOverlay') verknuepfungSchliessen(true); });
$('#verknOk').addEventListener('click', async () => {
  const gewaehlt = $$('#verknListe input:checked').map(b => verknListe[+b.dataset.v]).filter(Boolean);
  verknuepfungSchliessen(true);
  if (!gewaehlt.length) return;
  const nachName = new Map(gewaehlt.map(k => [k.name, k.agbId]));
  const betroffen = notes.filter(n => !n.agbId && nachName.has(n.category));
  betroffen.forEach(n => { n.agbId = nachName.get(n.category); });
  let geschrieben = 0, fehler = 0;
  for (const n of betroffen) {
    try {
      if (fsMode === 'fs') await writeNoteFile(n);
      else if (fsMode === 'idb') await idbPutNote(n);
      geschrieben++;
    } catch(e){ fehler++; }
  }
  updateHero();
  WB.melden('noteos', { was:'verknuepft' });
  toast(fsMode === 'none'
    ? betroffen.length + ' Notizen verknüpft – ohne Ordner nur für diese Sitzung.'
    : geschrieben + ' Notiz' + (geschrieben === 1 ? '' : 'en') + ' verknüpft'
      + (fehler ? ', ' + fehler + ' fehlgeschlagen' : '') + '.');
});

/* ───────── Dialog & Toast ───────── */
let confirmResolve = null;
function confirmDialog(text, okLabel='In den Papierkorb'){
  return new Promise(resolve => {
    confirmResolve = resolve;
    $('#confirmText').textContent = text;
    $('#confirmOk').textContent = okLabel;
    $('#confirmOverlay').hidden = false;
  });
}
function closeConfirm(result){
  $('#confirmOverlay').hidden = true;
  if (confirmResolve){ const r = confirmResolve; confirmResolve = null; r(result); }
}
$('#confirmOk').addEventListener('click', () => closeConfirm(true));
$('#confirmCancel').addEventListener('click', () => closeConfirm(false));
$('#confirmOverlay').addEventListener('click', e => { if (e.target.id === 'confirmOverlay') closeConfirm(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#confirmOverlay').hidden) closeConfirm(false);
  else if (e.key === 'Escape' && !$('#verknOverlay').hidden) verknuepfungSchliessen(true);
});
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('aktion'); t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
/* Hinweis mit Knopf – bleibt länger stehen, damit „Rückgängig“ erreichbar ist. */
function toastAktion(msg, label, fn){
  const t = $('#toast');
  t.innerHTML = '<span>'+esc(msg)+'</span><button type="button" id="toastUndo">'+esc(label)+'</button>';
  t.classList.add('show','aktion');
  clearTimeout(toastTimer);
  const zu = () => { t.classList.remove('show','aktion'); };
  $('#toastUndo').addEventListener('click', () => { clearTimeout(toastTimer); zu(); fn(); }, { once:true });
  toastTimer = setTimeout(zu, 7000);
}

/* ───────── Löschen ───────── */
async function moveFileToTrash(n){
  const trashDir = await dirHandle.getDirectoryHandle('Papierkorb', { create:true });
  const fh = await trashDir.getFileHandle(n.filename, { create:true });
  const wr = await fh.createWritable();
  await wr.write(noteToMarkdown(n));
  await wr.close();
  await dirHandle.removeEntry(n.filename);
}
/* Löschen ohne Rückfrage: die Notiz wandert ohnehin in den Papierkorb,
   und der Hinweis unten bietet „Rückgängig“ an. Eine Frage vor jedem
   Löschen bremst nur – Sicherheit gibt das Zurückholen. */
const idbTrashDelete = filename => idbOpen().then(db => new Promise((res, rej) => {
  const tx = db.transaction('trash','readwrite'); tx.objectStore('trash').delete(filename);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
async function notizWeg(n){
  if (!n) return;
  try{
    if (fsMode === 'fs' && dirHandle && n.filename) await moveFileToTrash(n);
    else if (fsMode === 'idb' && n.filename) await idbMoveToTrash(n);
  }catch(err){
    toast('Verschieben fehlgeschlagen – Notiz bleibt erhalten.');
    return;
  }
  const idx = notes.indexOf(n);
  const warOffen = reading && notes[curIdx] === n;
  if (idx >= 0) notes.splice(idx, 1);
  notes.forEach((x,i) => x.id = i);       /* ids sind Array-Positionen */
  hoverZu();
  renderDeck();
  WB.melden('noteos', { was:'geloescht' });
  if (!notes.length){ closeNote(); }
  else if (warOffen){
    curIdx = Math.min(idx, notes.length - 1);
    renderSheet();
  } else if (curIdx >= notes.length) curIdx = notes.length - 1;
  toastAktion('„'+n.title+'“ liegt im Papierkorb.', 'Rückgängig', () => notizZurueck(n));
}
async function notizZurueck(n){
  try{
    if (fsMode === 'fs' && dirHandle && n.filename){
      n.fileMtime = null;
      await writeNoteFile(n);
      try { const pk = await dirHandle.getDirectoryHandle('Papierkorb'); await pk.removeEntry(n.filename); } catch(e){}
    } else if (fsMode === 'idb' && n.filename){
      await idbPutNote(n);
      try { await idbTrashDelete(n.filename); } catch(e){}
    }
  }catch(err){ toast('Zurückholen fehlgeschlagen – die Notiz liegt weiter im Papierkorb.'); return; }
  notes.push(n);
  notes.forEach((x,i) => x.id = i);
  renderDeck();
  WB.melden('noteos', { was:'neu' });
  toast('„'+n.title+'“ ist zurück.');
}
$('#delBtn').addEventListener('click', () => {
  const n = notes[curIdx];
  if (n) notizWeg(n);
});

/* ───────── Vorschau beim Überfahren ─────────
   Mit der Maus über eine Karte (Haufen, Tafel, Würfel) zeigt nach kurzem
   Verweilen die Notiz selbst: Kategorie, Status, Priorität, Person, Tags
   und der Anfang des Textes – formatiert. Am Telefon gibt es kein Hover;
   dort bleibt es beim Antippen. */
const hv = $('#hover');
let hvTimer = null, hvId = null;
const HV_SEL = '.kc, .pile.open .sticky, .wb.is-front .sticky';
function hoverZu(){ clearTimeout(hvTimer); hvTimer = null; hvId = null; hv.hidden = true; hv.classList.remove('on'); }
function hoverAuf(el){
  const n = notes[+el.dataset.note];
  if (!n || zug || reading) return;
  hvId = n.id;
  const tags = n.tags.filter(t => t !== n.category);
  hv.style.setProperty('--acc', n.accent);
  hv.innerHTML =
      '<div class="hv-kick"><span class="hv-dot"></span>'+esc(n.category)+'<span class="hv-d">'+esc(n.modified)+'</span></div>'
    + '<div class="hv-t">'+esc(n.title)+'</div>'
    + '<div class="hv-k"><span class="kb-s" data-s="'+nStatus(n)+'">'+esc(statusLabel(nStatus(n)))+'</span>'
    +   '<span class="kb-p" data-p="'+nPrio(n)+'">'+esc(prioLabel(nPrio(n)))+'</span>'
    +   '<span class="kb-w">'+(nPerson(n) ? esc(nPerson(n)) : 'niemand')+'</span></div>'
    + (tags.length ? '<div class="hv-tags">'+tags.map(t => '<span>#'+esc(t)+'</span>').join('')+'</div>' : '')
    + '<div class="hv-b">'+contentToHtml((n.content || []).slice(0, 14))+'</div>';
  hv.hidden = false;
  const r = el.getBoundingClientRect(), w = Math.min(340, innerWidth - 24);
  hv.style.width = w + 'px';
  const h = hv.offsetHeight;
  let x, y = Math.max(70, Math.min(r.top, innerHeight - h - 12));
  if (r.right + 12 + w <= innerWidth - 12) x = r.right + 12;              /* rechts daneben */
  else if (r.left - 12 - w >= 12) x = r.left - w - 12;                    /* links daneben */
  else {                                                                   /* kein Platz: darunter oder darüber */
    x = Math.max(12, Math.min(innerWidth - w - 12, r.left + r.width/2 - w/2));
    y = r.bottom + 10 + h < innerHeight ? r.bottom + 10 : Math.max(12, r.top - h - 10);
  }
  hv.style.left = x + 'px'; hv.style.top = y + 'px';
  requestAnimationFrame(() => hv.classList.add('on'));
}
deck.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest(HV_SEL);
  if (!el){ return; }
  if (+el.dataset.note === hvId) return;
  clearTimeout(hvTimer);
  if (!hv.hidden) { hoverAuf(el); return; }           /* schon offen: gleich weiterwandern */
  hvTimer = setTimeout(() => hoverAuf(el), 380);
});
deck.addEventListener('pointerout', e => {
  if (e.pointerType !== 'mouse') return;
  const von = e.target.closest(HV_SEL), nach = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest(HV_SEL) : null;
  if (von && von !== nach) hoverZu();
});
addEventListener('scroll', hoverZu, { passive:true, capture:true });
['pointerdown','keydown'].forEach(ev => addEventListener(ev, hoverZu, true));

/* ───────── Start ───────── */
WBTor.start(function(){
renderDeck();
applyView();
requestAnimationFrame(() => { if (viewMode === 'kamm'){ measurePanes(); centerPane(paneIdx, 'auto'); } });
updateTagBtn();
initStorage();
const startHash = /^#n(\d+)$/.exec(location.hash);
if (startHash && notes[+startHash[1]]){
  history.replaceState(null, '', location.pathname + location.search);
  requestAnimationFrame(() => openNote(+startHash[1]));
}
});
})();
</script>
